<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>Đã tạo phiếu thuê sản xuất</title>
</head>
<body>
  <p>{% if success_message %}{{ success_message }}{% else %}Đã tạo phiếu {{ item.code }}.{% endif %}</p>
  <script>
    {% if print_url %}
    window.open('{{ print_url|escapejs }}', 'jpSubcontractPrint');
    {% endif %}
    window.parent.postMessage({
      type: 'jp-subcontract-created',
      itemId: {% if item.pk %}{{ item.pk }}{% else %}null{% endif %},
      itemCode: '{{ item.code|escapejs }}'
    }, window.location.origin);
  </script>
</body>
</html>
