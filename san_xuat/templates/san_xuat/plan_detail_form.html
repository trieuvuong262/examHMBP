{% extends 'base.html' %}

{% block content %}
<div class="container jp-page jp-sx-page py-3 py-md-4 mb-5">
    <div class="jp-npl-mat-topbar">
    <h2 class="jp-npl-mat-topbar-title">Lập KH chi tiết</h2>
    <div class="jp-npl-mat-topbar-actions ms-auto">
      <a href="{% url 'san_xuat:plan_detail' %}" class="btn btn-outline-secondary btn-sm fw-bold">Quay lại</a>
    </div>
  </div>

  <div class="card border-0 shadow-sm">
    <div class="card-body">
      <form method="post">
        {% csrf_token %}
        {% for field in form %}
        <div class="mb-3">
          <label class="form-label small text-muted" for="{{ field.id_for_label }}">{{ field.label }}</label>
          {{ field }}
          {% if field.errors %}<div class="text-danger small">{{ field.errors }}</div>{% endif %}
        </div>
        {% endfor %}
        <button type="submit" class="btn btn-hm">Explode → kế hoạch chi tiết</button>
      </form>
      <div class="form-text mt-3">
        Cần kế hoạch tổng thể đã xác nhận và có ít nhất một dòng SP với SL kế hoạch &gt; 0.
      </div>
    </div>
  </div>
</div>
{% endblock %}
