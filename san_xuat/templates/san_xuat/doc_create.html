{% extends 'base.html' %}

{% block content %}
<div class="container jp-page jp-sx-page py-3 py-md-4 mb-5" style="max-width: 640px;">
      <div class="jp-npl-mat-topbar">
    <h2 class="jp-npl-mat-topbar-title">Thêm hồ sơ SX</h2>
    <div class="jp-npl-mat-topbar-actions ms-auto">
      <a href="{% url 'san_xuat:doc_list' %}" class="btn btn-outline-secondary">Quay lại</a>
    </div>
  </div>

    <div class="card border-0 shadow-sm">
        <div class="card-body p-4">
            <form method="post" novalidate>
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label" for="{{ form.product_code.id_for_label }}">{{ form.product_code.label }}</label>
                    {{ form.product_code }}
                    <datalist id="sx-product-code-list"></datalist>
                    <div class="form-text">Gõ để tìm mã trên mirror KiotViet.</div>
                    {% if form.product_code.errors %}<div class="text-danger small">{{ form.product_code.errors }}</div>{% endif %}
                </div>
                <div class="mb-3">
                    <label class="form-label" for="{{ form.notes.id_for_label }}">{{ form.notes.label }}</label>
                    {{ form.notes }}
                </div>
                <button type="submit" class="btn btn-hm">Tạo hồ sơ + BOM nháp</button>
            </form>
        </div>
    </div>
</div>
<script>
(function () {
  const input = document.getElementById('{{ form.product_code.id_for_label }}');
  const list = document.getElementById('sx-product-code-list');
  if (!input || !list) return;
  let timer = null;
  input.addEventListener('input', function () {
    clearTimeout(timer);
    const q = input.value.trim();
    if (q.length < 2) return;
    timer = setTimeout(function () {
      fetch('{% url "san_xuat:product_code_search" %}?q=' + encodeURIComponent(q))
        .then(r => r.json())
        .then(data => {
          list.innerHTML = '';
          (data.results || []).forEach(row => {
            const opt = document.createElement('option');
            opt.value = row.code;
            opt.label = row.text || row.code;
            list.appendChild(opt);
          });
        });
    }, 250);
  });
})();
</script>
{% endblock %}
