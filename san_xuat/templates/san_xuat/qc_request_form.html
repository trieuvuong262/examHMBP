{% extends 'base.html' %}

{% block content %}
<div class="container jp-page jp-sx-page py-3 py-md-4 mb-5" style="max-width: 760px;">
    <div class="jp-page-header mb-3 mb-md-4">
        <div>
            <h2 class="fw-bold text-hm mb-1 jp-page-title">Tạo yêu cầu kiểm tra</h2>
        </div>
        <a href="{% url 'san_xuat:qc_request' %}" class="btn btn-outline-secondary btn-sm">Quay lại</a>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-body p-4">
            <form method="post" novalidate>
                {% csrf_token %}
                {% for field in form %}
                <div class="mb-3">
                    <label class="form-label small text-muted" for="{{ field.id_for_label }}">{{ field.label }}</label>
                    {{ field }}
                    {% if field.help_text %}<div class="form-text">{{ field.help_text }}</div>{% endif %}
                    {% if field.errors %}<div class="text-danger small">{{ field.errors }}</div>{% endif %}
                </div>
                {% endfor %}
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-hm">Lưu yêu cầu kiểm tra</button>
                    <a href="{% url 'san_xuat:qc_request' %}" class="btn btn-outline-secondary">Hủy</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
