{% extends 'base.html' %}

{% block content %}
<div class="container jp-page jp-sx-page py-3 py-md-4 mb-5">
    <div class="jp-npl-mat-topbar">
    <h2 class="jp-npl-mat-topbar-title">{{ title }}</h2>
    <div class="jp-npl-mat-topbar-actions ms-auto">
      <a href="{% url 'san_xuat:costing_cost_types' %}" class="btn btn-outline-secondary btn-sm fw-bold">Quay lại</a>
    </div>
  </div>

  <div class="card border-0 shadow-sm">
    <div class="card-body">
      <form method="post">
        {% csrf_token %}
        {% for field in form %}
        <div class="mb-3{% if field.name == 'is_active' %} form-check{% endif %}">
          {% if field.name == 'is_active' %}
            {{ field }}
            <label class="form-check-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
          {% else %}
            <label class="form-label small text-muted" for="{{ field.id_for_label }}">{{ field.label }}</label>
            {{ field }}
          {% endif %}
          {% if field.errors %}<div class="text-danger small">{{ field.errors }}</div>{% endif %}
        </div>
        {% endfor %}
        <button type="submit" class="btn btn-hm">Lưu</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
