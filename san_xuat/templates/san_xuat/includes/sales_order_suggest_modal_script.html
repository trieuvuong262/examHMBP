{# Chạy trong {% block scripts %} — sau bootstrap.bundle.js + TomSelect #}
<script>
(function () {
  var DEFAULT_SIZES = {{ suggest_sizes_json|safe }};
  var ALL_SIZES = {{ suggest_sizes_all_json|safe }};
  var SIZES = ALL_SIZES.slice();
  var SIZE_ALIASES = {
    XXL: '2XL', '2XL': '2XL',
    XXXL: '3XL', '3XL': '3XL',
    '4XL': '4XL', '5XL': '5XL', '6XL': '6XL',
  };
  var stockUrl = '{% url "san_xuat:suggest_qty_stock" %}';
  var modalEl = document.getElementById('jpSoSuggestModal');
  var openBtn = document.getElementById('jp-so-suggest-open');
  if (!modalEl || !openBtn || !window.bootstrap || !bootstrap.Modal) return;

  var coefEl = document.getElementById('jp-so-sg-coef');
  var roundEl = document.getElementById('jp-so-sg-round');
  var productEl = document.getElementById('jp-so-sg-product');
  var periodEl = document.getElementById('jp-so-sg-period');
  var totalEl = document.getElementById('jp-so-sg-total');
  var breakdownEl = document.getElementById('jp-so-sg-breakdown');
  var expandBtn = document.getElementById('jp-so-sg-expand');
  var dialogEl = document.getElementById('jp-so-sg-dialog');
  var modal = bootstrap.Modal.getOrCreateInstance(modalEl, { focus: false });
  var activeQtyInput = null;
  var productTs = null;
  var expanded = false;

  function num(el, fallback) {
    if (!el) return fallback;
    var v = parseFloat(String(el.value || '').replace(',', '.'));
    return Number.isFinite(v) ? v : fallback;
  }

  function roundUp(value, step) {
    if (!Number.isFinite(value) || value <= 0) return 0;
    var s = step > 0 ? step : 1;
    return Math.ceil(value / s) * s;
  }

  function fmt(n) {
    if (!Number.isFinite(n)) return '0';
    return String(Math.round(n));
  }

  function canonSize(raw) {
    var s = String(raw || '').trim().toUpperCase();
    if (!s) return '';
    if (SIZE_ALIASES[s]) return SIZE_ALIASES[s];
    return s;
  }

  function stockInput(size) {
    return modalEl.querySelector('.jp-so-sg-stock[data-size="' + size + '"]');
  }
  function velocityInput(size) {
    return modalEl.querySelector('.jp-so-sg-velocity[data-size="' + size + '"]');
  }
  function rawCell(size) {
    return modalEl.querySelector('.jp-so-sg-raw[data-size="' + size + '"]');
  }
  function outCell(size) {
    return modalEl.querySelector('.jp-so-sg-out[data-size="' + size + '"]');
  }

  function visibleSizes() {
    return expanded ? ALL_SIZES.slice() : DEFAULT_SIZES.slice();
  }

  function setExpanded(on) {
    expanded = !!on;
    modalEl.classList.toggle('is-sizes-collapsed', !expanded);
    if (dialogEl) dialogEl.classList.toggle('jp-so-sg-wide', expanded);
    if (expandBtn) {
      expandBtn.setAttribute('aria-expanded', expanded ? 'true' : 'false');
      var label = expandBtn.querySelector('.jp-so-sg-expand-label');
      var icon = expandBtn.querySelector('i');
      if (label) label.textContent = expanded ? 'Thu gọn size' : 'Mở rộng size';
      if (icon) {
        icon.className = expanded ? 'bi bi-arrows-collapse me-1' : 'bi bi-arrows-expand me-1';
      }
    }
    recalc();
  }

  var periodMeta = document.getElementById('jp-so-sg-period-meta');

  function periodDays() {
    var d = Math.round(num(periodEl, 30));
    if (d < 1) d = 1;
    if (d > 365) d = 365;
    if (periodEl && String(periodEl.value) !== String(d)) periodEl.value = String(d);
    return d;
  }

  function applyStockMap(stockMap) {
    stockMap = stockMap || {};
    ALL_SIZES.forEach(function (sz) {
      var el = stockInput(sz);
      if (!el) return;
      if (Object.prototype.hasOwnProperty.call(stockMap, sz)) {
        el.value = String(Math.round(Number(stockMap[sz]) || 0));
        el.classList.add('is-from-kho');
      } else {
        el.value = '0';
        el.classList.remove('is-from-kho');
      }
    });
    recalc();
  }

  function applyVelocityMap(velMap) {
    velMap = velMap || {};
    ALL_SIZES.forEach(function (sz) {
      var el = velocityInput(sz);
      if (!el) return;
      if (Object.prototype.hasOwnProperty.call(velMap, sz)) {
        el.value = String(Math.round(Number(velMap[sz]) || 0));
        el.classList.add('is-from-kv');
      } else {
        el.value = '0';
        el.classList.remove('is-from-kv');
      }
    });
    recalc();
  }

  function currentStyle() {
    if (productTs && productTs.getValue()) return String(productTs.getValue() || '').trim();
    return (productEl && productEl.value || '').trim();
  }

  function loadStockForStyle(style) {
    style = (style || '').trim();
    var days = periodDays();
    if (!style) {
      if (periodMeta) {
        periodMeta.textContent = 'Tốc độ tiêu thụ = tổng SL bán KiotViet trong ' + days + ' ngày gần nhất';
      }
      applyStockMap({});
      applyVelocityMap({});
      return;
    }
    fetch(stockUrl + '?style=' + encodeURIComponent(style) + '&days=' + encodeURIComponent(String(days)), {
      headers: { 'Accept': 'application/json' },
      credentials: 'same-origin',
    })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        var stockMap = {};
        var velMap = {};
        (data.sizes || []).forEach(function (row) {
          var sz = canonSize(row.size);
          if (!sz || ALL_SIZES.indexOf(sz) === -1) return;
          stockMap[sz] = (stockMap[sz] || 0) + (Number(row.stock_qty) || Number(row.stock) || 0);
          velMap[sz] = (velMap[sz] || 0) + (Number(row.velocity_qty) || Number(row.velocity) || 0);
        });
        applyStockMap(data.found ? stockMap : {});
        applyVelocityMap(data.found ? velMap : {});

        var hasNumeric = (data.sizes || []).some(function (row) {
          return /^[0-9]+$/.test(String(row.size || '').trim());
        });
        if (hasNumeric && !expanded) setExpanded(true);

        if (periodMeta) {
          var from = data.sold_from || '';
          var to = data.sold_to || '';
          periodMeta.textContent = from && to
            ? ('Tiêu thụ KV ' + days + ' ngày (' + from + ' → ' + to + ')')
            : ('Tốc độ tiêu thụ = tổng SL bán KiotViet trong ' + days + ' ngày gần nhất');
        }
      })
      .catch(function () {});
  }

  function recalc() {
    var coef = num(coefEl, 2);
    var step = num(roundEl, 50);
    var total = 0;
    var parts = [];
    var vis = visibleSizes();
    var visSet = {};
    vis.forEach(function (sz) { visSet[sz] = true; });

    ALL_SIZES.forEach(function (sz) {
      var stock = num(stockInput(sz), 0);
      var vel = num(velocityInput(sz), 0);
      var raw = (vel * coef) - stock;
      var sug = roundUp(raw, step);
      var rawEl = rawCell(sz);
      var sugEl = outCell(sz);
      if (rawEl) rawEl.textContent = fmt(raw);
      if (sugEl) sugEl.textContent = fmt(sug);
      if (visSet[sz]) {
        total += sug;
        if (sug > 0) parts.push(sz + ':' + fmt(sug));
      }
    });
    if (totalEl) totalEl.textContent = fmt(total);
    if (breakdownEl) {
      breakdownEl.textContent = parts.length ? ('(' + parts.join(' · ') + ')') : '';
    }
    return total;
  }

  function productLabel() {
    if (productTs && productTs.getValue()) {
      var opt = productTs.options[productTs.getValue()];
      if (opt) return (opt.name || opt.text || opt.code || '').trim();
    }
    return (productEl && productEl.value) || '';
  }

  var productBound = false;

  function bindProductChange() {
    if (!productTs || productBound) return;
    productBound = true;
    productTs.on('change', function (value) {
      loadStockForStyle(value || '');
    });
  }

  function initProductSelect() {
    if (!productEl) return false;
    if (productEl.tomselect) {
      productTs = productEl.tomselect;
      bindProductChange();
      return true;
    }
    if (productTs) {
      bindProductChange();
      return true;
    }
    // Dùng đúng helper đang chạy tốt ở cột «Mã SP» (dropdownParent=body)
    if (typeof window.jpInitProductCodeSelect === 'function') {
      productTs = window.jpInitProductCodeSelect(productEl);
    } else if (typeof TomSelect !== 'undefined') {
      var searchUrl = '{% url "san_xuat:product_code_search" %}';
      productTs = new TomSelect(productEl, {
        maxOptions: 40,
        maxItems: 1,
        valueField: 'id',
        labelField: 'text',
        searchField: ['text', 'code', 'name'],
        placeholder: productEl.dataset.placeholder || 'Gõ mã SX hoặc tên sản phẩm…',
        dropdownParent: 'body',
        openOnFocus: true,
        loadThrottle: 220,
        load: function (query, callback) {
          fetch(searchUrl + '?q=' + encodeURIComponent(query || ''), {
            headers: { 'Accept': 'application/json' },
          })
            .then(function (r) { return r.json(); })
            .then(function (data) { callback(data.results || []); })
            .catch(function () { callback(); });
        },
        render: {
          option: function (data, escape) {
            return '<div>' + escape(data.text || data.code || '') + '</div>';
          },
          item: function (data, escape) {
            var label = data.text || (data.code && data.name ? (data.code + ' — ' + data.name) : (data.code || ''));
            return '<div>' + escape(label) + '</div>';
          },
        },
      });
    } else {
      console.warn('[jp-so-suggest] TomSelect / jpInitProductCodeSelect chưa sẵn sàng');
      return false;
    }
    if (!productTs) return false;
    bindProductChange();
    return true;
  }

  function resetDefaults() {
    if (coefEl) coefEl.value = '2';
    if (roundEl) roundEl.value = '50';
    if (periodEl) periodEl.value = '30';
    if (productTs) productTs.clear(true);
    if (periodMeta) {
      periodMeta.textContent = 'Tốc độ tiêu thụ = tổng SL bán KiotViet trong 30 ngày gần nhất';
    }
    ALL_SIZES.forEach(function (sz) {
      var s = stockInput(sz);
      var v = velocityInput(sz);
      if (s) { s.value = '0'; s.classList.remove('is-from-kho'); }
      if (v) { v.value = '0'; v.classList.remove('is-from-kv'); }
    });
    setExpanded(false);
    recalc();
  }

  function seedFromForm() {
    var codeSelect = document.querySelector('#jp-so-lines-table tbody tr.jp-so-line-row:not([style*="display: none"]) .jp-sx-product-code-select');
    var code = '';
    if (codeSelect) {
      code = (codeSelect.tomselect && codeSelect.tomselect.getValue()) || codeSelect.value || '';
    }
    if (code && productTs && !productTs.getValue()) {
      var nameInput = document.querySelector('#jp-so-lines-table tbody tr.jp-so-line-row:not([style*="display: none"]) input[name$="-product_name"]');
      var name = nameInput ? nameInput.value.trim() : '';
      if (!productTs.options[code]) {
        productTs.addOption({
          id: code,
          code: code,
          text: name ? (code + ' — ' + name) : code,
          name: name,
        });
      }
      productTs.setValue(code, true);
      loadStockForStyle(code);
    }
    recalc();
  }

  function findTargetQtyInput() {
    if (activeQtyInput && document.body.contains(activeQtyInput)) {
      var row = activeQtyInput.closest('tr');
      if (row && row.style.display !== 'none') return activeQtyInput;
    }
    var rows = document.querySelectorAll('#jp-so-lines-table tbody tr.jp-so-line-row');
    for (var i = 0; i < rows.length; i++) {
      var r = rows[i];
      if (r.style.display === 'none') continue;
      var del = r.querySelector('input[type=checkbox][name$="-DELETE"]');
      if (del && del.checked) continue;
      var qty = r.querySelector('input[name$="-qty"]');
      if (qty) return qty;
    }
    return null;
  }

  function applyToForm() {
    var total = recalc();
    var qty = findTargetQtyInput();
    if (!qty) {
      window.alert('Chưa có dòng sản phẩm để áp dụng. Thêm sản phẩm trước.');
      return;
    }
    qty.value = String(Math.round(total));
    qty.dispatchEvent(new Event('input', { bubbles: true }));
    qty.dispatchEvent(new Event('change', { bubbles: true }));

    var row = qty.closest('tr');
    if (row && productTs && productTs.getValue()) {
      var sel = row.querySelector('.jp-sx-product-code-select');
      if (sel && !(sel.value || (sel.tomselect && sel.tomselect.getValue()))) {
        var code = productTs.getValue();
        var opt = productTs.options[code];
        if (sel.tomselect) {
          if (!sel.tomselect.options[code] && opt) sel.tomselect.addOption(opt);
          sel.tomselect.setValue(code);
        } else {
          sel.value = code;
        }
        var nameInput = row.querySelector('input[name$="-product_name"]');
        if (nameInput && opt) nameInput.value = (opt.name || '').trim();
      }
    }

    qty.focus();
    qty.classList.add('border-success');
    setTimeout(function () { qty.classList.remove('border-success'); }, 1200);

    var notes = document.getElementById('id_notes');
    if (notes) {
      var product = productLabel();
      var period = periodDays() + ' ngày';
      var parts = [];
      visibleSizes().forEach(function (sz) {
        var sug = parseInt((outCell(sz) || {}).textContent || '0', 10) || 0;
        if (sug > 0) parts.push(sz + '=' + sug);
      });
      var line = 'Đề xuất' + (product ? ' ' + product : '')
        + (period ? ' (' + period + ')' : '')
        + ': tổng ' + Math.round(total)
        + (parts.length ? ' [' + parts.join(', ') + ']' : '');
      var cur = (notes.value || '').trim();
      notes.value = cur ? (cur + '\n' + line) : line;
    }
    modal.hide();
  }

  function copyTable() {
    var sizes = visibleSizes();
    var coef = num(coefEl, 2);
    var step = num(roundEl, 50);
    var lines = [];
    lines.push('Size\t' + sizes.join('\t'));
    lines.push('Hệ số\t' + coef);
    lines.push('Làm tròn\t' + step);
    lines.push('Loại hàng\t' + productLabel());
    lines.push('Thời gian dự đoán\t' + periodDays() + ' ngày');
    lines.push('Tồn kho thực tế\t' + sizes.map(function (sz) { return fmt(num(stockInput(sz), 0)); }).join('\t'));
    lines.push('Tốc độ tiêu thụ\t' + sizes.map(function (sz) { return fmt(num(velocityInput(sz), 0)); }).join('\t'));
    lines.push('Giá trị sau khi tính\t' + sizes.map(function (sz) { return (rawCell(sz) || {}).textContent || '0'; }).join('\t'));
    lines.push('Giá trị đề xuất\t' + sizes.map(function (sz) { return (outCell(sz) || {}).textContent || '0'; }).join('\t'));
    var text = lines.join('\n');
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () {
        var btn = document.getElementById('jp-so-sg-copy');
        if (!btn) return;
        var old = btn.textContent;
        btn.textContent = 'Đã sao chép';
        setTimeout(function () { btn.textContent = old; }, 1200);
      });
    } else {
      window.prompt('Sao chép bảng:', text);
    }
  }

  // Chỉ init khi modal đã hiện (tránh TomSelect lỗi khi display:none)
  setExpanded(false);

  if (expandBtn) {
    expandBtn.addEventListener('click', function () {
      setExpanded(!expanded);
    });
  }

  modalEl.addEventListener('shown.bs.modal', function () {
    var ok = initProductSelect();
    seedFromForm();
    if (!ok) {
      setTimeout(function () {
        initProductSelect();
        seedFromForm();
        if (productTs) {
          try { productTs.focus(); } catch (e) {}
        }
      }, 350);
    } else if (productTs) {
      setTimeout(function () {
        try { productTs.focus(); } catch (e) {}
      }, 80);
    }
  });

  modalEl.addEventListener('input', function (e) {
    if (!e.target || !e.target.matches) return;
    if (e.target.id === 'jp-so-sg-period') {
      // Đổi số ngày → tải lại tiêu thụ KV
      var t = e.target._jpDaysTimer;
      if (t) clearTimeout(t);
      e.target._jpDaysTimer = setTimeout(function () {
        loadStockForStyle(currentStyle());
      }, 350);
      return;
    }
    if (e.target.matches('input')) recalc();
  });

  var resetBtn = document.getElementById('jp-so-sg-reset');
  var copyBtn = document.getElementById('jp-so-sg-copy');
  var applyBtn = document.getElementById('jp-so-sg-apply');
  if (resetBtn) resetBtn.addEventListener('click', resetDefaults);
  if (copyBtn) copyBtn.addEventListener('click', copyTable);
  if (applyBtn) applyBtn.addEventListener('click', applyToForm);

  document.addEventListener('focusin', function (e) {
    var t = e.target;
    if (t && t.matches && t.matches('#jp-so-lines-table input[name$="-qty"]')) {
      activeQtyInput = t;
    }
  });

  recalc();
})();
</script>
