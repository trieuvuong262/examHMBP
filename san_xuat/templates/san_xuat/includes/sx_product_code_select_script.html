{# TomSelect product code — san_xuat:product_code_search #}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tom-select@2.4.1/dist/css/tom-select.bootstrap5.min.css">
<script src="https://cdn.jsdelivr.net/npm/tom-select@2.4.1/dist/js/tom-select.complete.min.js"></script>
<style>
body > .ts-dropdown { z-index: 2200; }
body > .ts-dropdown.jp-sx-product-dd {
  min-width: min(28rem, 92vw);
}
body > .ts-dropdown.jp-sx-product-dd .option {
  padding: .35rem .65rem;
}
.jp-sx-product-opt {
  display: grid;
  grid-template-columns: 36px 1fr minmax(4.75rem, 30%);
  align-items: center;
  column-gap: .65rem;
  width: 100%;
  min-width: 0;
}
.jp-sx-product-opt.is-simple {
  grid-template-columns: 36px 1fr;
}
.jp-sx-product-opt-img {
  width: 36px;
  height: 36px;
  border-radius: 4px;
  object-fit: cover;
  background: #f1f5f9;
  border: 1px solid #e2e8f0;
  display: block;
}
.jp-sx-product-opt-img.is-empty {
  display: block;
}
.jp-sx-product-opt-name {
  min-width: 0;
  text-align: center;
  font-weight: 600;
  font-size: .85rem;
  line-height: 1.25;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.jp-sx-product-opt-name.is-start { text-align: left; }
.jp-sx-product-opt-color {
  min-width: 0;
  text-align: right;
  color: #64748b;
  font-size: .78rem;
  line-height: 1.25;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
[data-theme="dark"] .jp-sx-product-opt-img,
[data-theme="dark"] .jp-sx-product-opt-img.is-empty {
  background: #1e293b;
  border-color: #334155;
}
[data-theme="dark"] .jp-sx-product-opt-color {
  color: #94a3b8;
}
</style>
<script>
(function () {
  if (typeof TomSelect === 'undefined') return;
  var searchUrl = '{% url "san_xuat:product_code_search" %}';

  function findNameInput(select) {
    var target = (select.dataset.fillName || '').trim();
    if (target) {
      return document.querySelector(target) || document.getElementById(target.replace(/^#/, ''));
    }
    var id = select.id || '';
    if (id && id.indexOf('product_code') !== -1) {
      var byId = document.getElementById(id.replace('product_code', 'product_name'));
      if (byId) return byId;
    }
    var row = select.closest('tr') || select.closest('.row') || select.closest('form');
    if (row) {
      return row.querySelector('input[name$="product_name"], textarea[name$="product_name"], #id_product_name');
    }
    return document.getElementById('id_product_name');
  }

  function fillNameFromOption(select, opt) {
    var nameInput = findNameInput(select);
    if (nameInput) {
      if (!opt) {
        nameInput.value = '';
      } else {
        var name = (opt.name || '').trim();
        if (!name && (opt.text || '')) {
          var text = String(opt.text);
          var parts = text.split(/\s+[—–-]\s+/);
          if (parts.length > 1) name = parts.slice(1).join(' - ').trim();
        }
        nameInput.value = name || '';
      }
    }
    fillStockFromOption(select, opt);
    fillImageFromOption(select, opt);
  }

  function fillImageFromOption(select, opt) {
    var wrap = select.closest('.jp-so-product-pick')
      || select.closest('tr')
      || select.closest('.jp-so-sg-field')
      || select.closest('.row');
    if (!wrap) return;
    var thumb = wrap.querySelector('.jp-so-product-thumb');
    if (!thumb) return;
    var img = thumb.querySelector('img');
    var url = opt && String(opt.image_url || '').trim();
    if (img && url) {
      img.onload = function () {
        thumb.classList.add('has-image');
        thumb.classList.remove('is-empty');
      };
      img.onerror = function () {
        img.removeAttribute('src');
        thumb.classList.remove('has-image');
        thumb.classList.add('is-empty');
      };
      if (img.getAttribute('src') !== url) img.src = url;
      else {
        thumb.classList.add('has-image');
        thumb.classList.remove('is-empty');
      }
      return;
    }
    if (img) {
      img.removeAttribute('src');
      img.onload = null;
      img.onerror = null;
    }
    thumb.classList.remove('has-image');
    thumb.classList.add('is-empty');
  }

  function enrichProductOption(select, ts, code) {
    code = (code || '').trim();
    if (!code || !ts) return;
    var existing = ts.options[code] || {};
    if ((existing.image_url || '').trim()) {
      fillNameFromOption(select, existing);
      return;
    }
    fetch(searchUrl + '?q=' + encodeURIComponent(code), {
      headers: { 'Accept': 'application/json' },
      credentials: 'same-origin',
    })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        var rows = data.results || [];
        var needle = code.toLowerCase();
        var match = null;
        for (var i = 0; i < rows.length; i++) {
          var id = String(rows[i].id || rows[i].code || '').toLowerCase();
          if (id === needle) { match = rows[i]; break; }
        }
        if (!match) return;
        var merged = Object.assign({}, existing, match, {
          id: code,
          code: match.code || code,
        });
        if (ts.options[code]) ts.updateOption(code, merged);
        else ts.addOption(merged);
        fillNameFromOption(select, ts.options[code]);
      })
      .catch(function () {});
  }

  function fillStockFromOption(select, opt) {
    var row = select.closest('tr') || select.closest('.row');
    if (!row) return;
    var stockEl = row.querySelector('.jp-so-stock-qty');
    if (!stockEl) return;
    if (!opt) {
      stockEl.textContent = '—';
      stockEl.classList.add('text-muted');
      stockEl.classList.remove('text-danger', 'fw-semibold');
      return;
    }
    var qty = parseFloat(opt.stock_qty);
    var label = (opt.stock_label != null && String(opt.stock_label).trim() !== '')
      ? String(opt.stock_label).trim()
      : (Number.isFinite(qty) ? String(qty) : '0');
    if (label === '—' || label === '') label = Number.isFinite(qty) ? String(qty) : '0';
    stockEl.textContent = label;
    var n = Number.isFinite(qty) ? qty : parseFloat(label);
    stockEl.classList.toggle('text-muted', !Number.isFinite(n));
    stockEl.classList.toggle('text-danger', Number.isFinite(n) && n <= 0);
    stockEl.classList.toggle('fw-semibold', Number.isFinite(n) && n > 0);
  }

  function initProductCodeSelect(select) {
    if (!select || select.tomselect) return null;
    var initialValue = (select.value || '').trim();
    var initialLabel = select.options[select.selectedIndex]
      ? select.options[select.selectedIndex].textContent.trim()
      : initialValue;
    var itemUsesText = (select.dataset.itemLabel || '').trim() === 'text';
    var labelMode = (select.dataset.labelMode || '').trim(); // name | text | code

    function displayLabel(data, forItem) {
      var name = (data.name || '').trim();
      var code = (data.code || '').trim();
      var text = (data.text || '').trim();
      if (labelMode === 'name') {
        if (forItem) return name || text || code || '';
        if (name && code && name.toUpperCase() !== code.toUpperCase()) {
          return name;
        }
        return name || text || code || '';
      }
      if (itemUsesText && forItem) {
        if (data.text) return data.text;
        if (code && name) return code + ' — ' + name;
      }
      if (forItem) return code || text || '';
      return text || (code && name ? code + ' — ' + name : (code || name || ''));
    }

    function itemLabel(data) {
      return displayLabel(data, true);
    }

    return new TomSelect(select, {
      maxOptions: 40,
      maxItems: 1,
      valueField: 'id',
      labelField: 'text',
      searchField: ['text', 'code', 'name', 'color'],
      sortField: [
        { field: 'sp_num', direction: 'desc' },
        { field: 'code', direction: 'desc' },
      ],
      placeholder: select.dataset.placeholder || 'Gõ mã SX hoặc tên sản phẩm…',
      dropdownParent: 'body',
      dropdownClass: 'ts-dropdown jp-sx-product-dd',
      openOnFocus: true,
      preload: 'focus',
      shouldLoad: function () { return true; },
      loadThrottle: 220,
      load: function (query, callback) {
        fetch(searchUrl + '?q=' + encodeURIComponent(query || ''), {
          headers: { 'Accept': 'application/json' },
        })
          .then(function (r) { return r.json(); })
          .then(function (data) { callback(data.results || []); })
          .catch(function () { callback(); });
      },
      render: {
        option: function (data, escape) {
          var img = (data.image_url || '').trim();
          var imgHtml = img
            ? '<img class="jp-sx-product-opt-img" src="' + escape(img) + '" alt="" width="36" height="36">'
            : '<span class="jp-sx-product-opt-img is-empty"></span>';
          if (labelMode === 'name') {
            var name = (data.name || data.text || data.code || '').trim();
            var color = (data.color || '').trim();
            if (/^(nocolor|none|-)$/i.test(color)) color = '';
            if (name && color) {
              var suffixes = [' - ' + color, ' – ' + color, ' — ' + color];
              var lower = name.toLowerCase();
              for (var i = 0; i < suffixes.length; i++) {
                if (lower.endsWith(suffixes[i].toLowerCase())) {
                  name = name.slice(0, name.length - suffixes[i].length).trim();
                  break;
                }
              }
            }
            return '<div class="jp-sx-product-opt">'
              + imgHtml
              + '<span class="jp-sx-product-opt-name">' + escape(name) + '</span>'
              + '<span class="jp-sx-product-opt-color">' + escape(color) + '</span>'
              + '</div>';
          }
          return '<div class="jp-sx-product-opt is-simple">'
            + imgHtml
            + '<span class="jp-sx-product-opt-name is-start">' + escape(data.text || data.code || '') + '</span>'
            + '</div>';
        },
        item: function (data, escape) {
          return '<div>' + escape(itemLabel(data)) + '</div>';
        },
        no_results: function () {
          return labelMode === 'name'
            ? '<div class="px-2 py-2 text-muted small">Không tìm thấy — thử gõ tên sản phẩm</div>'
            : '<div class="px-2 py-2 text-muted small">Không tìm thấy mã SX — thử gõ mã hoặc tên</div>';
        },
        loading: function () {
          return '<div class="px-2 py-2 text-muted small">Đang tải…</div>';
        },
      },
      onInitialize: function () {
        var ts = this;
        if (!initialValue) return;
        if (!this.options[initialValue]) {
          var initName = '';
          if (labelMode === 'name' && initialLabel && initialLabel !== initialValue) {
            initName = initialLabel;
          }
          this.addOption({
            id: initialValue,
            code: initialValue,
            text: initialLabel || initialValue,
            name: initName || (labelMode === 'name' ? initialLabel : ''),
          });
        }
        this.setValue(initialValue, true);
        fillNameFromOption(select, this.options[initialValue]);
        enrichProductOption(select, ts, initialValue);
      },
      onItemAdd: function (value) {
        fillNameFromOption(select, this.options[value]);
      },
      onChange: function (value) {
        if (!value) {
          fillNameFromOption(select, null);
        } else {
          fillNameFromOption(select, this.options[value]);
        }
        select.dispatchEvent(new CustomEvent('jp-so-product-changed', {
          bubbles: true,
          detail: { productCode: value || '' },
        }));
      },
    });
  }

  window.jpInitProductCodeSelect = initProductCodeSelect;
  window.jpSyncProductSelectExtras = function (select) {
    if (!select) return;
    if (!select.tomselect) {
      fillImageFromOption(select, null);
      return;
    }
    var v = select.tomselect.getValue();
    fillNameFromOption(select, v ? select.tomselect.options[v] : null);
  };
  window.jpEnrichProductSelect = enrichProductOption;

  document.querySelectorAll('.jp-sx-product-code-select').forEach(initProductCodeSelect);
})();
</script>
