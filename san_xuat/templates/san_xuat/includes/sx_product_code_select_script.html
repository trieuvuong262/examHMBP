{# TomSelect product code — san_xuat:product_code_search #}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tom-select@2.4.1/dist/css/tom-select.bootstrap5.min.css">
<script src="https://cdn.jsdelivr.net/npm/tom-select@2.4.1/dist/js/tom-select.complete.min.js"></script>
<style>
body > .ts-dropdown { z-index: 2200; }
</style>
<script>
(function () {
  if (typeof TomSelect === 'undefined') return;
  var searchUrl = '{% url "san_xuat:product_code_search" %}';

  function findNameInput(select) {
    var target = (select.dataset.fillName || '').trim();
    if (target) {
      return document.querySelector(target) || document.getElementById(target.replace(/^#/, ''));
    }
    var id = select.id || '';
    if (id && id.indexOf('product_code') !== -1) {
      var byId = document.getElementById(id.replace('product_code', 'product_name'));
      if (byId) return byId;
    }
    var row = select.closest('tr') || select.closest('.row') || select.closest('form');
    if (row) {
      return row.querySelector('input[name$="product_name"], textarea[name$="product_name"], #id_product_name');
    }
    return document.getElementById('id_product_name');
  }

  function fillNameFromOption(select, opt) {
    var nameInput = findNameInput(select);
    if (nameInput) {
      if (!opt) {
        nameInput.value = '';
      } else {
        var name = (opt.name || '').trim();
        if (!name && (opt.text || '')) {
          var text = String(opt.text);
          var parts = text.split(/\s+[—–-]\s+/);
          if (parts.length > 1) name = parts.slice(1).join(' - ').trim();
        }
        nameInput.value = name || '';
      }
    }
    fillStockFromOption(select, opt);
  }

  function fillStockFromOption(select, opt) {
    var row = select.closest('tr') || select.closest('.row');
    if (!row) return;
    var stockEl = row.querySelector('.jp-so-stock-qty');
    if (!stockEl) return;
    if (!opt) {
      stockEl.textContent = '—';
      stockEl.classList.add('text-muted');
      stockEl.classList.remove('text-danger', 'fw-semibold');
      return;
    }
    var qty = parseFloat(opt.stock_qty);
    var label = (opt.stock_label != null && String(opt.stock_label).trim() !== '')
      ? String(opt.stock_label).trim()
      : (Number.isFinite(qty) ? String(qty) : '0');
    if (label === '—' || label === '') label = Number.isFinite(qty) ? String(qty) : '0';
    stockEl.textContent = label;
    var n = Number.isFinite(qty) ? qty : parseFloat(label);
    stockEl.classList.toggle('text-muted', !Number.isFinite(n));
    stockEl.classList.toggle('text-danger', Number.isFinite(n) && n <= 0);
    stockEl.classList.toggle('fw-semibold', Number.isFinite(n) && n > 0);
  }

  function initProductCodeSelect(select) {
    if (!select || select.tomselect) return null;
    var initialValue = (select.value || '').trim();
    var initialLabel = select.options[select.selectedIndex]
      ? select.options[select.selectedIndex].textContent.trim()
      : initialValue;
    var itemUsesText = (select.dataset.itemLabel || '').trim() === 'text';
    var labelMode = (select.dataset.labelMode || '').trim(); // name | text | code

    function displayLabel(data, forItem) {
      var name = (data.name || '').trim();
      var code = (data.code || '').trim();
      var text = (data.text || '').trim();
      if (labelMode === 'name') {
        if (forItem) return name || text || code || '';
        if (name && code && name.toUpperCase() !== code.toUpperCase()) {
          return name;
        }
        return name || text || code || '';
      }
      if (itemUsesText && forItem) {
        if (data.text) return data.text;
        if (code && name) return code + ' — ' + name;
      }
      if (forItem) return code || text || '';
      return text || (code && name ? code + ' — ' + name : (code || name || ''));
    }

    function itemLabel(data) {
      return displayLabel(data, true);
    }

    return new TomSelect(select, {
      maxOptions: 40,
      maxItems: 1,
      valueField: 'id',
      labelField: 'text',
      searchField: ['text', 'code', 'name'],
      placeholder: select.dataset.placeholder || 'Gõ mã SX hoặc tên sản phẩm…',
      dropdownParent: 'body',
      openOnFocus: true,
      preload: 'focus',
      shouldLoad: function () { return true; },
      loadThrottle: 220,
      load: function (query, callback) {
        fetch(searchUrl + '?q=' + encodeURIComponent(query || ''), {
          headers: { 'Accept': 'application/json' },
        })
          .then(function (r) { return r.json(); })
          .then(function (data) { callback(data.results || []); })
          .catch(function () { callback(); });
      },
      render: {
        option: function (data, escape) {
          if (labelMode === 'name') {
            var name = escape(data.name || data.text || data.code || '');
            var code = escape(data.code || '');
            if (data.code && data.name && String(data.code) !== String(data.name)) {
              return '<div><div>' + name + '</div><div class="small text-muted">' + code + '</div></div>';
            }
            return '<div>' + name + '</div>';
          }
          return '<div>' + escape(data.text || data.code || '') + '</div>';
        },
        item: function (data, escape) {
          return '<div>' + escape(itemLabel(data)) + '</div>';
        },
        no_results: function () {
          return labelMode === 'name'
            ? '<div class="px-2 py-2 text-muted small">Không tìm thấy — thử gõ tên sản phẩm</div>'
            : '<div class="px-2 py-2 text-muted small">Không tìm thấy mã SX — thử gõ mã hoặc tên</div>';
        },
        loading: function () {
          return '<div class="px-2 py-2 text-muted small">Đang tải…</div>';
        },
      },
      onInitialize: function () {
        if (!initialValue) return;
        if (!this.options[initialValue]) {
          var initName = '';
          if (labelMode === 'name' && initialLabel && initialLabel !== initialValue) {
            initName = initialLabel;
          }
          this.addOption({
            id: initialValue,
            code: initialValue,
            text: initialLabel || initialValue,
            name: initName || (labelMode === 'name' ? initialLabel : ''),
          });
        }
        this.setValue(initialValue, true);
      },
      onItemAdd: function (value) {
        fillNameFromOption(select, this.options[value]);
      },
      onChange: function (value) {
        if (!value) {
          fillNameFromOption(select, null);
        } else {
          fillNameFromOption(select, this.options[value]);
        }
        select.dispatchEvent(new CustomEvent('jp-so-product-changed', {
          bubbles: true,
          detail: { productCode: value || '' },
        }));
      },
    });
  }

  window.jpInitProductCodeSelect = initProductCodeSelect;

  document.querySelectorAll('.jp-sx-product-code-select').forEach(initProductCodeSelect);
})();
</script>
