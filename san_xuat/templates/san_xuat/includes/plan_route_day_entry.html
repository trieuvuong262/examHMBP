<style>
  .jp-rd-day .modal-dialog { max-width: min(48rem, calc(100vw - 1.5rem)); }
  .jp-rd-day .modal-content { border: 0; border-radius: 1rem; overflow: hidden; box-shadow: 0 24px 60px rgba(15, 23, 42, .22); }
  .jp-rd-day .modal-header { align-items: center; padding: .9rem 1.1rem; background: linear-gradient(180deg, #fff 0%, #fff7f7 100%); border-bottom: 1px solid #fee2e2; }

  .jp-rd-day .modal-footer { padding: .75rem 1.1rem; background: #fff; border-top: 1px solid #e8edf3; gap: .45rem; }

  .jp-rd-titlebox { display: flex; align-items: center; gap: .75rem; min-width: 0; }

  .jp-rd-status.is-info { background: #fff; color: #475569; border: 1px solid #e2e8f0; }
  .jp-rd-status.is-warn { background: #fff7ed; color: #c2410c; border: 1px solid #fed7aa; }
  .jp-rd-status.is-ok { background: #f0fdf4; color: #15803d; border: 1px solid #bbf7d0; }
  .jp-rd-status.is-err { background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; }
  .jp-rd-tools { display: flex; align-items: center; justify-content: space-between; margin-bottom: .55rem; }
  .jp-rd-tools > span { font-size: .72rem; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; color: #94a3b8; }
  .jp-rd-seg { display: inline-flex; padding: .15rem; border-radius: .65rem; background: #fff; border: 1px solid #e8edf3; }

  .jp-rd-sheet { width: 100%; border-collapse: separate; border-spacing: 0; font-size: .84rem; }
  .jp-rd-sheet th, .jp-rd-sheet td { padding: .55rem .55rem; border-bottom: 1px solid #f1f5f9; text-align: right; white-space: nowrap; }
  .jp-rd-sheet thead th { background: #fff5f5; color: #9f1239; font-size: .68rem; font-weight: 800; letter-spacing: .03em; text-transform: uppercase; }
  .jp-rd-sheet thead th:first-child, .jp-rd-sheet tbody th { text-align: left; font-weight: 800; color: #0f172a; }
  .jp-rd-sheet tbody tr:last-child th, .jp-rd-sheet tbody tr:last-child td { border-bottom: 0; }
  .jp-rd-sheet tr.is-sum th, .jp-rd-sheet tr.is-sum td { font-weight: 800; background: #f8fafc; color: #0f172a; }
  .jp-rd-sheet .is-over { color: #b91c1c; }
  .jp-rd-sheet .form-control { width: 5.2rem; margin-left: auto; text-align: right; font-weight: 800; border-radius: .55rem; border-color: #fecaca; background: #fff; }
  .jp-rd-sheet .form-control:focus { border-color: #dc2626; box-shadow: 0 0 0 .15rem rgba(220, 38, 38, .15); }
  .jp-rd-sheet .form-control.is-over { border-color: #f43f5e; background: #fff1f2; }
  .jp-rd-in { display: flex; align-items: center; justify-content: flex-end; }
  .jp-rd-alt { display: block; margin-top: .15rem; color: #94a3b8; font-size: .68rem; font-weight: 700; text-align: right; }
  .jp-rd-log { margin-top: .85rem; }
  .jp-rd-log-head { display: flex; align-items: baseline; justify-content: space-between; gap: .5rem; margin-bottom: .4rem; }
  .jp-rd-log-title { font-size: .78rem; font-weight: 800; color: #0f172a; }
  .jp-rd-log-hint { color: #94a3b8; font-size: .68rem; font-weight: 700; }
  .jp-rd-log-list { display: flex; flex-direction: column; gap: .4rem; max-height: 15rem; overflow: auto; padding-right: .1rem; }
  .jp-rd-log-row { display: flex; align-items: flex-start; justify-content: space-between; gap: .75rem; padding: .6rem .7rem; border-radius: .8rem; background: #fff; border: 1px solid #e8edf3; }
  .jp-rd-log-row.is-pending { background: #fffaf5; border-color: #fed7aa; }
  .jp-rd-log-who { display: flex; align-items: center; gap: .4rem; color: #0f172a; font-size: .82rem; font-weight: 800; }
  .jp-rd-badge { display: inline-flex; align-items: center; padding: .05rem .4rem; border-radius: 999px; background: #ffedd5; color: #c2410c; font-size: .64rem; font-weight: 800; }
  .jp-rd-log-meta { margin-top: .12rem; color: #64748b; font-size: .7rem; font-weight: 700; }
  .jp-rd-log-editby { margin-top: .15rem; color: #c2410c; font-size: .7rem; font-weight: 800; }
  .jp-rd-log-side { display: flex; align-items: center; gap: .5rem; }
  .jp-rd-log-qty { color: #0f172a; font-size: .84rem; font-weight: 800; text-align: right; }
  .jp-rd-log-fix, .jp-rd-log-ok, .jp-rd-log-cancel { border: 1px solid #fecaca; background: #fff; color: #b91c1c; font-size: .72rem; font-weight: 800; padding: .22rem .5rem; border-radius: .5rem; }
  .jp-rd-log-fix:hover, .jp-rd-log-ok:hover { background: #fef2f2; }
  .jp-rd-log-cancel { border-color: #e2e8f0; color: #64748b; }
  .jp-rd-log-editor { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: .4rem; }
  .jp-rd-log-editor label { display: inline-flex; align-items: center; gap: .3rem; margin: 0; font-size: .72rem; font-weight: 800; color: #334155; }
  .jp-rd-log-editor input { width: 4.2rem; text-align: right; font-weight: 800; border-radius: .5rem; }
  .jp-rd-log-empty { padding: .8rem; border-radius: .8rem; background: #fff; border: 1px dashed #e2e8f0; color: #94a3b8; font-size: .78rem; font-weight: 700; text-align: center; }
  .jp-rd-foot-note { margin-right: auto; color: #94a3b8; font-size: .72rem; font-weight: 700; }
  .jp-rd-save { background: #dc2626; border-color: #dc2626; color: #fff; border-radius: .6rem; padding-inline: .8rem; }
  .jp-rd-save:hover { background: #b91c1c; color: #fff; }
  .jp-rd-day .btn-outline-secondary { border-radius: .6rem; }
</style>
<div class="modal fade jp-rd-day" id="jpRouteDayEntry" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <div class="jp-rd-titlebox">
          <img id="jpRdPhoto" class="jp-rd-photo" alt="" hidden>
          <div>
            <h5 class="modal-title" id="jpRdTitle">Nhập sản lượng</h5>
            <div class="jp-rd-sub" id="jpRdSub"></div>
          </div>
        </div>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Đóng"></button>
      </div>
      <div class="modal-body" id="jpRdBody">
        <div class="jp-rd-status" id="jpRdStatus" hidden></div>
        <div class="jp-rd-tools" id="jpRdTools" hidden>
          <span>Size</span>
          <div class="jp-rd-seg" id="jpRdMode" role="group" aria-label="Loại nhập">
            <button type="button" data-mode="qty" class="is-on">SL</button>
            <button type="button" data-mode="pct">%</button>
          </div>
        </div>
        <div class="jp-rd-sheet-card" id="jpRdSheetWrap" hidden>
          <table class="jp-rd-sheet">
            <thead>
              <tr>
                <th>Size</th>
                <th id="jpRdKhHead">KH</th>
                <th>Đã làm</th>
                <th>Còn lại</th>
                <th id="jpRdQtyHead">Nhập</th>
              </tr>
            </thead>
            <tbody id="jpRdSizes"></tbody>
          </table>
        </div>
        <div class="jp-rd-log" id="jpRdLogWrap" hidden>
          <div class="jp-rd-log-head">
            <div class="jp-rd-log-title">Lần nhập</div>
            <div class="jp-rd-log-hint">Mỗi lần cộng vào Đã làm</div>
          </div>
          <div class="jp-rd-log-list" id="jpRdLog"></div>
        </div>
      </div>
      <div class="modal-footer">
        <span class="jp-rd-foot-note">Tiến độ chỉ đổi khi bấm Lưu thay đổi</span>
        <button type="button" class="btn btn-outline-secondary btn-sm fw-bold" data-bs-dismiss="modal">Đóng</button>
        <button type="button" class="btn btn-sm fw-bold" id="jpRdFill" hidden>Điền nhanh</button>
        <button type="button" class="btn btn-sm fw-bold jp-rd-save" id="jpRdSave" hidden>Lưu sản lượng</button>
      </div>
    </div>
  </div>
</div>
<script>
(function () {
  var root = document.getElementById('lo-trinh');
  var modalEl = document.getElementById('jpRouteDayEntry');
  var body = document.getElementById('jpRdBody');
  if (!root || !modalEl || !body) return;
  var today = root.getAttribute('data-today') || '';
  var sourceCell = null;
  var dayData = null;
  var dayMode = 'qty';
  var saving = false;

  function esc(value) {
    return String(value == null ? '' : value).replace(/[&<>"]/g, function (ch) {
      return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[ch];
    });
  }
  function num(v) {
    var x = Number(String(v == null ? '' : v).replace(/\s/g, '').replace(',', '.'));
    return isFinite(x) ? x : 0;
  }
  function plain(n) {
    var x = Math.round(num(n) * 10000) / 10000;
    if (Math.abs(x - Math.round(x)) < 1e-8) return String(Math.round(x));
    return String(x);
  }
  function show(n) {
    return num(n).toLocaleString('vi-VN', {maximumFractionDigits: 2});
  }
  function qtyToPct(q, plan) { return plan > 0 ? Math.round(q * 1000 / plan) / 10 : 0; }
  function pctToQty(p, plan) { return Math.round(plan * p / 100); }
  function readJson(res) {
    return res.text().then(function (text) {
      var data = null;
      try { data = text ? JSON.parse(text) : null; }
      catch (err) {
        var snippet = String(text || '').replace(/\s+/g, ' ').trim().slice(0, 180);
        throw new Error(snippet || 'Máy chủ không trả dữ liệu hợp lệ.');
      }
      if (!res.ok || !data || data.ok === false) {
        throw new Error((data && data.error) || 'Không xử lý được phiếu ngày.');
      }
      return data;
    });
  }
  function csrfToken() {
    var input = root.querySelector('input[name=csrfmiddlewaretoken]');
    if (input && input.value) return input.value;
    var m = document.cookie.match(/(?:^|;\s*)csrftoken=([^;]+)/);
    return m ? decodeURIComponent(m[1]) : '';
  }
  function part(id, on) {
    var el = document.getElementById(id);
    if (el) el.hidden = !on;
  }
  function setStatus(text, kind) {
    var el = document.getElementById('jpRdStatus');
    if (!el) return;
    if (!text) { el.hidden = true; el.textContent = ''; el.className = 'jp-rd-status'; return; }
    el.hidden = false;
    el.className = 'jp-rd-status is-' + (kind || 'info');
    el.textContent = text;
  }
  function inputs() {
    return Array.prototype.slice.call(body.querySelectorAll('#jpRdSizes input[data-size]'));
  }
  function liveQty(input) {
    var v = Math.max(0, num(input.value));
    var plan = num(input.getAttribute('data-plan'));
    if (dayMode === 'pct' && plan > 0) return pctToQty(v, plan);
    return v;
  }
  function projected(input) {
    return num(input.getAttribute('data-done')) + liveQty(input);
  }
  function setRemain(cell, plan, done) {
    if (!cell) return;
    if (plan > 0 && done > plan) {
      cell.textContent = 'vượt ' + show(done - plan);
      cell.classList.add('is-over');
    } else {
      cell.classList.remove('is-over');
      cell.textContent = plan > 0 ? show(Math.max(plan - done, 0)) : '—';
    }
  }
  function paintInput(input, fromLive) {
    var plan = num(input.getAttribute('data-plan'));
    var q = fromLive ? liveQty(input) : 0;
    var done = fromLive ? projected(input) : num(input.getAttribute('data-done'));
    var asPct = dayMode === 'pct' && plan > 0;
    input.classList.toggle('is-over', plan > 0 && done > plan);
    var alt = input.closest('td') && input.closest('td').querySelector('.jp-rd-alt');
    if (alt) {
      alt.textContent = asPct
        ? (q ? show(q) + ' SL' : '')
        : (plan > 0 && q ? qtyToPct(q, plan).toLocaleString('vi-VN', {maximumFractionDigits: 1}) + '%' : '');
    }
    var row = input.closest('tr');
    var doneCell = row && row.querySelector('[data-role="done"]');
    if (doneCell) {
      doneCell.textContent = show(done);
      doneCell.classList.toggle('is-over', plan > 0 && done > plan);
    }
    setRemain(row && row.querySelector('[data-role="remain"]'), plan, done);
  }
  function dayTotal() {
    return inputs().reduce(function (sum, input) {
      return sum + num(input.getAttribute('data-qty'));
    }, 0);
  }
  function fillSums(fromLive) {
    var foot = body.querySelector('tr.is-sum');
    if (!foot) return;
    var plan = 0;
    var done = 0;
    var day = 0;
    inputs().forEach(function (input) {
      plan += num(input.getAttribute('data-plan'));
      done += fromLive ? projected(input) : num(input.getAttribute('data-done'));
      day += liveQty(input);
    });
    foot.querySelector('[data-role="plan"]').textContent = show(plan);
    var doneCell = foot.querySelector('[data-role="done"]');
    doneCell.textContent = show(done);
    doneCell.classList.toggle('is-over', plan > 0 && done > plan);
    setRemain(foot.querySelector('[data-role="remain"]'), plan, done);
    var dayCell = foot.querySelector('[data-role="day"]');
    var pct = plan > 0 ? qtyToPct(day, plan).toLocaleString('vi-VN', {maximumFractionDigits: 1}) + '%' : '';
    dayCell.textContent = day ? show(day) + (pct ? ' (' + pct + ')' : '') : '';
  }
  function showSave(on) {
    var btn = document.getElementById('jpRdSave');
    if (btn) {
      btn.hidden = !on;
      btn.textContent = document.getElementById('jpRouteEditSave') ? 'Ghi nhận' : 'Lưu sản lượng';
    }
    var fill = document.getElementById('jpRdFill');
    var hasPlan = !!on && inputs().some(function (input) { return num(input.getAttribute('data-plan')) > 0; });
    if (fill) fill.hidden = !hasPlan;
  }
  function paintRoute(cell, nextDone) {
    if (!cell) return;
    var btn = cell.querySelector('.jp-sheet-qty');
    var old = 0;
    if (btn) {
      var doneEl = btn.querySelector('.jp-sheet-done');
      old = num(doneEl && doneEl.textContent);
      if (doneEl) doneEl.textContent = plain(nextDone);
      btn.setAttribute('data-done', plain(nextDone));
    } else if (num(nextDone) > 0) {
      cell.classList.add('has-qty');
      var late = cell.closest('tr') && cell.closest('tr').classList.contains('is-late') ? ' is-late' : '';
      cell.insertAdjacentHTML('beforeend',
        '<button type="button" class="jp-sheet-qty is-actual' + late + '" draggable="false" data-can-drag="0" data-done="' + plain(nextDone) + '">' +
        '<span class="jp-sheet-plan">0</span><span class="jp-sheet-done">' + plain(nextDone) + '</span></button>');
    }
    var total = cell.closest('tr') && cell.closest('tr').querySelector('td.c-total .jp-sheet-done');
    if (total) total.textContent = plain(Math.max(0, num(total.textContent) - old + num(nextDone)));
  }
  function qtyText(sizes) {
    return (sizes || []).map(function (row) {
      var label = row.size || '';
      var qty = show(row.qty);
      return label ? label + ' ' + qty : qty;
    }).join(' · ');
  }
  var editingKey = '';
  function dayDraft() {
    if (!dayData || !window.jpRouteDayQtyDraft) return null;
    return window.jpRouteDayQtyDraft(dayData.mo_id, dayData.slug, dayData.date);
  }
  function pendingEntries() {
    var draft = dayDraft();
    return (draft && draft.entries) || [];
  }
  function revisionsOf() {
    var draft = dayDraft();
    return (draft && draft.revisions) || [];
  }
  function entryKey(entry) {
    if (!entry) return '';
    if (entry.key) return entry.key;
    if (entry.ids && entry.ids.length) return 'log:' + entry.ids.join('-');
    return '';
  }
  function extraBySize(entries, revisions) {
    var added = {};
    function add(size, qty) {
      var key = size || '';
      added[key] = (added[key] || 0) + num(qty);
    }
    (entries || []).forEach(function (entry) {
      (entry.sizes || []).forEach(function (row) { add(row.size, row.qty); });
    });
    (revisions || []).forEach(function (rev) {
      (rev.sizes || []).forEach(function (row) {
        add(row.size, num(row.qty) - num(row.origin));
      });
    });
    return added;
  }
  function stageCurrent(entries, revisions) {
    if (!window.jpRouteStageDayQty) return false;
    var added = extraBySize(entries, revisions);
    var sizes = [];
    inputs().forEach(function (input) {
      var size = input.getAttribute('data-size') || '';
      var qty = num(input.getAttribute('data-base')) + (added[size] || 0);
      if (plain(qty) === plain(num(input.getAttribute('data-base')))) return;
      sizes.push({size: size, qty: plain(qty)});
    });
    return window.jpRouteStageDayQty({
      action: 'route_day_qty',
      order_id: dayData.order_id || '',
      mo_id: dayData.mo_id || '',
      team_slug: dayData.slug,
      stat_date: dayData.date,
      sizes: sizes,
      entries: entries,
      revisions: revisions,
      save_note: '0',
      notes: ''
    });
  }
  function syncTotalsFromDraft() {
    var added = extraBySize(pendingEntries(), revisionsOf());
    inputs().forEach(function (input) {
      var size = input.getAttribute('data-size') || '';
      var extra = added[size] || 0;
      input.setAttribute('data-done', plain(num(input.getAttribute('data-done-base')) + extra));
      input.setAttribute('data-qty', plain(num(input.getAttribute('data-base')) + extra));
      input.value = '';
      paintInput(input, false);
    });
    fillSums(false);
    paintRoute(sourceCell, dayTotal());
    markDayDraft(sourceCell, !!(pendingEntries().length || revisionsOf().length));
    renderLog();
  }
  function visibleEntries() {
    var pending = pendingEntries().map(function (entry) {
      if (!entry.key) entry.key = entryKey(entry) || ('p' + Math.random().toString(36).slice(2));
      return entry;
    });
    var saved = (dayData.entries || []).map(function (entry) {
      var key = entryKey(entry);
      var rev = null;
      revisionsOf().forEach(function (item) { if (item.key === key) rev = item; });
      if (!rev) return Object.assign({key: key, saved: true}, entry);
      return {
        key: key,
        ids: entry.ids,
        saved: true,
        pending: true,
        user: entry.user,
        at: entry.at,
        edited_by: rev.edited_by,
        edited_at: rev.edited_at,
        sizes: rev.sizes
      };
    });
    return pending.concat(saved);
  }
  function renderLog() {
    var wrap = document.getElementById('jpRdLogWrap');
    var list = document.getElementById('jpRdLog');
    if (!wrap || !list || !dayData) return;
    var entries = visibleEntries();
    wrap.hidden = false;
    var title = wrap.querySelector('.jp-rd-log-title');
    if (title) title.textContent = entries.length ? ('Lần nhập · ' + entries.length) : 'Lần nhập';
    if (!entries.length) {
      list.innerHTML = '<div class="jp-rd-log-empty">Chưa có lần nhập.</div>';
      return;
    }
    list.innerHTML = entries.map(function (entry) {
      var key = entryKey(entry);
      var editor = entry.edited_by
        ? '<div class="jp-rd-log-editby">Sửa bởi ' + esc(entry.edited_by) + (entry.edited_at ? ' · ' + esc(entry.edited_at) : '') + '</div>'
        : '';
      var badge = entry.pending ? '<span class="jp-rd-badge">Chờ lưu</span>' : '';
      var side = editingKey === key
        ? '<div class="jp-rd-log-editor">' + (entry.sizes || []).map(function (row) {
            return '<label>' + esc(row.size || 'SL') +
              ' <input class="form-control form-control-sm" data-edit-size="' + esc(row.size || '') + '" data-log-id="' + esc(row.log_id || '') + '" value="' + esc(plain(row.qty)) + '" inputmode="decimal"></label>';
          }).join('') +
          '<button type="button" class="jp-rd-log-ok" data-edit-save="' + esc(key) + '">Lưu sửa</button>' +
          '<button type="button" class="jp-rd-log-cancel" data-edit-cancel>Hủy</button></div>'
        : '<div class="jp-rd-log-side"><div class="jp-rd-log-qty">' + esc(qtyText(entry.sizes)) + '</div>' +
          (dayData.can_update ? '<button type="button" class="jp-rd-log-fix" data-edit-open="' + esc(key) + '">Sửa</button>' : '') +
          '</div>';
      return '<div class="jp-rd-log-row' + (entry.pending ? ' is-pending' : '') + '">' +
        '<div><div class="jp-rd-log-who">' + esc(entry.user || '—') + badge + '</div>' +
        '<div class="jp-rd-log-meta">' + esc(entry.at || '') + '</div>' + editor + '</div>' + side + '</div>';
    }).join('');
  }
  function renderDay(data) {
    dayData = data;
    dayMode = 'qty';
    var sub = document.getElementById('jpRdSub');
    if (sub) {
      var bits = [];
      if (data.product) bits.push(data.product);
      if (data.scope === 'day' && data.day_plan !== '') bits.push('KH ngày ' + show(data.day_plan));
      sub.textContent = bits.join(' · ');
    }
    var kh = document.getElementById('jpRdKhHead');
    if (kh) kh.textContent = data.scope === 'day' ? 'KH ngày' : 'KH';
    var photo = document.getElementById('jpRdPhoto');
    if (photo) {
      if (data.image) { photo.hidden = false; photo.src = data.image; }
      else { photo.hidden = true; photo.removeAttribute('src'); }
    }
    if (data.closed) setStatus('Tổ đã hoàn thành lệnh này.', 'ok');
    else if (data.future) setStatus('Chưa tới ngày này.', 'warn');
    else setStatus('');
    part('jpRdTools', !!data.can_update);
    body.querySelectorAll('#jpRdMode button').forEach(function (btn) {
      btn.classList.toggle('is-on', btn.getAttribute('data-mode') === 'qty');
    });
    var head = document.getElementById('jpRdQtyHead');
    if (head) head.textContent = 'Nhập';
    var box = document.getElementById('jpRdSizes');
    box.innerHTML = '';
    dayData.entries = data.entries || [];
    var sizes = data.sizes || [];
    if (!sizes.length) box.innerHTML = '<tr><td colspan="5">Chưa có size.</td></tr>';
    sizes.forEach(function (size) {
      var label = size.label || '';
      var row = document.createElement('tr');
      row.innerHTML = '<th scope="row"></th><td data-role="plan"></td><td data-role="done"></td><td data-role="remain"></td><td><div class="jp-rd-in"><input class="form-control form-control-sm" inputmode="decimal" placeholder="0"></div><span class="jp-rd-alt"></span></td>';
      row.querySelector('th').textContent = label || '—';
      row.querySelector('[data-role="plan"]').textContent = num(size.plan) ? show(size.plan) : '—';
      var input = row.querySelector('input');
      input.setAttribute('data-size', label);
      input.setAttribute('data-plan', size.plan || '0');
      input.setAttribute('data-base', size.qty || '0');
      input.setAttribute('data-qty', size.qty || '0');
      input.setAttribute('data-done-base', size.done || '0');
      input.setAttribute('data-done', size.done || '0');
      input.value = '';
      if (!data.can_update) input.readOnly = true;
      box.appendChild(row);
      paintInput(input, false);
    });
    if (sizes.length) {
      var foot = document.createElement('tr');
      foot.className = 'is-sum';
      foot.innerHTML = '<th>Cộng</th><td data-role="plan"></td><td data-role="done"></td><td data-role="remain"></td><td data-role="day"></td>';
      box.appendChild(foot);
      fillSums(false);
    }
    part('jpRdSheetWrap', true);
    showSave(!!data.can_update);
    applyPendingDraft(data);
    renderLog();
  }
  function applyPendingDraft(data) {
    if (!data || !dayDraft()) return;
    syncTotalsFromDraft();
    setStatus('Số liệu này đang chờ. Bấm Lưu thay đổi để cập nhật tiến độ.', 'warn');
  }
  function markDayDraft(cell, pending) {
    if (!cell) return;
    cell.classList.toggle('jp-route-draft-change', !!pending);
    var qtyBtn = cell.querySelector('.jp-sheet-qty');
    if (qtyBtn) qtyBtn.classList.toggle('jp-route-draft-change', !!pending);
  }
  function openDay(cell) {
    var row = cell.closest('tr');
    if (!cell || !row) return;
    var mo = row && row.getAttribute('data-progress-mo');
    var slug = (row && row.getAttribute('data-progress-slug'))
      || cell.getAttribute('data-team-slug')
      || (row && row.getAttribute('data-team-slug'))
      || '';
    var orderId = cell.getAttribute('data-order-id') || (row && row.getAttribute('data-order-id')) || '';
    var day = cell.getAttribute('data-date') || '';
    if (!slug || slug === 'npl' || !day || (today && day > today)) return;
    if (!mo && !orderId) return;
    sourceCell = cell;
    dayData = null;
    var codeEl = row.querySelector('[data-order-code]');
    var code = codeEl ? (codeEl.getAttribute('data-order-code') || '') : '';
    var title = document.getElementById('jpRdTitle');
    if (title) title.textContent = (code || 'Sản lượng') + ' · ' + day.split('-').reverse().join('/');
    var sub = document.getElementById('jpRdSub');
    if (sub) sub.textContent = '';
    setStatus('Đang tải…', 'info');
    part('jpRdTools', false);
    part('jpRdSheetWrap', false);
    part('jpRdLogWrap', false);
    showSave(false);
    if (!window.bootstrap || !bootstrap.Modal) {
      setStatus('Trang chưa sẵn sàng. Tải lại rồi thử lại.', 'err');
      return;
    }
    bootstrap.Modal.getOrCreateInstance(modalEl).show();
    var url = new URL(window.location.href);
    url.searchParams.set('route_day', '1');
    url.searchParams.set('mo_id', mo || '0');
    url.searchParams.set('order_id', orderId);
    url.searchParams.set('slug', slug);
    url.searchParams.set('ngay', day);
    url.searchParams.delete('route_more');
    url.searchParams.delete('ids');
    fetch(url.toString(), {credentials: 'same-origin', headers: {'X-Requested-With': 'XMLHttpRequest', 'Accept': 'application/json'}})
      .then(readJson)
      .then(renderDay)
      .catch(function (err) { setStatus(err.message || 'Không mở được phiếu ngày.', 'err'); });
  }
  function postDay(fields) {
    fields.csrfmiddlewaretoken = csrfToken();
    fields.action = 'route_day_sheet';
    fields.mo_id = dayData.mo_id || '';
    fields.order_id = dayData.order_id || '';
    fields.slug = dayData.slug;
    fields.stat_date = dayData.date;
    var url = new URL(window.location.href);
    url.searchParams.delete('route_day');
    url.searchParams.delete('route_more');
    var controller = window.AbortController ? new AbortController() : null;
    var timer = window.setTimeout(function () {
      if (controller) controller.abort();
    }, 30000);
    return fetch(url.toString(), {
      method: 'POST',
      headers: {
        'X-Requested-With': 'XMLHttpRequest',
        'Accept': 'application/json',
        'X-CSRFToken': csrfToken()
      },
      body: new URLSearchParams(fields),
      credentials: 'same-origin',
      signal: controller ? controller.signal : undefined
    }).then(function (res) {
      return readJson(res);
    }).catch(function (err) {
      if (err && err.name === 'AbortError') {
        throw new Error('Lưu quá lâu (30 giây). Vui lòng kiểm tra lại dữ liệu rồi thử lại.');
      }
      throw err;
    }).finally(function () {
      window.clearTimeout(timer);
    });
  }
  function rememberSavedEntry(rows) {
    if (!dayData || !rows || !rows.length) return;
    var now = new Date();
    function two(n) { return n < 10 ? '0' + n : String(n); }
    var at = two(now.getDate()) + '/' + two(now.getMonth() + 1) + '/' + now.getFullYear()
      + ' ' + two(now.getHours()) + ':' + two(now.getMinutes());
    dayData.entries = dayData.entries || [];
    dayData.entries.unshift({
      at: at,
      user: dayData.actor || '—',
      kind: 'edit',
      backfill: !!(today && dayData.date && dayData.date < today),
      sizes: rows.map(function (row) { return {size: row.size || '', qty: row.qty}; })
    });
    renderLog();
  }
  function saveSheet() {
    if (saving || !dayData || !dayData.can_update) return;
    saving = true;
    var btn = document.getElementById('jpRdSave');
    if (btn) btn.disabled = true;
    try {
      var adds = [];
      inputs().forEach(function (input) {
        var add = liveQty(input);
        if (!(add > 0)) return;
        adds.push({size: input.getAttribute('data-size') || '', qty: plain(add)});
      });
      if (!adds.length) {
        setStatus('Chưa có số lượng để cộng.', 'warn');
        saving = false;
        if (btn) btn.disabled = false;
        return;
      }
      function applyAdds() {
        adds.forEach(function (row) {
          var input = null;
          inputs().forEach(function (el) {
            if ((el.getAttribute('data-size') || '') === (row.size || '')) input = el;
          });
          if (!input) return;
          input.setAttribute('data-done', plain(num(input.getAttribute('data-done')) + num(row.qty)));
          input.setAttribute('data-qty', plain(num(input.getAttribute('data-qty')) + num(row.qty)));
          input.value = '';
          paintInput(input, false);
        });
        fillSums(false);
      }
      var canStage = !!(window.jpRouteStageDayQty && document.getElementById('jpRouteEditSave'));
      if (canStage) {
        var entries = pendingEntries().slice();
        entries.unshift({
          key: 'p' + Date.now(),
          pending: true,
          user: dayData.actor || 'Bạn',
          at: 'Đang chờ lưu',
          sizes: adds
        });
        var staged = stageCurrent(entries, revisionsOf().slice());
        if (staged) {
          syncTotalsFromDraft();
          setStatus('Đã cộng vào Đã làm. Bấm Lưu thay đổi để cập nhật tiến độ.', 'ok');
          saving = false;
          if (btn) btn.disabled = false;
          return;
        }
      }
      var payload = adds.map(function (row) {
        var input = null;
        inputs().forEach(function (el) {
          if ((el.getAttribute('data-size') || '') === (row.size || '')) input = el;
        });
        var next = input ? num(input.getAttribute('data-qty')) + num(row.qty) : num(row.qty);
        return {size: row.size, qty: plain(next)};
      });
      setStatus('Đang lưu…', 'info');
      postDay({
        sizes: JSON.stringify(payload),
        save_note: '0',
        notes: ''
      }).then(function (data) {
        try {
          applyAdds();
          (data.sizes || []).forEach(function (row) {
            var input = null;
            inputs().forEach(function (el) {
              if ((el.getAttribute('data-size') || '') === (row.size || '')) input = el;
            });
            if (!input) return;
            input.setAttribute('data-qty', plain(row.day_done));
            input.setAttribute('data-base', plain(row.day_done));
            input.setAttribute('data-done', plain(dayData.scope === 'day' ? row.day_done : row.size_done));
            input.setAttribute('data-done-base', input.getAttribute('data-done'));
            input.value = '';
            paintInput(input, false);
          });
          fillSums(false);
          paintRoute(sourceCell, dayTotal());
          rememberSavedEntry(adds);
          setStatus('Đã lưu.', 'ok');
        } catch (renderErr) {
          console.error('[jpRouteDay] Lỗi cập nhật UI sau khi lưu:', renderErr);
          setStatus('Đã lưu nhưng lỗi hiển thị. Tải lại trang.', 'warn');
        }
      }).catch(function (err) {
        setStatus(err.message || 'Không lưu được SL.', 'err');
      }).finally(function () {
        saving = false;
        if (btn) btn.disabled = false;
      });
    } catch (syncErr) {
      console.error('[jpRouteDay] Lỗi đồng bộ khi lưu:', syncErr);
      setStatus(syncErr.message || 'Lỗi không xác định khi lưu.', 'err');
      saving = false;
      if (btn) btn.disabled = false;
    }
  }
  window.jpOpenRouteDay = openDay;
  root.addEventListener('dblclick', function (ev) {
    ev.preventDefault();
    if (root.querySelector('.is-dragging-route') || root.querySelector('.is-dragging')) return;
    var draggedAt = Number(root.getAttribute('data-route-dragged-at') || 0);
    if (draggedAt && Date.now() - draggedAt < 1500) return;
    var cell = ev.target && ev.target.closest ? ev.target.closest('.jp-sheet-cell[data-date]') : null;
    if (!cell || !root.contains(cell)) return;
    openDay(cell);
  });
  body.addEventListener('input', function (ev) {
    var input = ev.target && ev.target.closest ? ev.target.closest('#jpRdSizes input[data-size]') : null;
    if (!input) return;
    paintInput(input, true);
    fillSums(true);
  });
  body.addEventListener('click', function (ev) {
    var modeBtn = ev.target && ev.target.closest ? ev.target.closest('#jpRdMode button') : null;
    if (!modeBtn || !dayData || !dayData.can_update) return;
    var kept = inputs().map(function (input) { return liveQty(input); });
    dayMode = modeBtn.getAttribute('data-mode') === 'pct' ? 'pct' : 'qty';
    body.querySelectorAll('#jpRdMode button').forEach(function (btn) {
      btn.classList.toggle('is-on', btn === modeBtn);
    });
    var head = document.getElementById('jpRdQtyHead');
    if (head) head.textContent = dayMode === 'pct' ? '%' : 'Nhập';
    inputs().forEach(function (input, index) {
      var plan = num(input.getAttribute('data-plan'));
      var qty = kept[index] || 0;
      var asPct = dayMode === 'pct' && plan > 0;
      input.value = qty ? plain(asPct ? qtyToPct(qty, plan) : qty) : '';
      paintInput(input, true);
    });
    fillSums(true);
  });
  var fillBtn = document.getElementById('jpRdFill');
  if (fillBtn) fillBtn.addEventListener('click', function () {
    if (saving || !dayData || !dayData.can_update) return;
    var filled = 0;
    inputs().forEach(function (input) {
      var plan = num(input.getAttribute('data-plan'));
      if (!(plan > 0)) return;
      var remain = Math.max(plan - num(input.getAttribute('data-done')), 0);
      if (!(remain > 0)) return;
      input.value = dayMode === 'pct' ? plain(qtyToPct(remain, plan)) : plain(remain);
      paintInput(input, true);
      filled += 1;
    });
    fillSums(true);
    setStatus(filled ? 'Đã điền phần còn lại.' : 'Không còn số lượng để điền.', filled ? 'ok' : 'warn');
  });
  function saveLogEdit(key) {
    var box = document.querySelector('#jpRdLog .jp-rd-log-editor');
    if (!box || !dayData) return;
    var rows = [];
    box.querySelectorAll('[data-edit-size]').forEach(function (input) {
      rows.push({
        size: input.getAttribute('data-edit-size') || '',
        qty: plain(Math.max(0, num(input.value))),
        log_id: input.getAttribute('data-log-id') || ''
      });
    });
    var entries = pendingEntries().slice();
    var revisions = revisionsOf().slice();
    var pendingHit = null;
    entries.forEach(function (entry) {
      if (entryKey(entry) === key) pendingHit = entry;
    });
    if (pendingHit) {
      pendingHit.sizes = rows.map(function (row) { return {size: row.size, qty: row.qty}; });
      pendingHit.edited_by = dayData.actor || 'Bạn';
      pendingHit.edited_at = 'Đang chờ lưu';
      entries = entries.filter(function (entry) {
        return (entry.sizes || []).some(function (row) { return num(row.qty) > 0; });
      });
    } else {
      var source = null;
      (dayData.entries || []).forEach(function (entry) {
        if (entryKey(entry) === key) source = entry;
      });
      if (!source) return;
      var existing = null;
      revisions.forEach(function (rev) { if (rev.key === key) existing = rev; });
      var baseline = existing ? existing.sizes : (source.sizes || []);
      var nextSizes = rows.map(function (row, index) {
        var base = baseline[index] || {};
        return {
          size: row.size,
          qty: row.qty,
          log_id: row.log_id || base.log_id || '',
          origin: base.origin != null ? base.origin : base.qty
        };
      });
      revisions = revisions.filter(function (rev) { return rev.key !== key; });
      var changed = nextSizes.some(function (row) {
        return plain(num(row.qty)) !== plain(num(row.origin));
      });
      if (changed) {
        revisions.push({
          key: key,
          ids: source.ids || [],
          edited_by: dayData.actor || 'Bạn',
          edited_at: 'Đang chờ lưu',
          sizes: nextSizes
        });
      }
    }
    editingKey = '';
    if (!(window.jpRouteStageDayQty && document.getElementById('jpRouteEditSave'))) {
      renderLog();
      setStatus('Chưa lưu được người sửa.', 'err');
      return;
    }
    stageCurrent(entries, revisions);
    syncTotalsFromDraft();
    setStatus('Đã lưu sửa. Bấm Lưu thay đổi để cập nhật tiến độ.', 'ok');
  }
  var logList = document.getElementById('jpRdLog');
  if (logList) logList.addEventListener('click', function (ev) {
    var openBtn = ev.target && ev.target.closest ? ev.target.closest('[data-edit-open]') : null;
    if (openBtn) {
      editingKey = openBtn.getAttribute('data-edit-open') || '';
      renderLog();
      var focus = logList.querySelector('.jp-rd-log-editor input');
      if (focus) focus.focus();
      return;
    }
    if (ev.target && ev.target.closest && ev.target.closest('[data-edit-cancel]')) {
      editingKey = '';
      renderLog();
      return;
    }
    var editSave = ev.target && ev.target.closest ? ev.target.closest('[data-edit-save]') : null;
    if (!editSave) return;
    saveLogEdit(editSave.getAttribute('data-edit-save') || '');
  });
  var saveBtn = document.getElementById('jpRdSave');
  if (saveBtn) saveBtn.addEventListener('click', saveSheet);
})();
</script>
