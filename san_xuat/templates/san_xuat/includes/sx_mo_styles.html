{# Shared LSX (lệnh sản xuất) look — list / form / detail #}
<style>
:root {
  --jp-mo-ink: #1e293b;
  --jp-mo-muted: #64748b;
  --jp-mo-line: #e2e8f0;
  --jp-mo-surface: #f8fafc;
  --jp-mo-accent: #0f766e;
  --jp-mo-accent-soft: #f0fdfa;
  --jp-mo-brand: var(--hm-red, #dc2626);
}

/* —— Status pills —— */
.jp-mo-status {
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
  padding: 0.2rem 0.55rem;
  font-size: 0.72rem;
  font-weight: 700;
  letter-spacing: 0.02em;
  border-radius: 999px;
  border: 1px solid transparent;
  line-height: 1.3;
  white-space: nowrap;
}
.jp-mo-status::before {
  content: "";
  width: 0.4rem;
  height: 0.4rem;
  border-radius: 50%;
  background: currentColor;
  flex-shrink: 0;
}
.jp-mo-status.is-draft { color: #475569; background: #f1f5f9; border-color: #e2e8f0; }
.jp-mo-status.is-released { color: #0369a1; background: #e0f2fe; border-color: #bae6fd; }
.jp-mo-status.is-in_progress { color: #0f766e; background: #ccfbf1; border-color: #99f6e4; }
.jp-mo-status.is-done { color: #15803d; background: #dcfce7; border-color: #bbf7d0; }
.jp-mo-status.is-cancelled { color: #b91c1c; background: #fee2e2; border-color: #fecaca; }

/* —— Mini progress (list) —— */
.jp-mo-qty {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 0.2rem;
  min-width: 4.5rem;
}
.jp-mo-qty-bar {
  width: 100%;
  height: 0.28rem;
  border-radius: 999px;
  background: #e2e8f0;
  overflow: hidden;
}
.jp-mo-qty-bar > span {
  display: block;
  height: 100%;
  border-radius: inherit;
  background: linear-gradient(90deg, #0d9488, #14b8a6);
}

/* —— Form sections —— */
.jp-mo-form-card {
  border: 0;
  box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04), 0 8px 24px rgba(15, 23, 42, 0.06);
  border-radius: 0.85rem;
  overflow: hidden;
}
.jp-mo-form-hero {
  padding: 1.1rem 1.25rem 1rem;
  background:
    linear-gradient(135deg, rgba(15, 118, 110, 0.08) 0%, rgba(248, 250, 252, 0.95) 55%),
    var(--jp-mo-surface);
  border-bottom: 1px solid var(--jp-mo-line);
}
.jp-mo-form-hero .eyebrow {
  font-size: 0.7rem;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--jp-mo-accent);
  margin-bottom: 0.2rem;
}
.jp-mo-form-hero .lead {
  margin: 0;
  font-size: 0.9rem;
  color: var(--jp-mo-muted);
  max-width: 36rem;
}
.jp-mo-section {
  padding: 1.15rem 1.25rem;
  border-bottom: 1px solid var(--jp-mo-line);
}
.jp-mo-section:last-of-type { border-bottom: 0; }
.jp-mo-section-label {
  display: flex;
  align-items: baseline;
  gap: 0.5rem;
  margin-bottom: 0.85rem;
}
.jp-mo-section-label .num {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 1.35rem;
  height: 1.35rem;
  border-radius: 0.4rem;
  font-size: 0.72rem;
  font-weight: 800;
  color: #fff;
  background: var(--jp-mo-accent);
  flex-shrink: 0;
}
.jp-mo-section-label h3 {
  margin: 0;
  font-size: 0.82rem;
  font-weight: 700;
  color: var(--jp-mo-ink);
  letter-spacing: 0.01em;
}
.jp-mo-section-label .hint {
  margin-left: auto;
  font-size: 0.75rem;
  color: var(--jp-mo-muted);
}
.jp-mo-code-preview {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  letter-spacing: 0.01em;
  background: var(--jp-mo-accent-soft) !important;
  border-color: #99f6e4 !important;
  color: #134e4a !important;
  font-weight: 600;
}
.jp-mo-form-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 0.5rem;
  padding: 1rem 1.25rem 1.25rem;
  background: var(--jp-mo-surface);
  border-top: 1px solid var(--jp-mo-line);
}
.jp-mo-form-actions .btn-hm {
  min-width: 10rem;
  font-weight: 700;
}

/* —— Detail hero —— */
.jp-mo-hero {
  border: 0;
  border-radius: 0.85rem;
  box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04), 0 8px 24px rgba(15, 23, 42, 0.06);
  overflow: hidden;
  margin-bottom: 1rem;
}
.jp-mo-hero-top {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  align-items: flex-start;
  gap: 1rem;
  padding: 1.15rem 1.25rem 1rem;
  background:
    linear-gradient(120deg, rgba(15, 118, 110, 0.07) 0%, transparent 42%),
    #fff;
  border-bottom: 1px solid var(--jp-mo-line);
}
.jp-mo-hero-product {
  min-width: 0;
}
.jp-mo-hero-product .code {
  font-size: 1.2rem;
  font-weight: 750;
  color: var(--jp-mo-ink);
  letter-spacing: -0.01em;
  line-height: 1.25;
}
.jp-mo-hero-product .name {
  color: var(--jp-mo-muted);
  font-size: 0.875rem;
  margin-top: 0.15rem;
}
.jp-mo-hero-side {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-start;
  gap: 1rem;
  margin-left: auto;
}
.jp-mo-progress-ring {
  text-align: right;
  min-width: 8.5rem;
}
.jp-mo-progress-ring .pct {
  font-size: 1.35rem;
  font-weight: 800;
  color: var(--jp-mo-accent);
  line-height: 1;
  letter-spacing: -0.02em;
}
.jp-mo-progress-ring .sub {
  font-size: 0.75rem;
  color: var(--jp-mo-muted);
  margin-top: 0.15rem;
}
.jp-mo-progress-ring .bar {
  height: 0.4rem;
  margin-top: 0.45rem;
  border-radius: 999px;
  background: #e2e8f0;
  overflow: hidden;
}
.jp-mo-progress-ring .bar > span {
  display: block;
  height: 100%;
  background: linear-gradient(90deg, #0d9488, #2dd4bf);
  border-radius: inherit;
}
.jp-mo-meta {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 0.85rem 1.1rem;
  padding: 1.1rem 1.25rem;
}
@media (min-width: 768px) {
  .jp-mo-meta { grid-template-columns: repeat(4, minmax(0, 1fr)); }
}
.jp-mo-meta .label {
  font-size: 0.68rem;
  font-weight: 700;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--jp-mo-muted);
  margin-bottom: 0.15rem;
}
.jp-mo-meta .value {
  font-weight: 650;
  font-size: 0.95rem;
  color: var(--jp-mo-ink);
  line-height: 1.3;
}
.jp-mo-steps {
  display: flex;
  flex-wrap: wrap;
  gap: 0.35rem;
  padding: 0 1.25rem 1.1rem;
}
.jp-mo-steps .chip {
  display: inline-flex;
  align-items: center;
  gap: 0.3rem;
  padding: 0.28rem 0.55rem;
  font-size: 0.72rem;
  font-weight: 600;
  border-radius: 0.4rem;
  border: 1px solid var(--jp-mo-line);
  background: #fff;
  color: var(--jp-mo-muted);
}
.jp-mo-steps .chip.is-done {
  background: #ecfdf5;
  border-color: #a7f3d0;
  color: #047857;
}
.jp-mo-next {
  display: flex;
  flex-wrap: wrap;
  gap: 0.4rem;
  align-items: stretch;
}
.jp-mo-next form { margin: 0; display: inline-flex; }
.jp-mo-next .btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  height: 2rem;
  min-height: 2rem;
  padding: 0 0.7rem;
  font-size: 0.8rem;
  font-weight: 700;
  line-height: 1;
  white-space: nowrap;
}
.jp-mo-section-head {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  align-items: center;
  gap: 0.5rem;
  margin-bottom: 0.75rem;
}
.jp-mo-section-head .title {
  font-size: 0.7rem;
  font-weight: 750;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--jp-mo-muted);
  margin: 0;
}
.jp-mo-section-head .count {
  font-weight: 650;
  font-size: 0.88rem;
  color: var(--jp-mo-ink);
}
.jp-mo-panel {
  border: 0;
  border-radius: 0.75rem;
  box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04), 0 6px 18px rgba(15, 23, 42, 0.05);
}
.jp-mo-empty {
  text-align: center;
  padding: 2.5rem 1rem;
  color: var(--jp-mo-muted);
}
.jp-mo-empty .icon {
  width: 2.75rem;
  height: 2.75rem;
  margin: 0 auto 0.75rem;
  border-radius: 0.75rem;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--jp-mo-accent-soft);
  color: var(--jp-mo-accent);
  font-size: 1.25rem;
}
.jp-mo-list-code {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 0.82rem;
  letter-spacing: -0.01em;
}
</style>
