{% if stage_legend_items %}
<div class="jp-stage-legend" aria-label="Ghi chú màu bộ phận">
  <span class="jp-stage-legend-k">Bộ phận</span>
  {% for item in stage_legend_items %}
  <span class="jp-stage-legend-item jp-stage-{{ item.slug }}"
        style="--st-fill: {{ item.color }}; --st-ink: {{ item.ink }}; --st-soft: {{ item.soft }}; --st: {{ item.ink }};"><i aria-hidden="true"></i>{{ item.label }}</span>
  {% endfor %}
  {% if tab == 'route' %}
  <span class="jp-stage-legend-note">Ô số: trên = dự kiến, dưới = đã thực hiện · cột phải = tổng</span>
  {% endif %}
</div>
{% endif %}
