{% load sx_format %}<td class="jp-tr-day{% if not c.is_workday %} is-off{% endif %}{% if c.is_today %} is-today{% endif %}">{% if c.plan_orders or c.orders %}<button type="button" class="jp-tr-day-hit" data-jp-team-day="{{ team_slug }}|{{ c.day|date:'Y-m-d' }}" title="Đơn cần làm {{ c.day|date:'d/m/Y' }}"><span class="jp-tr-qty jp-stage-{{ slug }}{% if not c.plan %} is-actual{% endif %}"><span class="jp-tr-plan">{{ c.plan|default:0|sx_num }}</span><span class="jp-tr-done{% if c.state %} is-{{ c.state }}{% endif %}">{{ c.qty|sx_num }}</span></span></button>{% elif c.has_value %}<span class="jp-tr-qty jp-stage-{{ slug }}{% if not c.plan %} is-actual{% endif %}"><span class="jp-tr-plan">{{ c.plan|default:0|sx_num }}</span><span class="jp-tr-done{% if c.state %} is-{{ c.state }}{% endif %}">{{ c.qty|sx_num }}</span></span>{% endif %}</td>
