{# CSS polish Sản xuất — đỏ JustPlay, hover. JS ở sx_ui_polish_scripts.html #}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
{% include 'kho_npl/includes/catalog_grid_styles.html' %}
<style>
.jp-sx-module .jp-main-content,
.jp-sx-module .jp-page {
  --sx-red: var(--hm-primary, #dc2626);
  --sx-red-dark: var(--hm-primary-dark, #b91c1c);
  --sx-red-soft: var(--hm-primary-soft, rgba(220, 38, 38, 0.08));
}

.jp-sx-module .jp-page {
  animation: jp-sx-fade-in 0.28s ease-out;
}
@keyframes jp-sx-fade-in {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: none; }
}

.jp-sx-module .jp-page-title,
.jp-sx-module .jp-npl-mat-topbar-title,
.jp-sx-module h2.fw-bold.text-hm {
  letter-spacing: -0.02em;
}

.jp-sx-module .jp-page-header > div > p.text-muted,
.jp-sx-module .jp-npl-mat-topbar-title-wrap > p.text-muted,
.jp-sx-module .jp-npl-mat-topbar > div > p.text-muted.small {
  display: none !important;
}

.jp-sx-module .jp-page-header {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 0.75rem;
  margin-bottom: 1rem !important;
}
.jp-sx-module .jp-npl-mat-topbar-title {
  color: var(--sx-red) !important;
}

.jp-sx-module .card.border-0.shadow-sm,
.jp-sx-module .jp-sx-card {
  border-radius: 0.65rem !important;
  border: 1px solid rgba(15, 23, 42, 0.06) !important;
  box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04), 0 8px 24px rgba(15, 23, 42, 0.04) !important;
  transition: box-shadow 0.2s ease, transform 0.2s ease, border-color 0.2s ease;
}
.jp-sx-module .card.border-0.shadow-sm:hover {
  border-color: rgba(220, 38, 38, 0.18) !important;
  box-shadow: 0 4px 12px rgba(220, 38, 38, 0.08), 0 12px 28px rgba(15, 23, 42, 0.06) !important;
}

.jp-sx-module .btn-hm,
.jp-sx-module .btn-outline-hm {
  transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease,
              box-shadow 0.15s ease, transform 0.15s ease;
}
.jp-sx-module .btn-hm:hover,
.jp-sx-module .btn-outline-hm:hover {
  transform: translateY(-1px);
  box-shadow: 0 4px 12px rgba(220, 38, 38, 0.25);
}
.jp-sx-module .btn-hm:active,
.jp-sx-module .btn-outline-hm:active {
  transform: translateY(0);
}

.jp-sx-module table.table > thead > tr > th {
  font-size: 0.72rem;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: #64748b;
  font-weight: 700;
  border-bottom-width: 1px;
}
.jp-sx-module table.table > tbody > tr.jp-sx-row-click,
.jp-sx-module table.table > tbody > tr.jp-npl-catalog-row[data-href] {
  cursor: pointer;
  transition: background-color 0.15s ease, box-shadow 0.15s ease;
}
.jp-sx-module table.table > tbody > tr.jp-sx-row-click:hover,
.jp-sx-module table.table > tbody > tr.jp-npl-catalog-row[data-href]:hover {
  background-color: var(--sx-red-soft) !important;
  box-shadow: inset 3px 0 0 var(--sx-red);
}
.jp-sx-module table.table > tbody > tr.jp-sx-row-click td a.text-decoration-none,
.jp-sx-module table.table > tbody > tr.jp-npl-catalog-row[data-href] td a.fw-semibold {
  color: var(--sx-red);
  transition: color 0.15s ease;
}
.jp-sx-module table.table > tbody > tr.jp-sx-row-click:hover td a,
.jp-sx-module table.table > tbody > tr.jp-npl-catalog-row[data-href]:hover td a.fw-semibold {
  color: var(--sx-red-dark);
}
.jp-sx-module table .btn-outline-hm.btn-sm {
  border-radius: 999px;
  padding: 0.2rem 0.65rem;
  font-size: 0.75rem;
  opacity: 0.85;
  transition: opacity 0.15s ease, background-color 0.15s ease, transform 0.15s ease;
}
.jp-sx-module tr.jp-sx-row-click:hover .btn-outline-hm.btn-sm,
.jp-sx-module tr.jp-npl-catalog-row[data-href]:hover .btn-outline-hm.btn-sm {
  opacity: 1;
  transform: translateX(2px);
}

.jp-sx-module .border.rounded-3,
.jp-sx-module .border-start.border-4 {
  transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
  background: #fff;
}
.jp-sx-module a.text-decoration-none:hover > .border.rounded-3,
.jp-sx-module a.text-decoration-none:hover > .border-start.border-4 {
  transform: translateY(-3px);
  box-shadow: 0 10px 24px rgba(220, 38, 38, 0.12);
}
.jp-sx-module .border-start.border-hm,
.jp-sx-module .border-hm {
  border-color: var(--sx-red) !important;
}

.jp-sx-module .jp-sx-hub-link {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  flex: 1 1 16rem;
  padding: 0.9rem 1.05rem;
  border: 1px solid var(--bs-border-color);
  border-radius: 0.65rem;
  text-decoration: none;
  color: inherit;
  background: #fff;
  transition: border-color 0.18s ease, color 0.18s ease, box-shadow 0.18s ease, transform 0.18s ease;
}
.jp-sx-module .jp-sx-hub-link:hover {
  border-color: var(--sx-red);
  color: var(--sx-red);
  box-shadow: 0 8px 20px rgba(220, 38, 38, 0.1);
  transform: translateY(-2px);
}

.jp-sx-module .form-control:focus,
.jp-sx-module .form-select:focus {
  border-color: var(--sx-red);
  box-shadow: 0 0 0 0.2rem rgba(220, 38, 38, 0.15);
}

/* --- Cân chiều rộng: dropdown = text = file (toàn module SX) --- */
.jp-sx-module {
  --jp-sx-ctl-h-sm: 38px;
}
.jp-sx-module form .form-control,
.jp-sx-module form .form-select,
.jp-sx-module form input[type="file"],
.jp-sx-module form input[type="file"].form-control,
.jp-sx-module form .ts-wrapper,
.jp-sx-module form .ts-wrapper.form-select,
.jp-sx-module form .ts-wrapper.form-select-sm,
.jp-sx-module .mb-3 > .form-control,
.jp-sx-module .mb-3 > .form-select,
.jp-sx-module .mb-3 > .ts-wrapper,
.jp-sx-module [class*="col-"] > .form-control,
.jp-sx-module [class*="col-"] > .form-select,
.jp-sx-module [class*="col-"] > .ts-wrapper,
.jp-sx-module [class*="col-"] > input[type="file"],
.jp-sx-module .jp-team-filter-org > .form-control,
.jp-sx-module .jp-team-filter-org > .form-select,
.jp-sx-module .jp-team-filter-org > .ts-wrapper,
.jp-sx-module .jp-form-field > .form-control,
.jp-sx-module .jp-form-field > .form-select,
.jp-sx-module .jp-form-field > .ts-wrapper,
.jp-sx-module td > .form-control,
.jp-sx-module td > .form-select,
.jp-sx-module td > .ts-wrapper,
.jp-sx-module .design-upload-row .design-upload-control,
.jp-sx-module .design-upload-row input[type="file"] {
  width: 100%;
  max-width: 100%;
  box-sizing: border-box;
}

/* TomSelect: khung bằng form-control-sm */
.jp-sx-module form .ts-wrapper.form-select,
.jp-sx-module form .ts-wrapper.form-select-sm,
.jp-sx-module td .ts-wrapper.form-select,
.jp-sx-module td .ts-wrapper.form-select-sm,
.jp-sx-module [class*="col-"] > .ts-wrapper.form-select,
.jp-sx-module [class*="col-"] > .ts-wrapper.form-select-sm {
  display: block;
  min-height: var(--jp-sx-ctl-h-sm);
  border: 1px solid var(--bs-border-color, #ced4da);
  border-radius: var(--bs-border-radius-sm, 0.25rem);
  background-color: var(--bs-body-bg, #fff);
  padding: 0;
}
.jp-sx-module form .ts-wrapper.form-select.focus,
.jp-sx-module form .ts-wrapper.form-select-sm.focus,
.jp-sx-module td .ts-wrapper.form-select.focus,
.jp-sx-module td .ts-wrapper.form-select-sm.focus {
  border-color: var(--sx-red, #dc2626);
  box-shadow: 0 0 0 0.2rem rgba(220, 38, 38, 0.15);
}
.jp-sx-module form .ts-wrapper.form-select-sm .ts-control,
.jp-sx-module td .ts-wrapper.form-select-sm .ts-control,
.jp-sx-module [class*="col-"] > .ts-wrapper.form-select-sm .ts-control {
  min-height: calc(var(--jp-sx-ctl-h-sm) - 2px);
  padding: 0.25rem 0.5rem;
  font-size: 0.875rem;
  line-height: 1.5;
  border: 0 !important;
  box-shadow: none !important;
  background: transparent !important;
}
.jp-sx-module form .ts-wrapper .ts-control > input,
.jp-sx-module td .ts-wrapper .ts-control > input {
  font-size: inherit !important;
}

/* input-group: để Bootstrap chia flex, không ép 100% */
.jp-sx-module .input-group > .form-control,
.jp-sx-module .input-group > .form-select,
.jp-sx-module .input-group > .ts-wrapper {
  width: 1%;
  flex: 1 1 auto;
  max-width: 100%;
}

/* Ngoại lệ: filter compact / width cố ý hẹp */
.jp-sx-module .form-control.w-auto,
.jp-sx-module .form-select.w-auto,
.jp-sx-module .jp-npl-mat-search-row .form-select.jp-sx-filter-select,
.jp-sx-module .jp-npl-mat-search-row .form-select-sm.jp-sx-filter-select,
.jp-sx-module .form-select[style*="width:auto"],
.jp-sx-module .form-control[style*="width:auto"],
.jp-sx-module .form-select[style*="max-width"],
.jp-sx-module .form-control[style*="max-width"] {
  width: auto;
  max-width: none;
}
.jp-sx-module .nav-tabs {
  border-bottom-color: rgba(15, 23, 42, 0.1);
  gap: 0.15rem;
}
.jp-sx-module .nav-tabs .nav-link {
  color: #404040 !important;
  background: transparent !important;
  border-color: transparent !important;
  border-radius: 0.4rem 0.4rem 0 0 !important;
  font-weight: 600;
  min-height: auto;
  padding: 0.55rem 1rem !important;
  transition: color 0.15s ease, background-color 0.15s ease, border-color 0.15s ease;
}
.jp-sx-module .nav-tabs .nav-link:hover {
  color: var(--sx-red, #dc2626) !important;
  background: rgba(220, 38, 38, 0.06) !important;
  border-color: transparent !important;
}
.jp-sx-module .nav-tabs .nav-link.active {
  color: var(--sx-red, #dc2626) !important;
  background: #fff !important;
  border-color: rgba(15, 23, 42, 0.1) rgba(15, 23, 42, 0.1) #fff !important;
  border-bottom-color: #fff !important;
  box-shadow: inset 0 -2px 0 var(--sx-red, #dc2626);
  font-weight: 700;
}
.jp-sx-module .nav-pills .nav-link,
.jp-sx-module .nav-pills-hm .nav-link,
.jp-sx-module .custom-pills .nav-link {
  color: #404040 !important;
  background: #f1f5f9 !important;
  border-radius: 999px !important;
  min-height: auto;
  padding: 0.4rem 0.9rem !important;
  font-weight: 600;
}
.jp-sx-module .nav-pills .nav-link:hover,
.jp-sx-module .nav-pills-hm .nav-link:hover,
.jp-sx-module .custom-pills .nav-link:hover {
  color: var(--sx-red, #dc2626) !important;
  background: rgba(220, 38, 38, 0.1) !important;
}
.jp-sx-module .nav-pills .nav-link.active,
.jp-sx-module .nav-pills-hm .nav-link.active,
.jp-sx-module .custom-pills .nav-link.active {
  color: #fff !important;
  background: var(--sx-red, #dc2626) !important;
  box-shadow: 0 2px 8px rgba(220, 38, 38, 0.25);
}
.jp-sx-module .badge.border {
  transition: transform 0.15s ease;
}
.jp-sx-module tr:hover .badge.border {
  transform: scale(1.03);
}
.jp-sx-module .jp-sx-chart-card {
  transition: box-shadow 0.2s ease, transform 0.2s ease;
}
.jp-sx-module .jp-sx-chart-card:hover {
  transform: translateY(-2px);
  box-shadow: 0 10px 28px rgba(15, 23, 42, 0.08);
}

/* Bộ lọc kỳ — copy layout Quản lý báo cáo SX */
.jp-sx-module .jp-team-filter-form .jp-team-filter-body {
  display: flex;
  flex-wrap: wrap;
  gap: 0.75rem 1rem;
  align-items: flex-end;
}
.jp-sx-module .jp-team-filter-dates {
  display: flex;
  flex-wrap: nowrap;
  gap: 0.75rem;
  align-items: flex-end;
}
.jp-sx-module .jp-team-filter-dates > div {
  flex: 1 1 0;
  min-width: 0;
}
.jp-sx-module .jp-team-filter-org-search {
  display: flex;
  flex-wrap: wrap;
  gap: 0.75rem;
  align-items: flex-end;
  flex: 1 1 280px;
}
.jp-sx-module .jp-team-filter-org-search > .jp-team-filter-org {
  flex: 1 1 140px;
  min-width: 0;
}
.jp-sx-module .jp-team-filter-period {
  flex: 0 1 9.5rem;
  min-width: 0;
}
.jp-sx-module .jp-team-filter-actions {
  display: flex;
  gap: 0.5rem;
  align-items: flex-end;
}
/* flatpickr altInput — dd/mm/yyyy (bộ lọc + form nghiệp vụ) */
.jp-sx-module .jp-team-filter-form .flatpickr-input,
.jp-sx-module .jp-date-vn + input.flatpickr-input,
.jp-sx-module input.flatpickr-input.form-control {
  width: 100%;
}
.jp-sx-module .jp-team-filter-form input.flatpickr-input[readonly],
.jp-sx-module .jp-team-filter-form .flatpickr-input.form-control,
.jp-sx-module input.flatpickr-input.form-control[readonly] {
  background-color: #fff;
  cursor: pointer;
}
@media (max-width: 767.98px) {
  .jp-sx-module .jp-team-filter-form .jp-team-filter-body {
    flex-direction: column;
    align-items: stretch;
  }
  .jp-sx-module .jp-team-filter-dates { width: 100%; }
  .jp-sx-module .jp-team-filter-period { width: 100%; flex: none; }
  .jp-sx-module .jp-team-filter-org-search {
    width: 100%;
    flex: none;
  }
  .jp-sx-module .jp-team-filter-actions {
    width: 100%;
    justify-content: flex-end;
  }
}
</style>
{% include 'san_xuat/includes/sx_mobile_styles.html' %}
