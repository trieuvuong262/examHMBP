<style>
  .jp-tl {
    --tl-ink:#0f172a; --tl-muted:#64748b; --tl-line:#eef2f6; --tl-soft:#f8fafc;
    --tl-today:#dc2626; --tl-label:11.25rem; --tl-day:6.5rem;
  }
  .jp-tl-wrap {
    overflow: auto;
    border: 1px solid #e8edf3;
    border-radius: 1rem;
    background: #fff;
    box-shadow: 0 1px 2px rgba(15,23,42,.04), 0 8px 24px rgba(15,23,42,.04);
  }
  .jp-tl-toolbar {
    display: flex; flex-wrap: wrap; align-items: center; gap: .55rem .75rem;
    padding: .7rem 1rem; border-bottom: 1px solid var(--tl-line); background: #fff;
    position: sticky; left: 0; z-index: 6;
  }
  .jp-tl-filter {
    display: flex; flex-wrap: wrap; align-items: center; gap: .45rem .65rem;
  }
  .jp-tl-shift {
    display: inline-flex; align-items: center; gap: .3rem;
  }
  .jp-tl-shift a {
    display: inline-flex; align-items: center; justify-content: center;
    width: 1.85rem; height: 1.85rem; border-radius: .45rem;
    border: 1px solid #e2e8f0; color: #334155; text-decoration: none; font-size: .9rem;
    background: #fff;
  }
  .jp-tl-shift a:hover { border-color: #fecaca; color: #dc2626; background: #fff1f2; }
  .jp-tl-month-label {
    min-width: 7.2rem; text-align: center;
    font-weight: 800; color: var(--tl-ink); letter-spacing: -.02em; font-size: .92rem;
  }
  .jp-tl-month-now {
    display: inline-flex; align-items: center; height: 1.85rem;
    padding: 0 .7rem; border-radius: .45rem;
    border: 1px solid #fecaca; background: #fff1f2; color: #b91c1c;
    font-size: .72rem; font-weight: 800; text-decoration: none;
  }
  .jp-tl-month-now:hover { background: #fee2e2; color: #991b1b; }
  .jp-tl-range-form {
    display: inline-flex; flex-wrap: wrap; align-items: center; gap: .35rem .45rem;
  }
  .jp-tl-range-field {
    display: inline-flex; align-items: center; gap: .28rem;
    font-size: .72rem; font-weight: 700; color: var(--tl-muted);
  }
  .jp-tl-range-field input[type="date"] {
    height: 1.85rem; padding: 0 .4rem;
    border: 1px solid #e2e8f0; border-radius: .45rem;
    font-size: .78rem; font-weight: 600; color: var(--tl-ink);
    background: #fff;
  }
  .jp-tl-count { color: var(--tl-muted); font-size: .78rem; font-weight: 600; }
  .jp-tl-hint { color: #9f1239; font-size: .74rem; font-weight: 700; }
  .jp-tl-legend {
    display: flex; flex-wrap: wrap; gap: .45rem .7rem; margin-left: auto;
    font-size: .72rem; font-weight: 700; color: var(--tl-muted);
  }
  .jp-tl-legend i {
    display: inline-block; width: .7rem; height: .7rem; border-radius: .2rem;
    vertical-align: -1px; margin-right: .28rem;
  }
  .jp-tl-chart {
    --tl-month-h: 1.5rem;
    display: grid;
    grid-template-columns: var(--tl-label) repeat(var(--tl-days), minmax(var(--tl-day), 1fr));
    min-width: calc(var(--tl-label) + (var(--tl-days) * var(--tl-day)));
  }
  .jp-tl-chart > * { box-sizing: border-box; min-width: 0; }
  .jp-tl-line { box-shadow: inset 1px 0 0 var(--tl-line); }
  .jp-tl-line.is-week-start { box-shadow: inset 1px 0 0 #cbd5e1; }
  .jp-tl-line.is-today { box-shadow: inset 1px 0 0 var(--tl-today), inset -1px 0 0 var(--tl-today); }
  .jp-tl-corner {
    grid-column: 1;
    grid-row: 1 / span 2;
    position: sticky; left: 0; top: 0; z-index: 8;
    background: #fff;
    border-right: 1px solid #e8edf3;
    box-shadow: 1px 0 0 #e8edf3;
    display: flex; align-items: flex-end;
    padding: 0 .9rem .45rem;
    font-size: .68rem; font-weight: 800; color: var(--tl-muted);
    letter-spacing: .04em; text-transform: uppercase;
  }
  .jp-tl-month {
    position: sticky; top: 0; z-index: 6;
    height: var(--tl-month-h);
    display: flex; align-items: center; justify-content: center;
    font-size: .68rem; font-weight: 800; color: #9f1239;
    background: #fff1f2; white-space: nowrap;
    box-shadow: inset 1px 0 0 #fecdd3;
  }
  .jp-tl-day {
    position: sticky; top: var(--tl-month-h); z-index: 6;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: .2rem 0 .28rem; background: #fff; line-height: 1.15;
  }
  .jp-tl-day .n { font-size: .72rem; font-weight: 800; color: var(--tl-ink); }
  .jp-tl-day .w { font-size: .58rem; font-weight: 700; color: var(--tl-muted); }
  .jp-tl-day.is-weekend { background: #f8fafc; }
  .jp-tl-day.is-weekend .n, .jp-tl-day.is-weekend .w { color: #94a3b8; }
  .jp-tl-day.is-today { background: #fef2f2; }
  .jp-tl-day.is-today .n, .jp-tl-day.is-today .w { color: var(--tl-today); }
  .jp-tl-label {
    position: sticky; left: 0; z-index: 4;
    background: #fff;
    padding: .28rem .55rem .28rem .5rem;
    border-right: 1px solid #e8edf3;
    border-top: 1px solid var(--tl-line);
    border-left: 3px solid #dc2626;
    display: flex; flex-direction: column; justify-content: center; gap: .12rem;
    min-width: 0;
  }
  .jp-tl-products {
    display: flex;
    align-items: center;
    gap: .22rem;
    margin-bottom: .08rem;
  }
  .jp-tl-product {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 2.15rem;
    height: 2.15rem;
    flex: 0 0 2.15rem;
    padding: 0;
    overflow: hidden;
    border: 1px solid #dbe2ea;
    border-radius: .4rem;
    background: #fff;
    color: #94a3b8;
  }
  button.jp-tl-product { cursor: zoom-in; }
  .jp-tl-product:hover { border-color: #991b1b; }
  .jp-tl-product img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .jp-tl-label .jp-tl-code { font-size: .75rem; }
  .jp-tl-code { font-weight: 800; color: var(--tl-ink); text-decoration: none; font-size: .86rem; letter-spacing: -.01em; }
  .jp-tl-code:hover { color: var(--tl-today); }
  .jp-tl-code-row {
    display: flex; flex-wrap: nowrap; align-items: center; gap: .4rem;
    min-width: 0;
  }
  .jp-tl-prio {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex: 0 0 auto;
    height: 1.45rem;
    padding: 0 .5rem;
    border-radius: .35rem;
    font-size: .68rem;
    font-weight: 800;
    line-height: 1;
    white-space: nowrap;
    border: 1px solid transparent;
  }
  .jp-tl-prio.is-critical { color: #991b1b; background: #fef2f2; border-color: #fecaca; }
  .jp-tl-prio.is-urgent { color: #c2410c; background: #fff7ed; border-color: #fed7aa; }
  .jp-tl-prio.is-high { color: #a16207; background: #fffbeb; border-color: #fde68a; }
  .jp-tl-prio.is-normal { color: #0369a1; background: #e0f2fe; border-color: #bae6fd; }
  .jp-tl-prio.is-low { color: #475569; background: #f1f5f9; border-color: #e2e8f0; }
  .jp-tl-sub { color: var(--tl-muted); font-size: .74rem; margin-top: .12rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .jp-tl-meta { display: flex; flex-wrap: wrap; align-items: center; gap: .3rem; margin-top: .28rem; }
  .jp-tl-accepts {
    position: relative;
    z-index: 5;
  }
  .jp-tl-accepts > summary {
    list-style: none;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: .2rem;
    padding: .08rem .42rem;
    border-radius: 999px;
    font-size: .65rem;
    font-weight: 800;
    letter-spacing: .01em;
    background: #fee2e2;
    color: #b91c1c;
    border: 1px solid #fecaca;
    user-select: none;
  }
  .jp-tl-accepts > summary::-webkit-details-marker { display: none; }
  .jp-tl-accepts > summary::before {
    content: '▸';
    font-size: .7rem;
    line-height: 1;
  }
  .jp-tl-accepts[open] > summary::before { content: '▾'; }
  .jp-tl-accepts > ul {
    position: absolute;
    left: 0;
    top: calc(100% + .25rem);
    min-width: 11rem;
    margin: 0;
    padding: .4rem .55rem;
    list-style: none;
    background: #fff;
    border: 1px solid #e2e8f0;
    border-radius: .5rem;
    box-shadow: 0 8px 20px rgba(15, 23, 42, .12);
  }
  .jp-tl-accepts > ul li {
    display: flex;
    flex-direction: column;
    gap: .05rem;
    padding: .28rem 0;
    border-bottom: 1px solid #f1f5f9;
    font-size: .72rem;
    color: #334155;
  }
  .jp-tl-accepts > ul li:last-child { border-bottom: 0; }
  .jp-tl-accepts > ul li strong { color: #0f172a; font-weight: 800; }
  .jp-tl-accepts > ul li span { color: #64748b; font-weight: 600; font-size: .68rem; }
  .jp-tl-st {
    display: inline-flex; align-items: center; padding: .02rem .32rem; border-radius: 999px;
    font-size: .58rem; font-weight: 800; letter-spacing: .01em; width: fit-content;
  }
  .jp-tl-st.is-draft { background: #f1f5f9; color: #475569; }
  .jp-tl-st.is-queued,
  .jp-tl-st.is-ranked { background: #fffbeb; color: #b45309; }
  .jp-tl-st.is-on_hold { background: #f1f5f9; color: #475569; }
  .jp-tl-st.is-released { background: #fff1f2; color: #9f1239; }
  .jp-tl-st.is-in_progress { background: #fee2e2; color: #b91c1c; }
  .jp-tl-st.is-done { background: #dcfce7; color: #166534; }
  .jp-tl-st.is-late { background: #7f1d1d; color: #fff; }
  .jp-tl-dates { color: var(--tl-muted); font-size: .68rem; font-weight: 600; }
  .jp-tl-slot {
    position: relative;
    z-index: 0;
    min-height: 2.55rem;
    border-top: 1px solid var(--tl-line);
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    gap: 2px;
    padding: 2px 1px;
  }
  .jp-tl-slot.is-weekend { background: #fafbfc; }
  .jp-tl-slot.is-today { background: #fef2f2; }
  .jp-tl-bar {
    position: relative;
    z-index: 2;
    align-self: stretch;
    width: auto;
    min-width: 0;
    margin: 2px 1px;
    border: 0;
    border-radius: .28rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0;
    padding: .12rem .18rem .14rem;
    background: #dc2626;
    color: #fff;
    font-family: inherit;
    line-height: 1.15;
    text-align: center;
    overflow: hidden;
    pointer-events: auto;
    user-select: none;
    box-shadow: 0 1px 2px rgba(127,29,29,.18);
  }
  .jp-tl-bar-name {
    font-size: .58rem;
    font-weight: 800;
    letter-spacing: -.01em;
    white-space: normal;
    word-break: break-word;
  }
  .jp-tl-bar-code {
    font-size: .52rem;
    font-weight: 700;
    opacity: .95;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 100%;
  }
  .jp-tl-bar:hover { filter: brightness(1.08); z-index: 3; }
  .jp-tl-bar.is-late { background: #9f1239; }
  .jp-tl-bar.is-npl { background: #475569; }
  .jp-tl-bar.is-draggable {
    cursor: grab;
    -webkit-user-drag: element;
  }
  .jp-tl-bar.is-draggable:active { cursor: grabbing; }
  .jp-tl-bar.is-dragging { opacity: 0.45; z-index: 7; }
  .jp-tl-chart.is-dragging-route .jp-tl-day.is-drop-hint {
    background: #fff1f2 !important;
    box-shadow: inset 0 0 0 1px #fca5a5;
  }
  .jp-tl-slot.is-drop-hint { background: #fff1f2 !important; box-shadow: inset 0 0 0 1px #fca5a5; }
  .jp-tl-empty {
    border: 1px dashed #e2e8f0; border-radius: 1rem; padding: 2.4rem 1rem;
    text-align: center; color: var(--tl-muted); background: #fff;
  }
  .jp-tl-unsched {
    margin-top: 1rem; border: 1px solid #e8edf3; border-radius: 1rem;
    padding: .85rem 1rem; background: #fff;
  }
  .jp-tl-unsched h3 { font-size: .78rem; font-weight: 800; margin: 0 0 .55rem; color: var(--tl-ink); }
  .jp-tl-chips { display: flex; flex-wrap: wrap; gap: .35rem; }
  .jp-tl-chip {
    display: inline-flex; align-items: center;
    padding: .18rem .55rem; border-radius: 999px;
    background: #f8fafc; border: 1px solid #e2e8f0;
    color: #334155; font-size: .75rem; font-weight: 700; text-decoration: none;
  }
  .jp-tl-chip:hover { border-color: #fecaca; color: #dc2626; background: #fff1f2; }

  /* Lộ trình KHSX: lưới lớn, màu theo đơn, 2 hàng bộ phận / mã hàng. */
  .jp-pb-route.jp-tl {
    --tl-label: 14rem;
    --tl-day: 8.35rem;
    --tl-line: #e2e8f0;
  }
  .jp-pb-route .jp-tl-wrap {
    border-radius: 1.1rem;
    box-shadow: 0 1px 2px rgba(15,23,42,.05), 0 12px 32px rgba(15,23,42,.06);
  }
  .jp-pb-route .jp-tl-chart {
    --tl-month-h: 1.85rem;
    --tl-row-h: 3.75rem;
    --tl-bar-h: 2.55rem;
    --tl-track: #dc2626;
    --tl-track-soft: #fef2f2;
    grid-template-rows: var(--tl-month-h) auto;
    grid-auto-rows: var(--tl-row-h);
  }
  .jp-pb-route .jp-tl-track-0 { --tl-track: #dc2626; --tl-track-soft: #fef2f2; }
  .jp-pb-route .jp-tl-track-1 { --tl-track: #2563eb; --tl-track-soft: #eff6ff; }
  .jp-pb-route .jp-tl-track-2 { --tl-track: #059669; --tl-track-soft: #ecfdf5; }
  .jp-pb-route .jp-tl-track-3 { --tl-track: #d97706; --tl-track-soft: #fffbeb; }
  .jp-pb-route .jp-tl-track-4 { --tl-track: #7c3aed; --tl-track-soft: #f5f3ff; }
  .jp-pb-route .jp-tl-track-5 { --tl-track: #db2777; --tl-track-soft: #fdf2f8; }
  .jp-pb-route .jp-tl-track-6 { --tl-track: #0f766e; --tl-track-soft: #f0fdfa; }
  .jp-pb-route .jp-tl-track-7 { --tl-track: #ea580c; --tl-track-soft: #fff7ed; }
  .jp-pb-route .jp-tl-track-8 { --tl-track: #4f46e5; --tl-track-soft: #eef2ff; }
  .jp-pb-route .jp-tl-track-9 { --tl-track: #4d7c0f; --tl-track-soft: #f7fee7; }
  .jp-pb-route .jp-tl-corner {
    font-size: .72rem;
    padding: 0 1rem .5rem;
  }
  .jp-pb-route .jp-tl-month {
    font-size: .78rem;
    letter-spacing: .02em;
  }
  .jp-pb-route .jp-tl-day {
    padding: .28rem 0 .35rem;
    border-bottom: 1px solid #e2e8f0;
  }
  .jp-pb-route .jp-tl-day .n { font-size: .88rem; }
  .jp-pb-route .jp-tl-day .w { font-size: .66rem; }
  .jp-pb-route .jp-tl-line.is-week-start { box-shadow: inset 2px 0 0 #94a3b8; }
  .jp-pb-route .jp-tl-day.is-today {
    background: #fff1f2;
    box-shadow: inset 0 3px 0 var(--tl-today);
  }
  .jp-pb-route .jp-tl-label {
    flex-direction: row;
    flex-wrap: nowrap;
    align-items: center;
    gap: .38rem;
    padding: .28rem .55rem .28rem .6rem;
    overflow: hidden;
    border-left-width: 4px;
    border-left-color: var(--tl-track);
    background: var(--tl-track-soft);
  }
  .jp-pb-route .jp-tl-products { margin: 0; flex: 0 0 auto; }
  .jp-pb-route .jp-tl-product {
    width: 1.7rem;
    height: 1.7rem;
    flex-basis: 1.7rem;
    border-radius: .35rem;
  }
  .jp-pb-route .jp-tl-swatch {
    display: inline-block;
    width: .72rem;
    height: .72rem;
    flex: 0 0 .72rem;
    border-radius: 999px;
    background: var(--tl-track);
    box-shadow: 0 0 0 2px #fff;
  }
  .jp-pb-route .jp-tl-color-form {
    display: inline-flex;
    align-items: center;
    gap: .1rem;
    margin: 0;
    flex: 0 0 auto;
  }
  .jp-pb-route .jp-tl-color-form input[type="color"] {
    -webkit-appearance: none;
    appearance: none;
    width: 1.2rem;
    height: 1.2rem;
    padding: 0;
    border: 0;
    background: transparent;
    cursor: pointer;
    border-radius: 999px;
  }
  .jp-pb-route .jp-tl-color-form input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
  .jp-pb-route .jp-tl-color-form input[type="color"]::-webkit-color-swatch {
    border: 2px solid #fff;
    border-radius: 999px;
    box-shadow: 0 0 0 1px rgba(15, 23, 42, .22);
  }
  .jp-pb-route .jp-tl-color-form input[type="color"]::-moz-color-swatch {
    border: 2px solid #fff;
    border-radius: 999px;
  }
  .jp-pb-route .jp-tl-color-clear {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 1rem;
    height: 1rem;
    padding: 0;
    border: 0;
    border-radius: 999px;
    background: transparent;
    color: #64748b;
    font-size: .85rem;
    line-height: 1;
    cursor: pointer;
  }
  .jp-pb-route .jp-tl-color-clear:hover { color: #991b1b; background: #fff; }
  .jp-pb-route .jp-tl-label .jp-tl-code { font-size: .8rem; }
  .jp-pb-route .jp-tl-id {
    display: flex;
    flex-direction: column;
    justify-content: center;
    min-width: 0;
    gap: .05rem;
  }
  .jp-pb-route .jp-tl-st {
    display: block;
    width: auto;
    padding: 0;
    border-radius: 0;
    background: none;
    font-size: .64rem;
    font-weight: 700;
    letter-spacing: 0;
    line-height: 1.15;
    color: #64748b;
  }
  .jp-pb-route .jp-tl-st.is-queued,
  .jp-pb-route .jp-tl-st.is-ranked { color: #b45309; background: none; }
  .jp-pb-route .jp-tl-st.is-on_hold { color: #64748b; background: none; }
  .jp-pb-route .jp-tl-st.is-released,
  .jp-pb-route .jp-tl-st.is-in_progress { color: #b91c1c; background: none; }
  .jp-pb-route .jp-tl-st.is-done { color: #166534; background: none; }
  .jp-pb-route .jp-tl-st.is-late { color: #7f1d1d; background: none; }
  .jp-pb-route .jp-tl-slot {
    min-height: var(--tl-row-h);
    padding: 0;
    justify-content: center;
    background: var(--tl-track-soft);
  }
  .jp-pb-route .jp-tl-slot.is-weekend {
    background: color-mix(in srgb, var(--tl-track-soft) 35%, #f8fafc);
  }
  .jp-pb-route .jp-tl-slot.is-today {
    background: color-mix(in srgb, var(--tl-track-soft) 40%, #fef2f2);
  }
  .jp-pb-route .jp-tl-bar {
    align-self: center;
    height: var(--tl-bar-h);
    min-height: var(--tl-bar-h);
    max-height: var(--tl-bar-h);
    flex-direction: column;
    gap: .02rem;
    padding: .12rem .4rem .14rem;
    margin: 0 2px;
    border-radius: .4rem;
    background: var(--tl-track);
    box-shadow: 0 2px 6px color-mix(in srgb, var(--tl-track) 35%, transparent);
  }
  .jp-pb-route .jp-tl-bar-name {
    font-size: .72rem;
    line-height: 1.2;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    word-break: normal;
  }
  .jp-pb-route .jp-tl-bar-code {
    font-size: .64rem;
    line-height: 1.15;
    font-weight: 700;
    opacity: .92;
  }
  .jp-pb-route .jp-tl-bar.is-npl {
    background: var(--tl-track-soft);
    color: var(--tl-track);
    box-shadow: inset 0 0 0 1.5px var(--tl-track);
  }
  .jp-pb-route .jp-tl-bar.is-npl .jp-tl-bar-code { opacity: .8; }
  .jp-pb-route .jp-tl-bar.is-late {
    background: var(--tl-track);
    box-shadow: 0 2px 6px color-mix(in srgb, var(--tl-track) 35%, transparent), inset 0 0 0 2px #7f1d1d;
  }
  .jp-pb-route .jp-tl-bar.is-late::after {
    content: '';
    position: absolute;
    top: 0; right: 0;
    border-top: .7rem solid #7f1d1d;
    border-left: .7rem solid transparent;
  }
  .jp-pb-route .jp-tl-bar.is-late.is-npl {
    background: var(--tl-track-soft);
    color: var(--tl-track);
  }
  .jp-pb-route .jp-tl-chart.is-order-focus .jp-tl-bar,
