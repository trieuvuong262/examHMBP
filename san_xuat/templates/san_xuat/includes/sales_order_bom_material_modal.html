{# Popup Thêm NPL vào BOM đơn — chọn nhóm rồi chọn NPL trong nhóm (danh mục nguyên phụ liệu). #}
<style>
  #jpBomMaterialModal .modal-content { border: 0; border-radius: 12px; overflow: hidden; }
  #jpBomMaterialModal .modal-header { background: var(--hm-bg-light, #f8fafc); border-bottom: 1px solid #e5e9f0; }
  #jpBomMaterialModal .jp-bom-lbl { font-size: .78rem; font-weight: 600; color: #64748b; margin-bottom: .3rem; display: flex; align-items: center; gap: .35rem; }
  #jpBomMaterialModal .jp-step-num { width: 1.2rem; height: 1.2rem; border-radius: 50%; background: var(--hm-primary, #dc2626); color: #fff; display: inline-flex; align-items: center; justify-content: center; font-size: .68rem; line-height: 1; }
  #jpBomMaterialModal .jp-step-num.is-off { background: #cbd5e1; }
  #jpBomMaterialModal .btn { display: inline-flex; align-items: center; justify-content: center; line-height: 1; }
  /* Popup cao hơn để dropdown NPL hiện được nhiều dòng (không bị khung modal cắt). */
  #jpBomMaterialModal .modal-body { min-height: min(78vh, 760px); }
  #jpBomMaterialModal .jp-npl-dd-list { max-height: min(55vh, 540px); }
  .jp-npl-dd { position: relative; }
  .jp-npl-dd-toggle { width: 100%; height: var(--jp-sx-ctl-h-sm, 38px); text-align: left; display: flex; align-items: center; gap: .5rem; background: #fff; border: 1px solid #ced4da; border-radius: .375rem; padding: 0 .6rem; font-size: .875rem; overflow: hidden; }
  .jp-npl-dd-toggle:disabled { background: #f1f5f9; color: #94a3b8; cursor: not-allowed; }
  .jp-npl-dd-toggle:not(:disabled):hover, .jp-npl-dd.is-open .jp-npl-dd-toggle { border-color: var(--hm-primary, #dc2626); box-shadow: 0 0 0 .2rem var(--hm-primary-light, rgba(220,38,38,.1)); }
  .jp-npl-dd-toggle .jp-dd-caret { margin-left: auto; color: #64748b; transition: transform .15s; }
  .jp-npl-dd.is-open .jp-dd-caret { transform: rotate(180deg); }
  .jp-npl-dd-toggle .jp-npl-opt-img { width: 26px; height: 26px; }
  .jp-npl-dd-menu { position: absolute; left: 0; right: 0; top: calc(100% + 4px); z-index: 1060; background: #fff; border: 1px solid #e2e8f0; border-radius: .5rem; box-shadow: 0 12px 30px rgba(0,0,0,.12); display: none; }
  .jp-npl-dd.is-open .jp-npl-dd-menu { display: block; }
  .jp-npl-dd-search { padding: .5rem; border-bottom: 1px solid #f1f5f9; }
  .jp-npl-dd-list { max-height: 320px; overflow-y: auto; padding: .25rem; }
  .jp-npl-opt { display: flex; align-items: center; gap: .6rem; width: 100%; border: 0; background: none; text-align: left; padding: .4rem .5rem; border-radius: .4rem; }
  .jp-npl-opt:hover, .jp-npl-opt.is-active { background: var(--hm-primary-soft, rgba(220,38,38,.08)); }
  .jp-npl-opt[disabled] { opacity: .5; cursor: not-allowed; }
  .jp-npl-opt-img, .jp-npl-card-img { flex-shrink: 0; border-radius: .35rem; background: #f1f5f9; display: inline-flex; align-items: center; justify-content: center; color: #94a3b8; overflow: hidden; }
  .jp-npl-opt-img { width: 36px; height: 36px; }
  .jp-npl-opt-img img, .jp-npl-card-img img { width: 100%; height: 100%; object-fit: cover; }
  .jp-npl-opt-main { min-width: 0; flex: 1; }
  .jp-npl-opt-name { font-size: .85rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .jp-npl-opt-sub { font-size: .72rem; color: #64748b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .jp-npl-swatch { display: inline-block; width: .7rem; height: .7rem; border-radius: 50%; border: 1px solid rgba(0,0,0,.15); vertical-align: -1px; margin-right: .2rem; }
  .jp-npl-card { border: 1px solid #e2e8f0; border-radius: .6rem; padding: .9rem; background: #fff; }
  .jp-npl-card-img { width: 112px; height: 112px; font-size: 2rem; cursor: zoom-in; border: 0; padding: 0; }
  .jp-npl-card-img.is-empty { cursor: default; }
  .jp-npl-attr { font-size: .72rem; color: #94a3b8; }
  .jp-npl-val { font-size: .85rem; font-weight: 600; color: #1e293b; word-break: break-word; }
  .jp-npl-placeholder { border: 1px dashed #cbd5e1; border-radius: .6rem; padding: 1.75rem 1rem; text-align: center; color: #cbd5e1; font-size: 1.75rem; }
</style>
<div class="modal fade" id="jpBomMaterialModal" tabindex="-1" aria-labelledby="jpBomMaterialModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content shadow">
      <div class="modal-header py-2">
        <h6 class="modal-title fw-bold mb-0" id="jpBomMaterialModalLabel"><i class="bi bi-box-seam me-2 text-hm"></i>Thêm NPL</h6>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Đóng"></button>
      </div>
      <div class="modal-body">
        <div class="row g-3 mb-3">
          <div class="col-12">
            <label class="jp-bom-lbl" for="jpBomMaterialLine">Sản phẩm</label>
            <select class="form-select form-select-sm" id="jpBomMaterialLine">
              {% for ln in order.lines.all %}
              <option value="{{ ln.pk }}">{{ ln.product_name|default:ln.product_code }}{% if ln.product_name %} · {{ ln.product_code }}{% endif %}</option>
              {% endfor %}
            </select>
          </div>
          <div class="col-md-5">
            <label class="jp-bom-lbl" for="jpBomMaterialGroup"><span class="jp-step-num">1</span>Nhóm</label>
            <select class="form-select form-select-sm" id="jpBomMaterialGroup">
              <option value="">— Chọn nhóm —</option>
              {% for cat in bom_material_categories %}
              <option value="{{ cat.pk }}">{{ cat.name }} ({{ cat.n_mat }})</option>
              {% endfor %}
            </select>
          </div>
          <div class="col-md-7">
            <span class="jp-bom-lbl"><span class="jp-step-num is-off" id="jpBomStep2">2</span>Nguyên phụ liệu</span>
            <div class="jp-npl-dd" id="jpBomMaterialDd">
              <button type="button" class="jp-npl-dd-toggle" id="jpBomMaterialToggle" disabled aria-haspopup="listbox" aria-expanded="false">
                <span class="text-muted" id="jpBomMaterialToggleText">— Chọn NPL —</span>
                <i class="bi bi-chevron-down jp-dd-caret"></i>
              </button>
              <div class="jp-npl-dd-menu" role="listbox">
                <div class="jp-npl-dd-search">
                  <input type="search" class="form-control form-control-sm" id="jpBomMaterialFilter" placeholder="Lọc mã, tên, màu" autocomplete="off">
                </div>
                <div class="jp-npl-dd-list" id="jpBomMaterialList"></div>
              </div>
            </div>
          </div>
        </div>

        <div id="jpBomMaterialCard"></div>

        <div class="mt-3 d-none" id="jpBomMaterialAdded">
          <div class="jp-bom-lbl mb-1"><i class="bi bi-check2-circle text-success"></i>Đã thêm</div>
          <div class="d-flex flex-wrap gap-1" id="jpBomMaterialAddedList"></div>
        </div>
      </div>
      <div class="modal-footer py-2">
        <button type="button" class="btn btn-sm btn-outline-secondary" data-bs-dismiss="modal">Đóng</button>
      </div>
    </div>
  </div>
</div>
