<script>
(function () {
  function setFold(root, collapsed) {
    if (!root) return;
    root.classList.toggle('is-collapsed', !!collapsed);
    var btn = root.querySelector('.jp-mo-fold-btn');
    if (!btn) return;
    btn.setAttribute('aria-expanded', collapsed ? 'false' : 'true');
    var label = btn.querySelector('[data-fold-label]');
    if (label) label.textContent = collapsed ? 'Mở rộng' : 'Thu gọn';
  }

  document.querySelectorAll('[data-jp-mo-fold]').forEach(function (root) {
    var btn = root.querySelector('.jp-mo-fold-btn');
    if (!btn) return;
    setFold(root, root.classList.contains('is-collapsed'));
    btn.addEventListener('click', function (e) {
      e.preventDefault();
      setFold(root, !root.classList.contains('is-collapsed'));
    });
  });
  document.querySelectorAll('[data-jp-mo-more]').forEach(function (root) {
    var btn = root.querySelector('.jp-mo-more-btn');
    if (!btn) return;
    btn.addEventListener('click', function (e) {
      e.preventDefault();
      var on = !root.classList.contains('is-expanded');
      root.classList.toggle('is-expanded', on);
      btn.setAttribute('aria-expanded', on ? 'true' : 'false');
      var label = btn.querySelector('[data-more-label]');
      if (label) label.textContent = on ? 'Thu gọn' : 'Xem thêm';
    });
  });
})();
</script>
