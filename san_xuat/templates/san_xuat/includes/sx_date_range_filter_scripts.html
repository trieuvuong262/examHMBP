<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  var FORM_IDS = [
    'sxListFilterForm',
    'sxPeriodFilterForm',
    'sxBomFilterForm',
    'sxCapacityFilterForm',
    'sxPieceRateFilterForm',
  ];

  function submitForm(form, delay) {
    if (!form._sxSubmitTimer) form._sxSubmitTimer = null;
    if (form._sxSubmitTimer) window.clearTimeout(form._sxSubmitTimer);
    form._sxSubmitTimer = window.setTimeout(function () {
      if (typeof form.requestSubmit === 'function') form.requestSubmit();
      else form.submit();
    }, typeof delay === 'number' ? delay : 0);
  }

  function altInputClassFor(el) {
    var cls = el.className || '';
    return cls.indexOf('form-control-sm') !== -1
      ? 'form-control form-control-sm'
      : 'form-control';
  }

  function initJpDateVn(el, opts) {
    if (!el || el._flatpickr) return;
    if (!window.flatpickr) return;
    var base = {
      dateFormat: 'Y-m-d',
      altInput: true,
      altFormat: 'd/m/Y',
      allowInput: true,
      altInputClass: altInputClassFor(el),
    };
    if (opts) {
      Object.keys(opts).forEach(function (k) { base[k] = opts[k]; });
    }
    flatpickr(el, base);
  }

  function initSxDateForm(form) {
    if (!form || form.dataset.sxDateBound === '1') return;
    form.dataset.sxDateBound = '1';

    form.querySelectorAll('.jp-date-vn').forEach(function (el) {
      initJpDateVn(el, {
        onChange: function () { submitForm(form, 0); },
      });
      if (!window.flatpickr) {
        el.addEventListener('change', function () { submitForm(form, 0); });
      }
    });

    var monthEl = form.querySelector('input[type="month"][name="month"]');
    if (monthEl) {
      monthEl.addEventListener('change', function () {
        var val = (monthEl.value || '').trim();
        if (!val) return;
        var parts = val.split('-');
        if (parts.length !== 2) return;
        var y = parseInt(parts[0], 10);
        var m = parseInt(parts[1], 10);
        if (!y || !m) return;
        var first = new Date(y, m - 1, 1);
        var last = new Date(y, m, 0);
        function fmt(d) {
          var mm = String(d.getMonth() + 1).padStart(2, '0');
          var dd = String(d.getDate()).padStart(2, '0');
          return d.getFullYear() + '-' + mm + '-' + dd;
        }
        var dateEls = form.querySelectorAll('.jp-date-vn');
        if (dateEls.length >= 2) {
          dateEls[0].value = fmt(first);
          if (dateEls[0]._flatpickr) dateEls[0]._flatpickr.setDate(fmt(first), false);
          dateEls[1].value = fmt(last);
          if (dateEls[1]._flatpickr) dateEls[1]._flatpickr.setDate(fmt(last), false);
        }
        submitForm(form, 0);
      });
    }
  }

  FORM_IDS.forEach(function (id) {
    initSxDateForm(document.getElementById(id));
  });

  /* Form nghiệp vụ (LSX, QC…) — cùng style dd/mm/yyyy, không auto-submit */
  document.querySelectorAll('.jp-date-vn').forEach(function (el) {
    initJpDateVn(el);
  });
});
</script>
