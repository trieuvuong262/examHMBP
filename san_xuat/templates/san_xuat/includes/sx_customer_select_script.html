{# TomSelect khách hàng KiotViet — san_xuat:customer_search #}
<script>
(function () {
  if (typeof TomSelect === 'undefined') return;
  var searchUrl = '{% url "san_xuat:customer_search" %}';
  var PLACEHOLDER = 'Gõ tên, mã KH hoặc SĐT…';

  function initCustomerSelect(el) {
    if (!el || el.tomselect) return null;
    var initial = (el.value || '').trim();
    var initialLabel = el.options && el.selectedIndex >= 0 && el.options[el.selectedIndex]
      ? el.options[el.selectedIndex].textContent.trim()
      : initial;
    var ph = el.dataset.placeholder || PLACEHOLDER;

    return new TomSelect(el, {
      maxItems: 1,
      maxOptions: 40,
      valueField: 'id',
      labelField: 'text',
      searchField: ['text', 'name', 'code', 'phone'],
      placeholder: ph,
      create: function (input) {
        input = (input || '').trim();
        if (!input) return false;
        return { id: input, text: input, name: input, code: '', phone: '' };
      },
      createOnBlur: true,
      persist: false,
      dropdownParent: 'body',
      openOnFocus: true,
      loadThrottle: 220,
      load: function (query, callback) {
        fetch(searchUrl + '?q=' + encodeURIComponent(query || ''), {
          headers: { 'Accept': 'application/json' },
        })
          .then(function (r) { return r.json(); })
          .then(function (data) { callback(data.results || []); })
          .catch(function () { callback(); });
      },
      render: {
        option: function (data, escape) {
          var title = escape(data.text || data.name || data.id || '');
          var sub = '';
          if (data.code || data.phone) {
            var bits = [];
            if (data.code) bits.push(escape(data.code));
            if (data.phone) bits.push(escape(data.phone));
            sub = '<div class="text-muted small">' + bits.join(' · ') + '</div>';
          }
          return '<div>' + title + sub + '</div>';
        },
        item: function (data, escape) {
          return '<div>' + escape(data.name || data.id || data.text || '') + '</div>';
        },
        option_create: function (data, escape) {
          return '<div class="create">Dùng «' + escape(data.input) + '»</div>';
        },
      },
      onInitialize: function () {
        if (this.control_input) {
          this.control_input.setAttribute('placeholder', ph);
        }
        if (!initial) {
          this.clear(true);
          return;
        }
        if (!this.options[initial]) {
          this.addOption({
            id: initial,
            text: initialLabel || initial,
            name: initial,
            code: '',
            phone: '',
          });
        }
        this.setValue(initial, true);
      },
    });
  }

  window.jpInitCustomerSelect = initCustomerSelect;
  document.querySelectorAll('.jp-so-customer-select').forEach(initCustomerSelect);
})();
</script>
