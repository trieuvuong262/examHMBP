{# TomSelect gõ tìm công đoạn từ thư viện chuẩn Công đoạn / IE #}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tom-select@2.4.1/dist/css/tom-select.bootstrap5.min.css">
<script src="https://cdn.jsdelivr.net/npm/tom-select@2.4.1/dist/js/tom-select.complete.min.js"></script>
<script>
(function () {
  var searchUrl = '{% url "san_xuat:process_catalog_search" %}';

  function initTomSelect(sel) {
    if (!sel || sel.tomselect || typeof TomSelect === 'undefined') return;
    new TomSelect(sel, {
      maxOptions: 80,
      maxItems: 1,
      allowEmptyOption: true,
      placeholder: sel.dataset.placeholder || 'Gõ tìm công đoạn…',
      dropdownParent: 'body',
      openOnFocus: true,
      create: false,
      sortField: { field: 'text', direction: 'asc' },
      loadThrottle: 200,
      load: function (query, callback) {
        var q = (query || '').trim();
        if (!q) {
          callback();
          return;
        }
        fetch(searchUrl + '?q=' + encodeURIComponent(q), {
          headers: { 'Accept': 'application/json' },
        })
          .then(function (r) { return r.json(); })
          .then(function (data) {
            callback((data.results || []).map(function (row) {
              return { value: row.id || row.name, text: row.text || row.name };
            }));
          })
          .catch(function () { callback(); });
      },
    });
  }

  function initAll() {
    document.querySelectorAll('select.jp-sx-process-select').forEach(function (sel) {
      initTomSelect(sel);
    });
  }

  initAll();

  var addRowBtn = document.getElementById('add-process-row');
  if (addRowBtn) {
    addRowBtn.addEventListener('click', function () {
      window.setTimeout(initAll, 0);
    });
  }
})();
</script>
