{# TomSelect gõ tìm công đoạn (tuỳ chọn nút thêm danh mục) #}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tom-select@2.4.1/dist/css/tom-select.bootstrap5.min.css">
<script src="https://cdn.jsdelivr.net/npm/tom-select@2.4.1/dist/js/tom-select.complete.min.js"></script>
<style>
.jp-sx-process-picker .ts-wrapper {
  flex: 1 1 auto;
  min-width: 0;
}
.jp-sx-process-picker .ts-control {
  border-top-right-radius: 0;
  border-bottom-right-radius: 0;
}
.jp-sx-process-picker .jp-sx-process-add {
  flex: 0 0 auto;
}
.jp-sx-process-picker:not(:has(.jp-sx-process-add)) .ts-control {
  border-radius: var(--bs-border-radius-sm, 0.25rem);
}
</style>
<script>
(function () {
  var allowAdd = {% if process_select_allow_add == 0 or process_select_allow_add == '0' or process_select_allow_add == False %}false{% else %}true{% endif %};
  var addUrl = '{% url "san_xuat:process_catalog_add" %}';
  var searchUrl = '{% url "san_xuat:process_catalog_search" %}';
  var csrf = (document.querySelector('[name=csrfmiddlewaretoken]') || {}).value || '';
  if (!csrf) {
    var m = document.cookie.match(/(?:^|; )csrftoken=([^;]+)/);
    csrf = m ? decodeURIComponent(m[1]) : '';
  }

  function wrapSelect(sel) {
    if (!sel || sel.closest('.jp-sx-process-picker')) return;
    if (!allowAdd) return;
    var wrap = document.createElement('div');
    wrap.className = 'input-group input-group-sm jp-sx-process-picker';
    sel.parentNode.insertBefore(wrap, sel);
    wrap.appendChild(sel);
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'btn btn-outline-secondary jp-sx-process-add';
    btn.title = 'Thêm công đoạn vào danh mục';
    btn.setAttribute('aria-label', 'Thêm công đoạn');
    btn.innerHTML = '<i class="bi bi-plus-lg" aria-hidden="true"></i>';
    wrap.appendChild(btn);
  }

  function initTomSelect(sel) {
    if (!sel || sel.tomselect || typeof TomSelect === 'undefined') return;
    new TomSelect(sel, {
      maxOptions: 80,
      maxItems: 1,
      allowEmptyOption: true,
      placeholder: sel.dataset.placeholder || 'Gõ tìm công đoạn…',
      dropdownParent: 'body',
      openOnFocus: true,
      create: false,
      sortField: { field: 'text', direction: 'asc' },
      loadThrottle: 200,
      load: function (query, callback) {
        var q = (query || '').trim();
        if (!q) {
          callback();
          return;
        }
        fetch(searchUrl + '?q=' + encodeURIComponent(q), {
          headers: { 'Accept': 'application/json' },
        })
          .then(function (r) { return r.json(); })
          .then(function (data) {
            callback((data.results || []).map(function (row) {
              return { value: row.id || row.name, text: row.text || row.name };
            }));
          })
          .catch(function () { callback(); });
      },
    });
  }

  function addOptionToAll(name) {
    document.querySelectorAll('select.jp-sx-process-select').forEach(function (sel) {
      if (sel.tomselect) {
        if (!sel.tomselect.options[name]) {
          sel.tomselect.addOption({ value: name, text: name });
        }
        return;
      }
      var exists = false;
      Array.prototype.forEach.call(sel.options, function (opt) {
        if ((opt.value || '').toLowerCase() === name.toLowerCase()) exists = true;
      });
      if (!exists) {
        var opt = document.createElement('option');
        opt.value = name;
        opt.textContent = name;
        sel.appendChild(opt);
      }
    });
  }

  function onAddClick(btn) {
    var wrap = btn.closest('.jp-sx-process-picker');
    var sel = wrap && wrap.querySelector('select.jp-sx-process-select');
    var name = window.prompt('Tên công đoạn mới:');
    if (name == null) return;
    name = String(name).trim();
    if (!name) return;
    fetch(addUrl, {
      method: 'POST',
      headers: {
        'Accept': 'application/json',
        'Content-Type': 'application/json',
        'X-CSRFToken': csrf,
      },
      body: JSON.stringify({ name: name }),
    })
      .then(function (r) { return r.json().then(function (data) { return { ok: r.ok, data: data }; }); })
      .then(function (res) {
        if (!res.ok) {
          window.alert((res.data && res.data.error) || 'Không thêm được công đoạn.');
          return;
        }
        var saved = (res.data && res.data.name) || name;
        addOptionToAll(saved);
        if (sel && sel.tomselect) {
          sel.tomselect.addOption({ value: saved, text: saved });
          sel.tomselect.setValue(saved, true);
        } else if (sel) {
          sel.value = saved;
          sel.dispatchEvent(new Event('change', { bubbles: true }));
        }
      })
      .catch(function () {
        window.alert('Không thêm được công đoạn.');
      });
  }

  function initAll() {
    document.querySelectorAll('select.jp-sx-process-select').forEach(function (sel) {
      wrapSelect(sel);
      initTomSelect(sel);
    });
  }

  initAll();

  if (allowAdd) {
    document.addEventListener('click', function (e) {
      var btn = e.target.closest('.jp-sx-process-add');
      if (btn) {
        e.preventDefault();
        onAddClick(btn);
      }
    });
  }

  var addRowBtn = document.getElementById('add-process-row');
  if (addRowBtn) {
    addRowBtn.addEventListener('click', function () {
      window.setTimeout(initAll, 0);
    });
  }
})();
</script>
