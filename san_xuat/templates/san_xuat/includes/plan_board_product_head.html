{% load sx_format %}
<div class="jp-pb-product-head">
  {% if pf.image_url %}
  <button type="button" class="sx-doc-thumb jp-pb-product-thumb" data-sx-gallery
          data-sx-gallery-title="{{ pf.product_name|default:pf.product_code }}"
          data-sx-gallery-images="{{ pf.image_urls_json }}"
          aria-label="Phóng to ảnh {{ pf.product_name|default:pf.product_code }}">
    <img src="{{ pf.image_url }}" alt="" class="jp-pb-product-image">
  </button>
  {% else %}
  <span class="jp-pb-product-image-placeholder" aria-hidden="true"><i class="bi bi-image"></i></span>
  {% endif %}
  <span class="jp-pb-product-code"{% if pf.product_name %} title="{{ pf.product_code }}"{% endif %}>{{ pf.product_name|default:pf.product_code }}</span>
  <span class="jp-pb-product-qty">SL {{ pf.qty|sx_num }}</span>
</div>
