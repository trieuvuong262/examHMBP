<form method="get" id="sxPeriodFilterForm" class="card border-0 shadow-sm mb-4 jp-team-filter-form">
  {% if tab_value %}<input type="hidden" name="tab" id="sx-filter-tab" value="{{ tab_value }}">{% endif %}
  <div class="card-body p-3 jp-team-filter-body">
    <div class="jp-team-filter-dates">
      <div>
        <label class="form-label fw-bold small mb-1" for="sx-date-from">Từ ngày</label>
        <input type="date" name="date_from" id="sx-date-from" value="{{ date_from|date:'Y-m-d' }}" class="form-control jp-date-vn">
      </div>
      <div>
        <label class="form-label fw-bold small mb-1" for="sx-date-to">Đến ngày</label>
        <input type="date" name="date_to" id="sx-date-to" value="{{ date_to|date:'Y-m-d' }}" class="form-control jp-date-vn">
      </div>
    </div>
    <div class="jp-team-filter-period">
      <label class="form-label fw-bold small mb-1" for="sx-month">Tháng</label>
      <input type="month" name="month" id="sx-month" value="{{ month_value }}" class="form-control">
    </div>
    <div class="jp-team-filter-org-search">
      <div class="jp-team-filter-org">
        <label class="form-label fw-bold small mb-1" for="sx-product">Mã sản phẩm</label>
        <input type="text" name="product_code" id="sx-product" value="{{ product_code }}"
               class="form-control" placeholder="Tất cả" autocomplete="off">
      </div>
      {% if show_process %}
      <div class="jp-team-filter-org">
        <label class="form-label fw-bold small mb-1" for="sx-process">Công đoạn</label>
        <input type="text" name="process_name" id="sx-process" value="{{ process_name }}"
               class="form-control" placeholder="Tất cả" autocomplete="off">
      </div>
      {% endif %}
      <div class="jp-team-filter-org">
        <label class="form-label fw-bold small mb-1" for="sx-team">Tổ / chuyền</label>
        <input type="text" name="team_label" id="sx-team" value="{{ team_label }}"
               class="form-control" placeholder="Tất cả" autocomplete="off">
      </div>
    </div>
    <div class="jp-team-filter-actions">
      <button type="submit" class="btn btn-hm btn-sm fw-bold">Lọc</button>
      {% if has_filters %}
      <a href="{{ clear_url }}" class="btn btn-light border" title="Xóa bộ lọc"><i class="bi bi-x-lg"></i></a>
      {% endif %}
    </div>
  </div>
</form>
