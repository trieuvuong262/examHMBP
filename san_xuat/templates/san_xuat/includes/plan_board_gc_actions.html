{% if row.subcontracts and can_view_subcontract %}
  {% for item in row.subcontracts %}
  <a href="{% url 'san_xuat:subcontract_detail' item.pk %}"
     class="btn btn-outline-secondary btn-sm fw-bold"
     title="{{ item.code }}{% if item.team_label %} · {{ item.team_label }}{% endif %}">
    {% if forloop.first %}Phiếu Thuê SX ({{ row.subcontracts|length }}){% else %}{{ item.code }}{% endif %}
  </a>
  {% endfor %}
{% endif %}
