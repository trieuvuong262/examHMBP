<div class="row g-2">
  {% for row in owner_rows %}
  <div class="col-md-6">
    <label class="form-label small fw-bold mb-1" for="owner_{{ row.key }}">{{ row.label }}</label>
    <select name="owner_{{ row.key }}" id="owner_{{ row.key }}" class="form-select form-select-sm jp-tksp-user-select" multiple>
      {% for u in row.users %}
      <option value="{{ u.pk }}"{% if u.pk in row.selected %} selected{% endif %}
          data-avatar="{{ u.avatar }}" data-initial="{{ u.initial }}" data-tone="{{ u.tone }}">{{ u.name }}</option>
      {% endfor %}
    </select>
  </div>
  {% endfor %}
</div>
