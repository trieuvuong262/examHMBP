<div class="modal fade" id="rmTaskModal" tabindex="-1" aria-labelledby="rmTaskModalTitle" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <form method="post" class="modal-content" id="rmTaskForm" action="" enctype="multipart/form-data">
      {% csrf_token %}
      <input type="hidden" name="task_id" value="">
      <input type="hidden" name="return_tab" value="{{ return_tab|default:'timeline' }}">
      {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
      <div class="modal-header">
        <h5 class="modal-title fs-6 fw-bold" id="rmTaskModalTitle">Cập nhật công việc</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Đóng"></button>
      </div>
      <div class="modal-body">
        <p class="fw-bold mb-2" data-rm-title></p>
        <div class="row g-2">
          <div class="col-md-4">
            <label class="form-label small fw-bold mb-1" for="id_rm_status">Trạng thái</label>
            <select name="status" id="id_rm_status" class="form-select form-select-sm">
              {% for value, label in task_form.fields.status.choices %}<option value="{{ value }}">{{ label }}</option>{% endfor %}
            </select>
          </div>
          {% if can_assign %}
          <div class="col-md-4">
            <label class="form-label small fw-bold mb-1" for="id_rm_start">Ngày bắt đầu</label>
            <input type="date" name="start_date" id="id_rm_start" class="form-control form-control-sm jp-date-vn">
          </div>
          <div class="col-md-4">
            <label class="form-label small fw-bold mb-1" for="id_rm_due">Hạn hoàn thành</label>
            <input type="date" name="due_date" id="id_rm_due" class="form-control form-control-sm jp-date-vn">
          </div>
          <div class="col-md-6">
            <label class="form-label small fw-bold mb-1" for="id_rm_owner">Người chịu trách nhiệm chính</label>
            <select name="owner" id="id_rm_owner" class="form-select form-select-sm jp-tksp-user-select">
              {% for value, label in task_form.fields.owner.choices %}<option value="{{ value }}">{{ label }}</option>{% endfor %}
            </select>
          </div>
          <div class="col-md-6">
            <label class="form-label small fw-bold mb-1" for="id_rm_collab">Người phối hợp</label>
            <select name="collaborators" id="id_rm_collab" class="form-select form-select-sm jp-tksp-user-select" multiple>
              {% for value, label in task_form.fields.collaborators.choices %}{% if value %}<option value="{{ value }}">{{ label }}</option>{% endif %}{% endfor %}
            </select>
          </div>
          {% endif %}
          <div class="col-12">
            <label class="form-label small fw-bold mb-1" for="id_rm_evidence">Bằng chứng / kết quả <span class="text-danger d-none" data-rm-evidence-req>* (ghi chú hoặc đính kèm tệp)</span></label>
            <textarea name="evidence" id="id_rm_evidence" rows="2" class="form-control form-control-sm" placeholder="Link tài liệu, số phiếu, kết quả…"></textarea>
          </div>
          <div class="col-12">
            <label class="form-label small fw-bold mb-1" for="id_rm_files">Đính kèm tệp bằng chứng</label>
            <input type="file" name="files" id="id_rm_files" class="form-control form-control-sm" multiple>
            <div class="form-text">Tối đa 50 MB mỗi tệp. Tệp đã đính kèm hiển thị ở dòng công việc.</div>
          </div>
          <div class="col-12">
            <label class="form-label small fw-bold mb-1" for="id_rm_delay">Lý do trễ / vướng mắc</label>
            <textarea name="delay_reason" id="id_rm_delay" rows="2" class="form-control form-control-sm"></textarea>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-sm btn-outline-secondary fw-bold" data-bs-dismiss="modal">Đóng</button>
        <button type="submit" class="btn btn-sm btn-hm text-white fw-bold">Lưu</button>
      </div>
    </form>
  </div>
</div>
<script>
document.addEventListener('DOMContentLoaded', function () {
  var modal = document.getElementById('rmTaskModal');
  if (!modal) return;
  function setDate(input, value) {
    if (!input) return;
    if (input._flatpickr) input._flatpickr.setDate(value || null, false); else input.value = value || '';
  }
  modal.addEventListener('show.bs.modal', function (e) {
    var btn = e.relatedTarget;
    if (!btn) return;
    var form = document.getElementById('rmTaskForm');
    form.action = btn.getAttribute('data-rm-plan-action');
    form.querySelector('[name="task_id"]').value = btn.getAttribute('data-rm-task');
    form.querySelector('[data-rm-title]').textContent = btn.getAttribute('data-title');
    form.querySelector('[name="status"]').value = btn.getAttribute('data-status');
    setDate(form.querySelector('[name="due_date"]'), btn.getAttribute('data-due'));
    setDate(form.querySelector('[name="start_date"]'), btn.getAttribute('data-start'));
    var owner = form.querySelector('[name="owner"]');
    if (owner) {
      var v = btn.getAttribute('data-owner') || '';
      if (owner.tomselect) owner.tomselect.setValue(v, true); else owner.value = v;
    }
    var collab = form.querySelector('[name="collaborators"]');
    if (collab) {
      var ids = (btn.getAttribute('data-collab') || '').split(',').filter(Boolean);
      if (collab.tomselect) collab.tomselect.setValue(ids, true);
      else Array.prototype.forEach.call(collab.options, function (o) { o.selected = ids.indexOf(o.value) !== -1; });
    }
    var files = form.querySelector('[name="files"]');
    if (files) files.value = '';
    var cell = btn.parentElement;
    var ev = cell.querySelector('template[data-rm-evidence]');
    var dl = cell.querySelector('template[data-rm-delay]');
    form.querySelector('[name="evidence"]').value = ev ? ev.content.textContent.trim() : '';
    form.querySelector('[name="delay_reason"]').value = dl ? dl.content.textContent.trim() : '';
    form.querySelector('[data-rm-evidence-req]').classList.toggle('d-none', btn.getAttribute('data-blocker') !== '1');
  });
});
</script>
