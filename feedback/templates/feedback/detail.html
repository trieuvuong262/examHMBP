{% extends 'base.html' %}

{% block content %}
<div class="container jp-page py-3 py-md-4 mb-5">
    <div class="jp-page-header mb-3 mb-md-4">
        <div>
            <h2 class="fw-bold text-hm mb-1 jp-page-title"><i class="bi bi-chat-square-text-fill me-2"></i>{{ feedback.title }}</h2>
            <p class="text-muted mb-0 jp-hide-mobile-subtitle">
                {{ feedback.submitter_display }}
                · {{ feedback.created_at|date:"d/m/Y H:i" }}
            </p>
        </div>
        <a href="{% url 'feedback:list' %}" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left me-1"></i>Quay lại
        </a>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-body p-3 p-md-4">
            {% if feedback.is_anonymous %}
            <span class="badge bg-secondary-subtle text-secondary mb-3"><i class="bi bi-incognito"></i> Ẩn danh</span>
            {% endif %}
            <div class="text-body">{{ feedback.body|linebreaks }}</div>
        </div>
    </div>
</div>
{% endblock %}
