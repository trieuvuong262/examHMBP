# Gõ https://IP → chuyển sang http://IP (app phục vụ HTTP).
server {
    listen 443 ssl;
    listen 8443 ssl;
    http2 on;
    server_name 103.90.224.203 100.79.206.125;

    ssl_certificate /etc/nginx/ip-certs/vps-ip.crt;
    ssl_certificate_key /etc/nginx/ip-certs/vps-ip.key;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        return 301 http://$host$request_uri;
    }
}
