server {
    listen 443 ssl;
    http2 on;
    server_name portfolio.phongkstudio.com;

    ssl_certificate /etc/letsencrypt/live/portfolio.phongkstudio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/portfolio.phongkstudio.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 6m;

    include /etc/nginx/conf.d/security-headers.conf;
    include /etc/nginx/conf.d/performance.conf;
    include /etc/nginx/error-pages.conf;
    include /etc/nginx/scanner-block.conf;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $portfolio_backend portfolio:8000;
        proxy_pass http://$portfolio_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 15s;
        proxy_read_timeout 60s;
    }
}
