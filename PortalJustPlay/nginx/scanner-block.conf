# Chặn probe scanner trước khi vào gunicorn.
# Include bên trong server { } (HTTP + HTTPS). Không đặt file này vào conf.d/
# vì nginx alpine nạp conf.d/*.conf ở http context — location sẽ lỗi.
#
# 444 = đóng kết nối, không trả body. Vẫn ghi access log để tab nginx thấy.

if ($request_method !~ ^(GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS)$) {
    return 444;
}

location ^~ /.env { return 444; }
location ^~ /.git { return 444; }
location ^~ /.aws { return 444; }
location ^~ /wp-admin { return 444; }
location ^~ /wp-login.php { return 444; }
location ^~ /wp-content { return 444; }
location ^~ /wp-includes { return 444; }
location ^~ /xmlrpc.php { return 444; }
location ^~ /phpmyadmin { return 444; }
location ^~ /cgi-bin { return 444; }
location ^~ /administrator { return 444; }
location ^~ /vendor/phpunit { return 444; }
location ^~ /actuator { return 444; }
location ^~ /telescope { return 444; }
location ^~ /debug/default { return 444; }
location ^~ /autodiscover { return 444; }
location ^~ /owa { return 444; }
location ^~ /HNAP1 { return 444; }
location ^~ /boaform { return 444; }
location = /index.php { return 444; }
location = /hello.world { return 444; }
location = /bin/sh { return 444; }
location = /bin/bash { return 444; }

location ~* \.php$ { return 444; }
