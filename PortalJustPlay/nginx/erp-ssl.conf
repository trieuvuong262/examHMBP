# HTTPS — erp.justplay.vn → Odoo (127.0.0.1:8069 trên host)
upstream odoo_app_ssl {
    server odoo-web:8069;
}

upstream odoo_longpolling_ssl {
    server odoo-web:8072;
}

server {
    listen 443 ssl;
    http2 on;
    server_name erp.justplay.vn;

    ssl_certificate /etc/letsencrypt/live/erp.justplay.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/erp.justplay.vn/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 200M;

    include /etc/nginx/conf.d/security-headers.conf;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location /longpolling/ {
        proxy_pass http://odoo_longpolling_ssl;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://odoo_app_ssl;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_redirect off;
        proxy_connect_timeout 90s;
        proxy_send_timeout 720s;
        proxy_read_timeout 720s;
    }
}
