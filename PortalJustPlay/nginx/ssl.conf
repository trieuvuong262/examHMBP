# Copy thành ssl.conf sau khi có chứng chỉ: scripts/setup-ssl.sh
# Hoặc: cp PortalJustPlay/nginx/ssl.conf.example PortalJustPlay/nginx/ssl.conf

server {
    # default_server: HTTPS theo IP (103.90.224.203) không rơi vào erp-ssl stub 503.
    # Cert Let's Encrypt chỉ có SAN portal.justplay.vn — trình duyệt vẫn cảnh báo nếu gõ IP.
    listen 443 ssl default_server;
    http2 on;
    server_name portal.justplay.vn 103.90.224.203;

    ssl_certificate /etc/letsencrypt/live/portal.justplay.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/portal.justplay.vn/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 100M;

    include /etc/nginx/conf.d/security-headers.conf;
    include /etc/nginx/conf.d/performance.conf;
    include /etc/nginx/error-pages.conf;
    include /etc/nginx/scanner-block.conf;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://django_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_redirect off;
        # Giữ kết nối tới gunicorn — bỏ bắt tay TCP mỗi request
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location /static/ {
        alias /app/staticfiles/;
        # File tĩnh đã gắn ?v= khi đổi nội dung nên cache dài được
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    location /media/ {
        alias /app/media/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }
}
