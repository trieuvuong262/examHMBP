# Trang lỗi do nginx tự trả (app/gunicorn không phản hồi).
# Include trong server { } — không đặt file này vào conf.d/ vì chứa location.
error_page 502 /jp-errors/502.html;

location = /jp-errors/502.html {
    alias /etc/nginx/jp-errors/502.html;
    default_type text/html;
    charset utf-8;
    internal;
}
