<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <script>
        (function () {
            try {
                if (localStorage.getItem('jp_theme') === 'dark') {
                    document.documentElement.setAttribute('data-theme', 'dark');
                }
            } catch (e) {}
        })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Không kết nối được máy chủ - Just Play Portal</title>
    <meta name="theme-color" content="#dc2626">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/images/logo/favicon-32.png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root {
            --hm-primary: #dc2626;
            --hm-primary-dark: #b91c1c;
            --hm-primary-soft: rgba(220, 38, 38, 0.08);
            --jp-text-primary: #111111;
            --jp-text-muted: #64748b;
            --jp-surface-bg: #ffffff;
            --jp-surface-border: #e2e8f0;
        }
        [data-theme="dark"] {
            --jp-text-primary: #f5f5f5;
            --jp-text-muted: #a3a3a3;
            --jp-surface-bg: #1a1a1a;
            --jp-surface-border: #404040;
        }
        * { box-sizing: border-box; }
        body {
            min-height: 100vh;
            margin: 0;
            font-family: system-ui, -apple-system, sans-serif;
            background: linear-gradient(160deg, #f5f5f5 0%, #fff 45%, rgba(220, 38, 38, 0.08) 100%);
            color: var(--jp-text-primary);
        }
        [data-theme="dark"] body { background: #111; }
        .bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.85rem 1.25rem;
            background: #dc2626;
            color: #fff;
        }
        .bar img { height: 28px; width: auto; }
        .bar a { color: #fff; text-decoration: none; font-size: 0.9rem; }
        .jp-http-error {
            min-height: min(68vh, 620px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.75rem 1rem 2.5rem;
        }
        .jp-http-error-card {
            width: 100%;
            max-width: 32rem;
            text-align: center;
            background: var(--jp-surface-bg);
            border: 1px solid var(--jp-surface-border);
            border-radius: 16px;
            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.08);
            padding: 2.15rem 1.5rem 1.85rem;
        }
        .jp-http-error-icon {
            width: 4.25rem;
            height: 4.25rem;
            margin: 0 auto;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--hm-primary-soft);
            color: var(--hm-primary);
            font-size: 1.85rem;
        }
        .jp-http-error-code {
            font-size: clamp(3.4rem, 9vw, 5.25rem);
            line-height: 0.92;
            letter-spacing: -0.04em;
            color: var(--hm-primary);
            margin: 0.85rem 0 0.55rem;
            font-weight: 600;
        }
        .jp-http-error-title {
            font-size: 1.35rem;
            margin: 0 0 0.45rem;
        }
        .jp-http-error-lead {
            color: var(--jp-text-muted);
            font-size: 0.95rem;
            line-height: 1.55;
            margin: 0 auto 1.35rem;
            max-width: 26rem;
        }
        .jp-http-error-actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.65rem;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.35rem;
            min-height: 44px;
            padding: 0.5rem 1.15rem;
            border-radius: 6px;
            font-size: 1rem;
            text-decoration: none;
            cursor: pointer;
            border: 1.5px solid transparent;
        }
        .btn-hm {
            background: var(--hm-primary);
            border-color: var(--hm-primary);
            color: #fff;
        }
        .btn-hm:hover { background: var(--hm-primary-dark); }
        .btn-outline {
            background: #fff;
            border-color: #d4d4d4;
            color: #262626;
        }
        [data-theme="dark"] .btn-outline {
            background: transparent;
            border-color: #525252;
            color: #f5f5f5;
        }
    </style>
</head>
<body>
    <nav class="bar">
        <a href="/" class="d-flex">
            <img src="/static/images/logo/logo.png" alt="JustPlay">
        </a>
        <a href="/">Về trang chủ</a>
    </nav>
    <div class="jp-http-error">
        <div class="jp-http-error-card">
            <div class="jp-http-error-icon" aria-hidden="true">
                <i class="bi bi-cloud-slash"></i>
            </div>
            <p class="jp-http-error-code">502</p>
            <h1 class="jp-http-error-title">Không kết nối được máy chủ</h1>
            <p class="jp-http-error-lead">
                Portal đang khởi động lại hoặc mất kết nối tạm thời. Thử tải lại trang sau vài giây.
            </p>
            <div class="jp-http-error-actions">
                <a href="/" class="btn btn-hm"><i class="bi bi-house-door" aria-hidden="true"></i> Về trang chủ</a>
                <button type="button" class="btn btn-outline" onclick="location.reload()"><i class="bi bi-arrow-clockwise" aria-hidden="true"></i> Tải lại trang</button>
            </div>
        </div>
    </div>
</body>
</html>
