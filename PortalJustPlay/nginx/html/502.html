<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <script>
        (function () {
            try {
                if (localStorage.getItem('jp_theme') === 'dark') {
                    document.documentElement.setAttribute('data-theme', 'dark');
                }
            } catch (e) {}
        })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Đang tải - Just Play Portal</title>
    <meta name="theme-color" content="#dc2626">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/images/logo/favicon-32.png">
    <style>
        :root {
            --hm-primary: #dc2626;
            --jp-text-primary: #1e293b;
            --jp-panel-bg: #ffffff;
            --jp-track: #f1f5f9;
        }
        [data-theme="dark"] {
            --jp-text-primary: #f1f5f9;
            --jp-panel-bg: #1e293b;
            --jp-track: #334155;
        }
        * { box-sizing: border-box; }
        html, body {
            height: 100%;
            margin: 0;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #f8fafc;
            color: var(--jp-text-primary);
            overflow: hidden;
        }
        [data-theme="dark"] body { background: #111; }
        .jp-tool-loading {
            position: fixed;
            inset: 0;
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            background: rgba(15, 23, 42, 0.55);
            backdrop-filter: blur(4px);
        }
        .jp-tool-loading-panel {
            width: min(100%, 22rem);
            padding: 1.5rem 1.35rem;
            border-radius: 16px;
            background: var(--jp-panel-bg);
            box-shadow: 0 20px 50px rgba(15, 23, 42, 0.25);
            text-align: center;
        }
        [data-theme="dark"] .jp-tool-loading-panel {
            border: 1px solid #334155;
        }
        .jp-tool-loading-spinner {
            width: 2.5rem;
            height: 2.5rem;
            margin: 0 auto 1rem;
            border: 3px solid #fee2e2;
            border-top-color: var(--hm-primary);
            border-radius: 50%;
            animation: jp-tool-loading-spin 0.85s linear infinite;
        }
        @keyframes jp-tool-loading-spin {
            to { transform: rotate(360deg); }
        }
        .jp-tool-loading-msg {
            font-size: 0.92rem;
            font-weight: 400;
            margin: 0;
            color: var(--jp-text-primary);
        }
        .jp-tool-loading-progress {
            height: 0.55rem;
            margin: 0.75rem 0 0.35rem;
            border-radius: 999px;
            background: var(--jp-track);
            overflow: hidden;
        }
        .jp-tool-loading-bar {
            height: 100%;
            width: 1%;
            border-radius: 999px;
            background: var(--hm-primary);
        }
        .jp-tool-loading-pct {
            font-size: 0.82rem;
            font-weight: 400;
            color: var(--hm-primary);
            font-variant-numeric: tabular-nums;
            margin: 0;
        }
    </style>
</head>
<body>
    <div class="jp-tool-loading" role="status" aria-live="polite" aria-busy="true">
        <div class="jp-tool-loading-panel">
            <div class="jp-tool-loading-spinner" aria-hidden="true"></div>
            <p class="jp-tool-loading-msg">Đang tải dữ liệu…</p>
            <div class="jp-tool-loading-progress">
                <div id="jpLoadBar" class="jp-tool-loading-bar"></div>
            </div>
            <p id="jpLoadPct" class="jp-tool-loading-pct">1%</p>
        </div>
    </div>
    <script>
        (function () {
            var WAIT_MS = 2 * 60 * 1000;
            var START_PCT = 1;
            var END_PCT = 100;
            var bar = document.getElementById('jpLoadBar');
            var pct = document.getElementById('jpLoadPct');
            var start = Date.now();
            var done = false;

            function setPct(value) {
                var p = Math.max(START_PCT, Math.min(END_PCT, value));
                var shown = Math.round(p);
                if (bar) bar.style.width = shown + '%';
                if (pct) pct.textContent = shown + '%';
                return shown;
            }

            function reloadOnce() {
                try {
                    location.reload();
                } catch (e) {
                    location.href = location.href;
                }
            }

            function finish() {
                if (done) return;
                done = true;
                setPct(END_PCT);
                // Preview file 502.html: dừng ở 100%, không F5 vòng. Trên portal thật mới F5.
                if (/502\.html$/i.test(location.pathname)) return;
                setTimeout(reloadOnce, 400);
            }

            function tick() {
                var elapsed = Date.now() - start;
                var p = START_PCT + (elapsed / WAIT_MS) * (END_PCT - START_PCT);
                if (p >= END_PCT) {
                    finish();
                    return;
                }
                setPct(p);
                requestAnimationFrame(tick);
            }

            setPct(START_PCT);
            requestAnimationFrame(tick);
        })();
    </script>
</body>
</html>
