# Nén + cache tài nguyên tĩnh. Include vào trong khối server (như security-headers.conf).
#
# Lý do: trang danh sách của portal trả về HTML rất lớn (có trang tới 1.4 MB).
# Không nén thì người dùng phải tải trọn khối đó qua Internet, cảm giác chậm dù
# server đã trả lời nhanh. HTML/CSS/JS nén được khoảng 8–10 lần.

gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_disable "msie6";
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/x-javascript
    application/json
    application/xml
    application/xml+rss
    application/manifest+json
    image/svg+xml
    font/ttf
    font/otf
    application/vnd.ms-fontobject;
