upstream django_app {
    server web:8000;
}

server {
    listen 80;
    server_name portal.justplay.vn 103.90.224.203;

    client_max_body_size 20M;

    include /etc/nginx/conf.d/security-headers.conf;

    # Let's Encrypt (chạy scripts/setup-ssl.sh trên VPS)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect HTTP→HTTPS (ssl.conf đã bật). Giữ acme-challenge trên port 80 để gia hạn Let's Encrypt.
    location / {
        return 301 https://$host$request_uri;
    }
}
