upstream django_app {
    server web:8000;
    # Giữ sẵn kết nối tới gunicorn (dùng cùng proxy_http_version 1.1)
    keepalive 32;
}

server {
    listen 80;
    server_name portal.justplay.vn;

    client_max_body_size 0;

    include /etc/nginx/conf.d/security-headers.conf;
    include /etc/nginx/error-pages.conf;
    include /etc/nginx/scanner-block.conf;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Tạm: vào bằng IP qua HTTP khi DNS/HTTPS-IP bị FortiGate cắt.
server {
    listen 80;
    server_name 103.90.224.203 100.79.206.125;

    client_max_body_size 100M;

    include /etc/nginx/conf.d/security-headers.conf;
    include /etc/nginx/conf.d/performance.conf;
    include /etc/nginx/error-pages.conf;
    include /etc/nginx/scanner-block.conf;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://django_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Forwarded-Host $host;
        proxy_redirect off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    location /media/ {
        alias /app/media/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    # File riêng tư (VD: HTML mô hình 3D) — chỉ phục vụ qua view Django có kiểm tra quyền.
    location ^~ /media/_private/ {
        return 404;
    }
}
