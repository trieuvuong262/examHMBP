upstream django_app {
    server web:8000;
}

server {
    listen 80;
    server_name portal.justplay.vn 103.90.224.203;

    client_max_body_size 20M;

    include /etc/nginx/conf.d/security-headers.conf;

    # Let's Encrypt (chạy scripts/setup-ssl.sh trên VPS)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Khi đã bật ssl.conf (USE_HTTPS=1): bỏ comment 2 dòng return 301 bên dưới để redirect HTTP→HTTPS tại nginx
    # (tránh SECURE_SSL_REDIRECT trong Django — dễ gây ERR_TOO_MANY_REDIRECTS).
    # return 301 https://$host$request_uri;

    location / {
        proxy_pass http://django_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_redirect off;
    }

    location /static/ {
        alias /app/staticfiles/;
    }

    location /media/ {
        alias /app/media/;
    }
}
