<section class="guide-panel{% if is_active %} is-active{% endif %}" id="{{ section_id }}" data-guide-panel>
    <header class="guide-panel-header">
        <h2 class="guide-panel-title h5 mb-0">
            {{ title }}
        </h2>
    </header>
    <div class="guide-panel-body">
        <div class="guide-panel-inner">
        {% if has_inner %}
            {{ inner_html }}
        {% else %}
            <p class="text-muted small mb-0">Nội dung mục này đang được cập nhật.</p>
        {% endif %}
        </div>
    </div>
</section>
