{% load static %}
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <script>
        (function () {
            try {
                if (localStorage.getItem('jp_theme') === 'dark') {
                    document.documentElement.setAttribute('data-theme', 'dark');
                }
            } catch (e) {}
        })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Hệ thống đang gặp sự cố - Just Play Portal</title>
    <meta name="theme-color" content="#dc2626">
    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'images/logo/favicon-32.png' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{% static 'css/gotham.css' %}?v=20260811f">
    <link rel="stylesheet" href="{% static 'css/justplay-theme.css' %}?v=20260910a">
    <style>
        body.jp-http-error-standalone {
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(160deg, #f5f5f5 0%, #fff 45%, rgba(220, 38, 38, 0.08) 100%);
            color: #111;
        }
        [data-theme="dark"] body.jp-http-error-standalone {
            background: #111;
            color: #f5f5f5;
        }
        .jp-http-error-standalone-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.85rem 1.25rem;
            background: #dc2626;
            color: #fff;
        }
        .jp-http-error-standalone-bar img {
            height: 28px;
            width: auto;
        }
        .jp-http-error-standalone-bar a {
            color: #fff;
            text-decoration: none;
            font-size: 0.9rem;
        }
    </style>
</head>
<body class="jp-guest jp-http-error-standalone">
    <nav class="jp-http-error-standalone-bar">
        <a href="/" class="d-flex align-items-center gap-2">
            <img src="{% static 'images/logo/logo.png' %}" alt="JustPlay">
        </a>
        <a href="/">Về trang chủ</a>
    </nav>
    <div class="jp-http-error">
        <div class="jp-http-error-card">
            <div class="jp-http-error-icon" aria-hidden="true">
                <i class="bi bi-exclamation-triangle"></i>
            </div>
            <p class="jp-http-error-code">500</p>
            <h1 class="jp-http-error-title">Hệ thống đang gặp sự cố</h1>
            <p class="jp-http-error-lead">
                Portal tạm thời không phản hồi. Thử tải lại trang sau vài phút.
            </p>
            <div class="jp-http-error-actions">
                <a href="/" class="btn btn-hm">
                    <i class="bi bi-house-door" aria-hidden="true"></i>
                    Về trang chủ
                </a>
                <button type="button" class="btn btn-outline-secondary" onclick="location.reload()">
                    <i class="bi bi-arrow-clockwise" aria-hidden="true"></i>
                    Tải lại trang
                </button>
            </div>
        </div>
    </div>
</body>
</html>
