{% extends "base.html" %}

{% block content %}
<div class="container jp-page jp-hrm-page mt-3 mt-md-4 mb-5 px-2 px-md-3">
    <div class="row justify-content-center">
        <div class="col-12 col-lg-6">
            <div class="card shadow-lg border-0">
                <div class="card-body p-4 p-md-5 text-center">
                    <h4 class="fw-bold text-dark mb-3">Xóa vị trí?</h4>
                    <p class="text-muted mb-4">
                        <strong>{{ position.name }}</strong>
                        {% if position.division %} — {{ position.division.name }}{% endif %}
                    </p>
                    <form method="post" class="d-inline-flex gap-2 flex-wrap justify-content-center">
                        {% csrf_token %}
                        <a href="{% url 'org_structure' %}" class="btn btn-light fw-bold px-4">Hủy</a>
                        <button type="submit" class="btn btn-danger fw-bold px-4">Xóa</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
