{% extends "base.html" %}

{% block content %}
<div class="container jp-page mt-4 mt-md-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card border-danger shadow">
                <div class="card-header bg-danger text-white">
                    <h4 class="mb-0">Thu hồi chứng chỉ</h4>
                </div>
                <div class="card-body text-center">
                    <p class="lead mb-2">Thu hồi chứng chỉ <strong>{{ cert.code }}</strong>?</p>
                    <p class="text-muted">{{ cert.recipient_name }} — {{ cert.exam_title }}</p>
                    <form method="post">
                        {% csrf_token %}
                        <div class="d-flex justify-content-center gap-3 mt-4">
                            <a href="{% url 'admin_certificate_list' %}" class="btn btn-secondary px-4">Hủy</a>
                            <button type="submit" class="btn btn-danger px-4">Thu hồi</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
