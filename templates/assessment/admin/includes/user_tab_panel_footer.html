{# is_edit, can_update_user #}
{% if is_edit %}
<div class="jp-user-tab-panel-footer">
    {% if can_update_user %}
    <div class="jp-user-tab-panel-actions jp-user-form--view-only">
        <button type="button" class="btn btn-sm btn-outline-hm fw-bold jp-user-tab-edit-btn">
            <i class="bi bi-pencil me-1"></i>Sửa
        </button>
    </div>
    <div class="jp-user-tab-panel-actions jp-user-form--edit-only">
        <button type="button" class="btn btn-sm btn-light border fw-bold jp-user-tab-cancel-btn">
            <i class="bi bi-x-lg me-1"></i>Hủy
        </button>
        <button type="submit" class="btn btn-sm btn-hm fw-bold">
            <i class="bi bi-check-circle me-1"></i>Lưu thay đổi
        </button>
    </div>
    {% else %}
    <span class="badge bg-light text-muted border jp-user-form-view-badge">Chỉ xem — không có quyền sửa</span>
    {% endif %}
</div>
{% endif %}
