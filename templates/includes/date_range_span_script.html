{# Shared JS: khi đổi select[name=span] → chỉnh input from theo input to rồi submit form. #}
<script>
(function () {
  function pad2(n) { return String(n).padStart(2, '0'); }
  function fmtYmd(d) {
    return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
  }
  function fmtDmy(d) {
    return pad2(d.getDate()) + '/' + pad2(d.getMonth() + 1) + '/' + d.getFullYear();
  }
  function parseDateVal(val) {
    val = (val || '').trim();
    var iso = val.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
    if (iso) return new Date(+iso[1], +iso[2] - 1, +iso[3]);
    var vn = val.match(/^(\d{1,2})[/.-](\d{1,2})[/.-](\d{2,4})$/);
    if (vn) {
      var y = vn[3].length === 2 ? 2000 + +vn[3] : +vn[3];
      return new Date(y, +vn[2] - 1, +vn[1]);
    }
    return null;
  }
  function usesDmy(el) {
    if (!el) return false;
    if (el.type === 'date') return false;
    if (el._flatpickr) return false;
    var sample = (el.value || el.getAttribute('placeholder') || el.className || '');
    return sample.indexOf('/') !== -1 || (el.className || '').indexOf('jp-npl-date-input') !== -1;
  }
  function fmtForInput(el, d) {
    return usesDmy(el) ? fmtDmy(d) : fmtYmd(d);
  }
  function setInputDate(el, d, triggerChange) {
    var iso = fmtYmd(d);
    el.value = usesDmy(el) ? fmtDmy(d) : iso;
    if (el._flatpickr) el._flatpickr.setDate(iso, !!triggerChange);
  }
  function applySpanToFrom(form, spanDays) {
    if (!form || !spanDays) return;
    var toEl = form.querySelector('input[name="to"], input[name="date_to"], #teamRangeTo, #sc-to');
    var fromEl = form.querySelector('input[name="from"], input[name="date_from"], #teamRangeFrom, #sc-from');
    if (!toEl || !fromEl) return;
    var toDate = parseDateVal(toEl.value);
    if (!toDate) {
      toDate = new Date();
      setInputDate(toEl, toDate, false);
    }
    var fromDate = new Date(toDate.getFullYear(), toDate.getMonth(), toDate.getDate());
    fromDate.setDate(fromDate.getDate() - (spanDays - 1));
    setInputDate(fromEl, fromDate, true);
  }
  function bindSpan(form) {
    if (!form || form.dataset.jpSpanBound === '1') return;
    form.dataset.jpSpanBound = '1';
    var sel = form.querySelector('select[name="span"]');
    if (!sel) return;
    sel.addEventListener('change', function () {
      if (sel.value) applySpanToFrom(form, parseInt(sel.value, 10));
      if (typeof form.requestSubmit === 'function') form.requestSubmit();
      else form.submit();
    });
  }
  document.addEventListener('DOMContentLoaded', function () {
    document.querySelectorAll('form').forEach(bindSpan);
  });
  window.jpApplyDateRangeSpan = applySpanToFrom;
})();
</script>
