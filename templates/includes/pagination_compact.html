{% if page_obj.paginator.num_pages > 1 %}
<div class="d-flex justify-content-between align-items-center px-1 pt-2 mt-2 border-top jp-pagination-compact">
    {% if page_obj.has_previous %}
    <a class="btn btn-sm btn-light border x-small py-0 px-2" href="?{% if query_string %}{{ query_string }}&{% endif %}{{ page_param }}={{ page_obj.previous_page_number }}" title="Trang trước">‹</a>
    {% else %}
    <span class="btn btn-sm btn-light border x-small py-0 px-2 disabled text-muted">‹</span>
    {% endif %}
    <span class="x-small text-muted">{{ page_obj.number }}/{{ page_obj.paginator.num_pages }}</span>
    {% if page_obj.has_next %}
    <a class="btn btn-sm btn-light border x-small py-0 px-2" href="?{% if query_string %}{{ query_string }}&{% endif %}{{ page_param }}={{ page_obj.next_page_number }}" title="Trang sau">›</a>
    {% else %}
    <span class="btn btn-sm btn-light border x-small py-0 px-2 disabled text-muted">›</span>
    {% endif %}
</div>
{% endif %}
