{% if messages %}
<div class="container-fluid px-3 px-lg-4 mt-3 jp-flash-messages" data-jp-flash-root>
    {% for message in messages %}
    <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %} alert-dismissible fade show border-0 shadow-sm jp-flash-alert"
         role="alert"
         data-jp-flash-ms="3000">
        {{ message }}
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Đóng"></button>
    </div>
    {% endfor %}
</div>
{% endif %}
