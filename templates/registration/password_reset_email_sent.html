{% extends "base.html" %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-4">
            <div class="card jp-auth-card">
                <div class="jp-auth-header">
                    <h3 class="fw-bold mb-1">KIỂM TRA EMAIL</h3>
                    <p class="small opacity-75 mb-0">Đã gửi hướng dẫn đặt lại mật khẩu</p>
                </div>

                <div class="card-body p-4 p-md-5 text-center">
                    <p class="small text-muted mb-4">
                        Mở hộp thư và bấm liên kết trong email để đặt mật khẩu mới.
                        Nếu không thấy, kiểm tra thư mục <strong>Spam / Quảng cáo</strong>.
                    </p>
                    <a href="{% url 'login' %}" class="btn btn-hm w-100 shadow-sm fw-bold">
                        Về đăng nhập
                    </a>
                    <div class="mt-3">
                        <a href="{% url 'password_reset_request' %}" class="small text-muted text-decoration-none">Gửi lại yêu cầu</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
