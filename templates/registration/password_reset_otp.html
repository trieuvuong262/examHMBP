{% extends "base.html" %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-4">
            <div class="card jp-auth-card">
                <div class="jp-auth-header">
                    <h3 class="fw-bold mb-1">NHẬP MÃ OTP</h3>
                    <p class="small opacity-75 mb-0">
                        {% if phone_masked %}Đã gửi tới Zalo {{ phone_masked }}{% else %}Kiểm tra tin nhắn Zalo{% endif %}
                    </p>
                </div>

                <div class="card-body p-4 p-md-5">
                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-4">
                            <label class="form-label small fw-bold text-jp-dark text-uppercase">Mã OTP</label>
                            <input type="text"
                                   name="otp"
                                   class="form-control text-center fw-bold letter-spacing"
                                   inputmode="numeric"
                                   pattern="[0-9]*"
                                   maxlength="8"
                                   placeholder="••••••"
                                   required
                                   autofocus
                                   autocomplete="one-time-code">
                            {% if attempts_left %}
                            <div class="form-text small text-muted mt-2 text-center">Còn {{ attempts_left }} lần thử</div>
                            {% endif %}
                        </div>
                        <button type="submit" class="btn btn-hm w-100 shadow-sm fw-bold">
                            Xác nhận
                        </button>
                    </form>

                    <div class="text-center mt-4 d-flex flex-column gap-2">
                        <a href="{% url 'password_reset_request' %}" class="small text-muted text-decoration-none">Gửi lại OTP</a>
                        <a href="{% url 'login' %}" class="small text-muted text-decoration-none">← Quay lại đăng nhập</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
