{% extends "base.html" %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-4">
            <div class="card jp-auth-card">
                <div class="jp-auth-header">
                    <i class="bi bi-person-badge-fill"></i>
                    <h3 class="fw-bold mb-1">JUSTPLAY PORTAL</h3>
                    <p class="small opacity-75 mb-0">Vui lòng đăng nhập để tiếp tục</p>
                </div>

                <div class="card-body p-4 p-md-5">
                    {% if form.errors %}
                        <div class="alert alert-danger border-0 small py-2 px-3 mb-4 text-center">
                            <i class="bi bi-exclamation-circle-fill me-1"></i> Sai tài khoản hoặc mật khẩu!
                        </div>
                    {% endif %}

                    <form method="post">
                        {% csrf_token %}

                        <div class="mb-4">
                            <label class="form-label small fw-bold text-jp-dark text-uppercase">Tên đăng nhập</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-person-fill"></i></span>
                                <input type="text" name="username" class="form-control" placeholder="Mã nhân viên" required autofocus>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label small fw-bold text-jp-dark text-uppercase">Mật khẩu</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-key-fill"></i></span>
                                <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-hm w-100 shadow-sm fw-bold">
                            Đăng nhập <i class="bi bi-box-arrow-in-right ms-1"></i>
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
