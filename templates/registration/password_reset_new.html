{% extends "base.html" %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-4">
            <div class="card jp-auth-card">
                <div class="jp-auth-header">
                    <h3 class="fw-bold mb-1">MẬT KHẨU MỚI</h3>
                    <p class="small opacity-75 mb-0">Tối thiểu 6 ký tự, không chỉ toàn số</p>
                </div>

                <div class="card-body p-4 p-md-5">
                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-4">
                            <label class="form-label small fw-bold text-jp-dark text-uppercase">Mật khẩu mới</label>
                            <input type="password"
                                   name="password1"
                                   class="form-control"
                                   placeholder="••••••••"
                                   required
                                   autofocus
                                   autocomplete="new-password">
                        </div>
                        <div class="mb-4">
                            <label class="form-label small fw-bold text-jp-dark text-uppercase">Nhập lại mật khẩu</label>
                            <input type="password"
                                   name="password2"
                                   class="form-control"
                                   placeholder="••••••••"
                                   required
                                   autocomplete="new-password">
                        </div>
                        <button type="submit" class="btn btn-hm w-100 shadow-sm fw-bold">
                            Lưu mật khẩu
                        </button>
                    </form>

                    <div class="text-center mt-4">
                        <a href="{% url 'login' %}" class="small text-muted text-decoration-none">← Quay lại đăng nhập</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
