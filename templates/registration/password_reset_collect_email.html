{% extends "base.html" %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-4">
            <div class="card jp-auth-card">
                <div class="jp-auth-header">
                    <h3 class="fw-bold mb-1">NHẬP EMAIL</h3>
                    <p class="small opacity-75 mb-0">Email sẽ được lưu vào hồ sơ nhân viên</p>
                </div>

                <div class="card-body p-4 p-md-5">
                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-4">
                            <label class="form-label small fw-bold text-jp-dark text-uppercase">Địa chỉ email</label>
                            <input type="email"
                                   name="email"
                                   class="form-control"
                                   value="{{ email }}"
                                   placeholder="tenban@gmail.com"
                                   required
                                   autofocus
                                   autocomplete="email">
                            <div class="form-text small mt-2">
                                Dùng email cá nhân đang dùng được — hệ thống gửi link đặt lại mật khẩu tới đây.
                            </div>
                        </div>
                        <button type="submit" class="btn btn-hm w-100 shadow-sm fw-bold">
                            Lưu email &amp; gửi link
                        </button>
                    </form>

                    <div class="text-center mt-4">
                        <a href="{% url 'password_reset_request' %}" class="small text-muted text-decoration-none">← Quay lại</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
