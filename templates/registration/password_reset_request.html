{% extends "base.html" %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-4">
            <div class="card jp-auth-card">
                <div class="jp-auth-header">
                    <h3 class="fw-bold mb-1">QUÊN MẬT KHẨU</h3>
                    <p class="small opacity-75 mb-0">Chọn cách nhận hướng dẫn đặt lại</p>
                </div>

                <div class="card-body p-4 p-md-5">
                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-4">
                            <label class="form-label small fw-bold text-jp-dark text-uppercase">Tên đăng nhập hoặc mã NS</label>
                            <input type="text"
                                   name="identifier"
                                   class="form-control"
                                   value="{{ identifier }}"
                                   placeholder="vd: nam.nt hoặc NV001"
                                   required
                                   autofocus
                                   autocomplete="username">
                        </div>

                        <div class="mb-4">
                            <span class="form-label small fw-bold text-jp-dark text-uppercase d-block mb-2">Gửi qua</span>
                            <div class="d-grid gap-2">
                                <label class="border rounded-3 p-3 mb-0 {% if channel == 'email' %}border-danger{% endif %}" style="cursor:pointer;">
                                    <input type="radio" name="channel" value="email" class="form-check-input me-2"
                                           {% if channel != 'zalo' %}checked{% endif %}>
                                    <span class="fw-semibold">Email</span>
                                    <span class="d-block small text-muted mt-1 ms-4">Nhận link đặt lại mật khẩu qua email</span>
                                </label>
                                <label class="border rounded-3 p-3 mb-0 text-muted" style="cursor:pointer; opacity:0.85;">
                                    <input type="radio" name="channel" value="zalo" class="form-check-input me-2"
                                           {% if channel == 'zalo' %}checked{% endif %}>
                                    <span class="fw-semibold">Zalo</span>
                                    <span class="badge bg-warning-subtle text-warning-emphasis ms-1">Bảo trì</span>
                                    <span class="d-block small mt-1 ms-4">Tạm thời chưa dùng được — vui lòng chọn Email</span>
                                </label>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-hm w-100 shadow-sm fw-bold">
                            Tiếp tục
                        </button>
                    </form>

                    <div class="text-center mt-4">
                        <a href="{% url 'login' %}" class="small text-muted text-decoration-none">← Quay lại đăng nhập</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
