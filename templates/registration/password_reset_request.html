{% extends "base.html" %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-4">
            <div class="card jp-auth-card">
                <div class="jp-auth-header">
                    <h3 class="fw-bold mb-1">QUÊN MẬT KHẨU</h3>
                    <p class="small opacity-75 mb-0">Nhận mã OTP qua Zalo cá nhân</p>
                </div>

                <div class="card-body p-4 p-md-5">
                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-4">
                            <label class="form-label small fw-bold text-jp-dark text-uppercase">Tên đăng nhập hoặc mã NS</label>
                            <input type="text"
                                   name="identifier"
                                   class="form-control"
                                   value="{{ identifier }}"
                                   placeholder="vd: nam.nt hoặc NV001"
                                   required
                                   autofocus
                                   autocomplete="username">
                        </div>
                        <button type="submit" class="btn btn-hm w-100 shadow-sm fw-bold">
                            Gửi OTP qua Zalo
                        </button>
                    </form>

                    <div class="text-center mt-4">
                        <a href="{% url 'login' %}" class="small text-muted text-decoration-none">← Quay lại đăng nhập</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
