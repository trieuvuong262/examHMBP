{% extends "base.html" %}

{% block content %}
<style>
    :root {
        --hm-primary: #dc2626;
        --hm-primary-hover: #b91c1c;
    }

    body {
        background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
        min-height: 100vh;
    }

    .change-password-container {
        margin-top: 8vh;
        margin-bottom: 5vh;
    }

    .card-custom {
        border: none;
        border-radius: 20px;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
        overflow: hidden;
        background: white;
    }

    .card-header-hm {
        background-color: #16a34a;
        padding: 2rem 1rem;
        color: white;
        text-align: center;
        border: none;
    }

    .card-header-hm i {
        font-size: 3rem;
        display: block;
        margin-bottom: 0.5rem;
    }
</style>

<div class="container change-password-container jp-page">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-5">
            <div class="card card-custom text-center">
                <div class="card-header-hm">
                    <i class="bi bi-check-circle-fill"></i>
                    <h4 class="fw-bold mb-0">ĐỔI MẬT KHẨU THÀNH CÔNG</h4>
                </div>
                <div class="card-body p-4 p-md-5">
                    <p class="text-muted mb-4">
                        Mật khẩu của bạn đã được cập nhật. Vui lòng dùng mật khẩu mới cho các lần đăng nhập sau.
                    </p>
                    <div class="d-grid gap-2">
                        <a href="{% url 'home_portal' %}" class="btn btn-hm rounded-pill py-3 fw-bold">
                            <i class="bi bi-house-fill me-2"></i>Về trang chủ
                        </a>
                        <a href="{% url 'password_change' %}" class="btn btn-outline-secondary rounded-pill py-2">
                            Đổi mật khẩu lại
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
