{% extends "base.html" %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-5">
            <div class="card jp-auth-card text-center">
                <div class="jp-auth-header" style="background: linear-gradient(135deg, #166534 0%, var(--hm-primary-dark) 100%);">
                    
                    <h4 class="fw-bold mb-0">ĐỔI MẬT KHẨU THÀNH CÔNG</h4>
                </div>
                <div class="card-body p-4 p-md-5">
                    <p class="text-muted mb-4">
                        Mật khẩu của bạn đã được cập nhật. Vui lòng dùng mật khẩu mới cho các lần đăng nhập sau.
                    </p>
                    <div class="d-grid gap-2">
                        <a href="{% url 'home_portal' %}" class="btn btn-hm py-3 fw-bold">
                            <i class="bi bi-house-fill me-2"></i>Về trang chủ
                        </a>
                        <a href="{% url 'password_change' %}" class="btn btn-outline-dark py-2">
                            Đổi mật khẩu lại
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
