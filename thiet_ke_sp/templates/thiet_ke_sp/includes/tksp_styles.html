<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tom-select@2.4.1/dist/css/tom-select.bootstrap5.min.css">
<style>

  --tk-navy2: #173b63;

  --tk-green: #15803d;
  --tk-amber: #b45309;
  --tk-blue: #1d4ed8;

}

/* Thẻ, tiêu đề khối */

.jp-tksp .tk-panel { padding: 1rem 1.1rem; }

.jp-tksp .tk-panel-title { font-size: .95rem; font-weight: 800; }
.jp-tksp .tk-panel-sub { font-size: .75rem; color: var(--tk-muted); }
.jp-tksp .tk-link { font-weight: 700; font-size: .82rem; color: var(--tk-accent); text-decoration: none; white-space: nowrap; }
.jp-tksp .tk-link:hover { text-decoration: underline; }

/* KPI */
.jp-tksp .tk-kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: .9rem; }
.jp-tksp .tk-kpi { background: var(--tk-surface); border: 1px solid var(--tk-line); border-radius: var(--tk-radius); padding: 1rem 1.1rem; display: flex; align-items: flex-start; gap: .75rem; text-decoration: none; color: inherit; }

.jp-tksp .tk-kpi .sub { font-size: .72rem; font-weight: 700; color: var(--tk-muted); }
.jp-tksp .tk-kpi .sub.is-ok { color: var(--tk-green); }
.jp-tksp .tk-kpi .sub.is-warn { color: var(--tk-amber); }
.jp-tksp .tk-kpi .sub.is-bad { color: var(--tk-red); }
.jp-tksp .tk-kpi .ico { margin-left: auto; width: 2.5rem; height: 2.5rem; border-radius: var(--tk-radius); display: grid; place-items: center; background: var(--tk-accent-soft); color: var(--tk-accent); font-size: 1.1rem; flex-shrink: 0; }

/* Nhãn trạng thái */
.jp-tksp .tk-pill { display: inline-flex; align-items: center; gap: .3rem; padding: .28rem .55rem; border-radius: 999px; font-size: .72rem; font-weight: 750; white-space: nowrap; line-height: 1.1; }
.jp-tksp .tk-pill.is-blue { background: rgba(29, 78, 216, .1); color: var(--tk-blue); }
.jp-tksp .tk-pill.is-green { background: rgba(21, 128, 61, .1); color: var(--tk-green); }
.jp-tksp .tk-pill.is-amber { background: rgba(180, 83, 9, .12); color: var(--tk-amber); }
.jp-tksp .tk-pill.is-red { background: rgba(185, 28, 28, .1); color: var(--tk-red); }
.jp-tksp .tk-pill.is-purple { background: rgba(109, 40, 217, .1); color: var(--tk-purple); }
.jp-tksp .tk-pill.is-gray { background: rgba(100, 116, 139, .14); color: #475569; }
.jp-tksp .tk-pill.is-dark { background: #262626; color: #fff; }

/* Ô sản phẩm trong bảng */

.jp-tksp .tk-prod-thumb { width: 42px; height: 48px; border-radius: 6px; flex-shrink: 0; overflow: hidden; display: grid; place-items: center; background: var(--tk-dark); color: rgba(255, 255, 255, .7); font-size: 1rem; }

.jp-tksp .tk-progress.is-wide { width: 100%; }

.jp-tksp .tk-progress.is-red i { background: var(--tk-red); }

.jp-tksp .tk-steps { display: flex; align-items: center; gap: 0; margin: 0; padding: 0; list-style: none; }
.jp-tksp .tk-steps li { position: relative; display: flex; align-items: center; }

.jp-tksp .tk-steps li.is-done + li.is-current::before,
.jp-tksp .tk-steps li.is-done + li.is-closed::before { background: #10b981; }
.jp-tksp .tk-steps .dot {

}
.jp-tksp .tk-steps li.is-done .dot { background: #10b981; border-color: #10b981; }
.jp-tksp .tk-steps li.is-current .dot { border-color: #2563eb; background: #2563eb; box-shadow: 0 0 0 3px #dbeafe; }

.jp-tksp .tk-steps li.is-closed .dot::after {
  content: '×'; position: absolute; inset: -.28rem 0 0; color: #fff; font-size: .62rem; font-weight: 700; text-align: center; line-height: .7rem;
}
.jp-tksp .tk-stage {
  display: inline-flex; align-items: center; gap: .25rem; padding: .15rem .5rem; border-radius: 999px;
  font-size: .72rem; font-weight: 600; line-height: 1.4; border: 1px solid transparent; white-space: nowrap;
}
.jp-tksp .tk-stage.is-gray { background: #f1f5f9; color: #334155; border-color: #e2e8f0; }
.jp-tksp .tk-stage.is-blue { background: #eff6ff; color: #1d4ed8; border-color: #bfdbfe; }
.jp-tksp .tk-stage.is-amber { background: #fffbeb; color: #a16207; border-color: #fde68a; }
.jp-tksp .tk-stage.is-green { background: #ecfdf5; color: #047857; border-color: #a7f3d0; }
.jp-tksp .tk-stage.is-red { background: #fef2f2; color: #b91c1c; border-color: #fecaca; }
.jp-tksp .tk-stage.is-purple { background: #f5f3ff; color: #6d28d9; border-color: #ddd6fe; }
.jp-tksp .tk-stage.is-dark { background: #f8fafc; color: #64748b; border-color: #e2e8f0; }
.jp-tksp .tk-late { color: var(--tk-red); font-weight: 800; }

/* Bộ lọc dạng thanh công cụ */
.jp-tksp .tk-toolbar { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; }
.jp-tksp .tk-toolbar.is-nowrap { flex-wrap: nowrap; }
.jp-tksp .tk-toolbar .form-control, .jp-tksp .tk-toolbar .form-select { width: auto; min-width: 150px; }
.jp-tksp .tk-toolbar .tk-search { min-width: 260px; flex: 1 1 260px; max-width: 360px; }
.jp-tksp .tk-toolbar .tk-count { margin-left: auto; color: var(--tk-muted); font-size: .8rem; font-weight: 700; white-space: nowrap; }

.jp-sx-module .jp-tksp .tk-tabs-head .jp-portal-pills .nav-link {

  align-items: center;
  justify-content: center;

  padding: 0.5rem 1.25rem !important;

  box-shadow: none !important;
  transform: none;
}
.jp-tksp .tk-detail-tools .btn:hover,
.jp-sx-module .jp-tksp .tk-tabs-head .jp-portal-pills .nav-link:hover {
  color: var(--hm-primary) !important;

}
.jp-tksp .tk-detail-tools .btn-hm,
.jp-tksp .tk-detail-tools .btn-hm:hover,
.jp-tksp .tk-detail-tools .btn-hm:focus,
.jp-sx-module .jp-tksp .tk-tabs-head .jp-portal-pills .nav-link.active,

  border-color: var(--hm-primary) !important;
  color: #fff !important;
}
.jp-tksp .tk-sheet { background: var(--tk-surface); border: 1px solid var(--tk-line); border-radius: var(--tk-radius); overflow: hidden; }

/* Thanh 8 bước */

.jp-tksp .tk-step { min-width: 110px; flex: 1; position: relative; text-align: center; color: #94a3b8; font-size: .74rem; font-weight: 600; padding-top: 2rem; }
.jp-tksp .tk-step::before { content: ""; position: absolute; top: .7rem; left: 0; right: 0; height: 3px; background: var(--tk-line); }
.jp-tksp .tk-step:first-child::before { left: 50%; }
.jp-tksp .tk-step:last-child::before { right: 50%; }
.jp-tksp .tk-step i { position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 1.45rem; height: 1.45rem; border-radius: 50%; background: var(--tk-line); color: #64748b; display: grid; place-items: center; font-style: normal; font-weight: 900; font-size: .72rem; z-index: 1; }
.jp-tksp .tk-step.done { color: var(--tk-green); font-weight: 700; }
.jp-tksp .tk-step.done::before { background: #61c99f; }
.jp-tksp .tk-step.done i { background: var(--tk-green); color: #fff; }
.jp-tksp .tk-step.current { color: var(--tk-accent); font-weight: 850; }
.jp-tksp .tk-step.current i { background: var(--tk-accent); color: #fff; box-shadow: 0 0 0 4px var(--tk-accent-soft); }

/* Bố cục chi tiết: tab + cột phải */
.jp-tksp .tk-detail-layout { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 1rem; align-items: start; }
.jp-tksp .tk-tabs-head { padding: .75rem .9rem 0; border-bottom: 1px solid var(--tk-line); }
.jp-tksp .tk-tabs-head .jp-portal-pills { margin-bottom: .75rem; }
.jp-tksp .tk-tab-body { padding: 1.2rem; }
.jp-tksp .tk-tab-body > .tk-section, .jp-tksp .tk-tab-body > .row > [class*="col"] > .tk-section { border: 0; border-radius: 0; padding: 0; background: transparent; }
.jp-tksp .tk-tab-body > .tk-section + .tk-section, .jp-tksp .tk-tab-body > .tk-kpis + .tk-section, .jp-tksp .tk-tab-body > .tk-cost-summary + .tk-section { border-top: 1px solid var(--tk-line); margin-top: 1.25rem; padding-top: 1.25rem; }
.jp-tksp .tk-tab-body > .row > [class*="col"] > .tk-section + .tk-section { border-top: 1px solid var(--tk-line); margin-top: 1.25rem; padding-top: 1.25rem; }

.jp-tksp .jp-sx-tools .btn {

  gap: .3rem;

}

.jp-tksp .tk-section-sub { font-size: .74rem; color: var(--tk-muted); font-weight: 600; }

.jp-tksp .tk-grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0 1.25rem; }
.jp-tksp .tk-sub { font-size: .82rem; font-weight: 850; margin: 0 0 .4rem; }

.jp-tksp .tk-callout.is-warn { background: rgba(180, 83, 9, .08); border-color: var(--tk-amber); }
.jp-tksp .tk-callout.is-danger { background: rgba(185, 28, 28, .07); border-color: var(--tk-red); }
.jp-tksp .tk-callout.is-ok { background: rgba(21, 128, 61, .07); border-color: var(--tk-green); }
.jp-tksp .tk-callout.is-muted { background: var(--tk-surface-2); border-color: #94a3b8; }
.jp-tksp .tk-ok { color: var(--tk-green); font-weight: 800; }
.jp-tksp .tk-miss { color: var(--tk-amber); font-weight: 800; }

/* Bảng nhỏ */

.jp-tksp .tk-version-preview { height: 62px; border-radius: 6px; overflow: hidden; display: grid; place-items: center; background: var(--tk-dark); color: rgba(255, 255, 255, .6); font-size: 1.3rem; }
.jp-tksp .tk-version-preview img { width: 100%; height: 100%; object-fit: cover; }
.jp-tksp .tk-version-preview .tk-thumb-zoom,
.jp-tksp .tk-sheet-thumb .tk-thumb-zoom,
.jp-tksp .tk-option-thumb.tk-thumb-zoom { height: 100%; }
.jp-tksp .tk-sheet-thumb .tk-thumb-zoom img,
.jp-tksp .tk-option-thumb.tk-thumb-zoom img { width: 100%; height: 100%; object-fit: cover; }
.jp-tksp .tk-version b { font-size: .86rem; }
.jp-tksp .tk-version p { margin: .1rem 0; font-size: .78rem; color: var(--tk-muted); }
.jp-tksp .tk-version small { font-size: .72rem; color: var(--tk-muted); }
.jp-tksp .tk-version-pill { display: inline-flex; align-items: center; gap: .35rem; font-weight: 850; }

/* Chọn phương án thiết kế (modal nằm ngoài .jp-tksp) */
.tk-option-picks { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: .5rem; }
.tk-option-pick { display: flex; flex-direction: column; align-items: center; gap: .35rem; padding: .5rem; border: 1px solid #e2e8f0; border-radius: 8px; cursor: pointer; margin: 0; }
.tk-option-pick:has(input:checked) { border-color: #dc2626; background: rgba(220, 38, 38, .06); }
.tk-option-pick .form-check-input { margin: 0; align-self: flex-start; }
.tk-option-thumb { width: 100%; height: 110px; border-radius: 6px; overflow: hidden; display: grid; place-items: center; background: #0f172a; color: rgba(255, 255, 255, .6); font-size: 1.4rem; }
.tk-option-thumb img { width: 100%; height: 100%; object-fit: cover; }
.tk-option-thumb.is-lg { display: block; height: 220px; }
.tk-option-thumb.is-lg img { object-fit: contain; background: #0f172a; }
[data-theme="dark"] .tk-option-pick { border-color: rgba(148, 163, 184, .3); }

/* Giá thành */
.jp-tksp .tk-cost-summary { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: .6rem; }
.jp-tksp .tk-costbox { padding: .8rem .9rem; border-radius: var(--tk-radius); background: var(--tk-surface-2); border: 1px solid var(--tk-line); }
.jp-tksp .tk-costbox small { color: var(--tk-muted); font-size: .74rem; font-weight: 600; }
.jp-tksp .tk-costbox b { display: block; font-size: 1.2rem; font-weight: 850; }
.jp-tksp .tk-costbox .pct { font-size: .74rem; font-weight: 700; }

/* Nhật ký */
.jp-tksp .tk-timeline { list-style: none; position: relative; padding: 0 0 0 1.45rem; margin: 0; }
.jp-tksp .tk-timeline::before { content: ""; position: absolute; left: .45rem; top: .4rem; bottom: .5rem; width: 2px; background: var(--tk-line); }
.jp-tksp .tk-timeline li { position: relative; margin: 0 0 1rem; font-size: .84rem; }
.jp-tksp .tk-timeline li::before { content: ""; position: absolute; left: -1.3rem; top: .28rem; width: .65rem; height: .65rem; border-radius: 50%; background: #94a3b8; border: 3px solid var(--tk-surface); box-shadow: 0 0 0 1px var(--tk-line); }
.jp-tksp .tk-timeline li.is-status::before { background: var(--tk-accent); }
.jp-tksp .tk-timeline strong { font-size: .84rem; }
.jp-tksp .tk-timeline .t { color: var(--tk-muted); font-size: .72rem; }

/* Trao đổi */
.jp-tksp .tk-comment { border: 1px solid var(--tk-line); border-radius: var(--tk-radius); padding: .6rem .75rem; font-size: .86rem; }
.jp-tksp .tk-comment + .tk-comment { margin-top: .5rem; }
.jp-tksp .tk-comment.is-revision { border-color: rgba(185, 28, 28, .35); background: rgba(185, 28, 28, .05); }
.jp-tksp .tk-comment-item { display: flex; align-items: flex-start; gap: .5rem; padding: .5rem .55rem; }
.jp-tksp .tk-comment-item .tk-avatar { width: 28px; height: 28px; font-size: .68rem; }
.jp-tksp .tk-comment-meta { display: flex; flex-wrap: wrap; gap: .15rem .4rem; align-items: baseline; margin-bottom: .1rem; }
.jp-tksp .tk-comment-meta strong { font-size: .78rem; }
.jp-tksp .tk-comment-meta span { color: var(--tk-muted); font-size: .68rem; }
.jp-tksp .tk-comments-card .accordion-item { background: transparent; border: 0; border-bottom: 1px solid var(--tk-line); }
.jp-tksp .tk-comments-card .accordion-header { margin: 0; }
.jp-tksp .tk-comments-card .accordion-item:last-child { border-bottom: 0; }
.jp-tksp .tk-comments-card .accordion-button { background: transparent; color: inherit; box-shadow: none; gap: .35rem; font-size: .78rem; font-weight: 750; padding: .55rem 0; }
.jp-tksp .tk-comments-card .accordion-button:not(.collapsed) { background: transparent; color: var(--tk-accent); box-shadow: none; }
.jp-tksp .tk-comments-card .accordion-button:focus { box-shadow: none; }
.jp-tksp .tk-comments-card .accordion-button::after { width: .75rem; height: .75rem; background-size: .75rem; margin-left: .35rem; }
.jp-tksp .tk-comments-card .tk-cmt-locked { color: var(--tk-muted); cursor: default; pointer-events: none; }
.jp-tksp .tk-comments-card .tk-cmt-locked::after { display: none; }
.jp-tksp .tk-comments-card .accordion-body { padding: 0 0 .7rem; }
.jp-tksp .tk-cmt-step { min-width: 0; }
.jp-tksp .tk-cmt-marks { margin-left: auto; display: inline-flex; gap: .25rem; align-items: center; }
.jp-tksp .tk-cmt-list { max-height: 280px; overflow: auto; }

/* Cột phải */
.jp-tksp .tk-side-card { padding: 1rem; }
.jp-tksp .tk-side-card + .tk-side-card { margin-top: .85rem; }
.jp-tksp .tk-side-card h3 { font-size: .84rem; font-weight: 850; margin: 0 0 .7rem; display: flex; align-items: center; justify-content: space-between; gap: .5rem; }
.jp-tksp .tk-owner { display: flex; align-items: center; gap: .6rem; margin: .55rem 0; }
.jp-tksp .tk-avatar { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 800; font-size: .74rem; flex-shrink: 0; }
.jp-tksp img.tk-avatar { display: block; object-fit: cover; }
.jp-tksp .tk-avatar.is-empty { background: var(--tk-line) !important; color: var(--tk-muted); }
.jp-tksp .tk-owner strong { font-size: .8rem; display: block; line-height: 1.2; }
.jp-tksp .tk-owner small { color: var(--tk-muted); font-size: .7rem; }
.jp-tksp .tk-due { background: var(--tk-surface-2); border: 1px solid var(--tk-line); border-radius: var(--tk-radius); padding: .7rem .8rem; }
.jp-tksp .tk-due strong { font-size: .92rem; display: block; }
.jp-tksp .tk-due span { font-size: .74rem; }
.jp-tksp .tk-due.is-late { background: rgba(185, 28, 28, .07); border-color: rgba(185, 28, 28, .3); color: var(--tk-red); }
.jp-tksp .tk-due.is-soon { background: rgba(180, 83, 9, .08); border-color: rgba(180, 83, 9, .3); color: var(--tk-amber); }
.jp-tksp .tk-rule-list { padding: 0; margin: 0; list-style: none; }
.jp-tksp .tk-rule-list li { padding: .45rem 0; border-bottom: 1px solid var(--tk-line); font-size: .8rem; display: flex; gap: .45rem; }
.jp-tksp .tk-rule-list li:last-child { border-bottom: 0; }
.jp-tksp .tk-rule-list li i { flex-shrink: 0; margin-top: .1rem; }
.jp-tksp .tk-task { border: 1px solid var(--tk-line); border-radius: var(--tk-radius); padding: .5rem .6rem; font-size: .8rem; }
.jp-tksp .tk-task + .tk-task { margin-top: .45rem; }
.jp-tksp .tk-task.is-late { border-color: rgba(185, 28, 28, .3); background: rgba(185, 28, 28, .05); }

/* Tổng quan */
.jp-tksp .tk-dash-grid { display: grid; grid-template-columns: 1.35fr .85fr; gap: 1rem; }
.jp-tksp .tk-pipeline { display: grid; grid-template-columns: repeat(6, minmax(52px, 1fr)); gap: .6rem; align-items: end; height: 190px; }
.jp-tksp .tk-barwrap { height: 160px; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: .4rem; text-decoration: none; color: inherit; }
.jp-tksp .tk-bar { width: 52%; min-width: 26px; border-radius: 6px 6px 3px 3px; background: var(--tk-dark); position: relative; transition: background .2s; }
.jp-tksp .tk-barwrap:hover .tk-bar, .jp-tksp .tk-bar.is-peak { background: linear-gradient(180deg, #ef4444, var(--tk-accent)); }
.jp-tksp .tk-bar span { position: absolute; top: -1.35rem; left: 0; right: 0; text-align: center; font-weight: 800; font-size: .85rem; }
.jp-tksp .tk-barlabel { text-align: center; font-size: .7rem; color: var(--tk-muted); line-height: 1.2; font-weight: 600; }
.jp-tksp .tk-alert-list { display: grid; gap: .55rem; }
.jp-tksp .tk-alert { border: 1px solid var(--tk-line); border-radius: var(--tk-radius); padding: .65rem .75rem; display: flex; gap: .6rem; text-decoration: none; color: inherit; }
.jp-tksp a.tk-alert:hover { border-color: var(--tk-accent); color: inherit; }
.jp-tksp .tk-alert strong { display: block; font-size: .8rem; }
.jp-tksp .tk-alert p { margin: .1rem 0 0; color: var(--tk-muted); font-size: .74rem; }
.jp-tksp .tk-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--tk-red); margin-top: .35rem; flex: none; }
.jp-tksp .tk-dot.is-amber { background: var(--tk-amber); }
.jp-tksp .tk-dot.is-blue { background: var(--tk-blue); }
.jp-tksp .tk-meter-row { display: grid; grid-template-columns: minmax(110px, 40%) 1fr 34px; gap: .5rem; align-items: center; margin: .45rem 0; font-size: .78rem; text-decoration: none; color: inherit; }
.jp-tksp .tk-meter { height: 7px; background: var(--tk-line); border-radius: 10px; overflow: hidden; }
.jp-tksp .tk-meter i { display: block; height: 100%; background: var(--tk-accent); }
.jp-tksp .tk-meter.is-green i { background: var(--tk-green); }
.jp-tksp .tk-meter.is-gray i { background: #94a3b8; }
.jp-tksp td > .tk-meter-row { grid-template-columns: minmax(60px, 1fr) 34px; min-width: 140px; }

.jp-tksp .tk-task-row.is-late { background: rgba(185, 28, 28, .05); }
.jp-tksp .ts-wrapper.form-select { padding: 0; }

/* Kanban */
.jp-tksp .tk-kanban { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(260px, 1fr); gap: .8rem; overflow-x: auto; padding-bottom: .5rem; align-items: start; }
.jp-tksp .tk-kan-col { background: var(--tk-surface-2); border: 1px solid var(--tk-line); border-radius: var(--tk-radius); padding: .7rem; min-height: 180px; }
.jp-tksp .tk-kan-head { display: flex; align-items: center; justify-content: space-between; gap: .5rem; font-weight: 850; font-size: .8rem; padding: .1rem .15rem .65rem; }
.jp-tksp .tk-kan-head a { color: inherit; text-decoration: none; }
.jp-tksp .tk-kan-head a:hover { color: var(--tk-accent); }
.jp-tksp .tk-kan-card { display: block; background: var(--tk-surface); border: 1px solid var(--tk-line); border-radius: var(--tk-radius); padding: .7rem; color: inherit; text-decoration: none; box-shadow: 0 2px 4px rgba(15, 23, 42, .04); transition: border-color .15s, transform .15s; }
.jp-tksp .tk-kan-card + .tk-kan-card { margin-top: .55rem; }
.jp-tksp .tk-kan-card:hover { border-color: var(--tk-accent); color: inherit; transform: translateY(-1px); }
.jp-tksp .tk-kan-card.is-late { border-left: 3px solid var(--tk-red); }
.jp-tksp .tk-kan-card strong { display: block; font-size: .82rem; line-height: 1.3; }
.jp-tksp .tk-kan-card .meta { font-size: .7rem; color: var(--tk-muted); font-weight: 600; margin: .15rem 0 .5rem; }
.jp-tksp .tk-kan-top { display: flex; gap: .55rem; align-items: flex-start; }
.jp-tksp .tk-kan-top .tk-prod-thumb { width: 34px; height: 40px; font-size: .85rem; }
.jp-tksp .tk-kan-foot { display: flex; align-items: center; justify-content: space-between; gap: .5rem; margin-top: .55rem; font-size: .7rem; }
.jp-tksp .tk-kan-foot .tk-avatar { width: 24px; height: 24px; font-size: .62rem; }
.jp-tksp .tk-kan-empty { font-size: .74rem; color: var(--tk-muted); padding: .2rem .15rem; }
.jp-tksp .tk-kan-more { display: block; text-align: center; font-size: .74rem; font-weight: 700; margin-top: .55rem; color: var(--tk-accent); text-decoration: none; }
.jp-tksp .tk-kan-col { transition: background .15s, border-color .15s, opacity .15s; }
.jp-tksp .tk-kan-col.is-over { border: 2px dashed var(--tk-accent); background: var(--tk-accent-soft); }
.jp-tksp .tk-kan-col.is-blocked { opacity: .45; }
.jp-tksp .tk-kan-card[data-movable="1"] { cursor: grab; }
.jp-tksp .tk-kan-card.is-dragging { opacity: .35; }
.jp-tksp .tk-kan-card a, .jp-tksp .tk-kan-card img { -webkit-user-drag: none; }
.jp-tksp .tk-kan-hint { position: sticky; left: 0; }
.tk-kan-ghost { position: fixed; left: 0; top: 0; z-index: 2000; margin: 0 !important; pointer-events: none; cursor: grabbing; opacity: .95; box-shadow: 0 12px 28px rgba(15, 23, 42, .22); }
body.tk-kan-dragging, body.tk-kan-dragging * { cursor: grabbing !important; user-select: none !important; }
@media (pointer: coarse) {
  .jp-tksp .tk-kan-card[data-movable="1"] { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
}

/* Thư viện — lưới thẻ */
.jp-tksp .tk-lib-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: .85rem; }
.jp-tksp .tk-lib-card { display: flex; flex-direction: column; border: 1px solid var(--tk-line); border-radius: 13px; background: var(--tk-surface); overflow: hidden; color: inherit; text-decoration: none; transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease; }
.jp-tksp a.tk-lib-main { display: block; color: inherit; text-decoration: none; flex: 1; }
.jp-tksp .tk-lib-card:hover { color: inherit; border-color: var(--tk-accent); transform: translateY(-3px); box-shadow: 0 10px 24px rgba(7, 24, 47, .08); }
.jp-tksp .tk-lib-card:hover a.tk-lib-main { color: inherit; }
.jp-tksp .tk-lib-actions { padding: 0 .8rem .8rem; }
.jp-tksp .tk-lib-actions form { margin: 0; }
.jp-tksp .tk-lib-art { height: 168px; background: linear-gradient(145deg, #f1f4f6, #dfe6eb); display: grid; place-items: center; position: relative; color: #94a3b8; font-size: 2rem; }
.jp-tksp .tk-lib-art img { width: 100%; height: 100%; object-fit: cover; }
.jp-tksp .tk-lib-art .status { position: absolute; left: .55rem; top: .55rem; }
.jp-tksp .tk-lib-body { padding: .75rem .8rem .85rem; }
.jp-tksp .tk-lib-body h3 { font-size: .86rem; font-weight: 850; margin: 0 0 .15rem; line-height: 1.3; }
.jp-tksp .tk-lib-body p { font-size: .74rem; color: var(--tk-muted); margin: 0; font-weight: 600; }
.jp-tksp .tk-lib-meta { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .35rem; margin-top: .65rem; }
.jp-tksp .tk-lib-meta div { background: var(--tk-surface-2); border-radius: 7px; padding: .4rem .45rem; }
.jp-tksp .tk-lib-meta small { font-size: .62rem; color: var(--tk-muted); display: block; font-weight: 700; letter-spacing: .03em; }
.jp-tksp .tk-lib-meta b { font-size: .74rem; font-weight: 850; }
.jp-tksp .tk-lib-foot { display: flex; align-items: center; justify-content: space-between; gap: .4rem; margin-top: .55rem; }
.jp-tksp .tk-lib-channels { display: flex; gap: .3rem; }
.jp-tksp .tk-ch { min-width: 1.5rem; height: 1.5rem; padding: 0 .3rem; border-radius: 6px; background: rgba(29, 78, 216, .1); color: var(--tk-blue); display: grid; place-items: center; font-size: .58rem; font-weight: 900; }
.jp-tksp .tk-ch.is-off { background: #edf0f2; color: #9aa4ae; }

/* Kế hoạch ra mắt — dải card */
.jp-tksp .tk-launch-strip { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: .7rem; }
.jp-tksp .tk-launch-mini { display: block; border: 1px solid var(--tk-line); border-radius: 12px; padding: .85rem .9rem; position: relative; overflow: hidden; color: inherit; text-decoration: none; background: var(--tk-surface); }
.jp-tksp .tk-launch-mini:before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--tk-blue); }
.jp-tksp .tk-launch-mini.is-green:before { background: var(--tk-green); }
.jp-tksp .tk-launch-mini.is-amber:before { background: var(--tk-amber); }
.jp-tksp .tk-launch-mini.is-red:before { background: var(--tk-red); }
.jp-tksp .tk-launch-mini.is-purple:before { background: var(--tk-purple); }
.jp-tksp .tk-launch-mini.is-gray:before { background: #94a3b8; }
.jp-tksp .tk-launch-mini:hover { border-color: var(--tk-accent); color: inherit; }
.jp-tksp .tk-launch-mini b { display: block; font-size: .82rem; line-height: 1.3; }
.jp-tksp .tk-launch-mini .date { font-size: 1.25rem; font-weight: 900; margin: .25rem 0 .15rem; letter-spacing: -.03em; }
.jp-tksp .tk-launch-mini small { color: var(--tk-muted); font-weight: 600; }

/* Banner sẵn sàng */
.jp-tksp .tk-ready-banner { display: grid; grid-template-columns: 140px minmax(0, 1fr) minmax(200px, 240px); gap: 1.1rem; align-items: center; padding: 1rem 1.15rem; }
.jp-tksp .tk-streams { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .45rem .85rem; }
.jp-tksp .tk-stream-head { display: flex; justify-content: space-between; align-items: baseline; font-size: .74rem; margin-bottom: .2rem; font-weight: 700; gap: .4rem; }
.jp-tksp .tk-stream-head span { color: var(--tk-muted); font-weight: 800; }
.jp-tksp .tk-ready-note { border-left: 1px solid var(--tk-line); padding-left: 1rem; }
.jp-tksp .tk-ready-note strong { display: block; font-size: .84rem; }
.jp-tksp .tk-ready-note p { font-size: .74rem; color: var(--tk-muted); margin: .25rem 0 .5rem; }

/* Mốc timeline chấm */
.jp-tksp .tk-ms { display: grid; grid-template-columns: 76px 32px minmax(0, 1fr) auto; gap: .5rem; align-items: start; position: relative; padding: .55rem 0; }
.jp-tksp .tk-ms:before { content: ""; position: absolute; left: 91px; top: 0; bottom: 0; width: 2px; background: #e3e8ed; }
.jp-tksp .tk-ms-day { font-weight: 900; color: var(--tk-navy); font-size: .78rem; text-align: right; line-height: 1.25; }
.jp-tksp .tk-ms-day small { display: block; font-weight: 700; color: var(--tk-muted); }
.jp-tksp .tk-ms-dot { width: 15px; height: 15px; border-radius: 50%; background: var(--tk-green); z-index: 1; margin-top: .2rem; border: 3px solid #dff4ea; }
.jp-tksp .tk-ms-dot.is-amber { background: var(--tk-amber); border-color: #fff0d1; }
.jp-tksp .tk-ms-dot.is-red { background: var(--tk-red); border-color: #ffd6d6; }
.jp-tksp .tk-ms-dot.is-gray { background: #a2acb8; border-color: #e9edf0; }
.jp-tksp .tk-ms-content b { font-size: .82rem; }
.jp-tksp .tk-ms-content p { font-size: .74rem; color: var(--tk-muted); margin: .15rem 0 0; }
.jp-tksp .tk-ms-side { font-size: .7rem; color: var(--tk-muted); white-space: nowrap; padding-top: .1rem; }

/* Thẻ sản phẩm trong kế hoạch */
.jp-tksp .tk-prod-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .75rem; }
.jp-tksp .tk-prod-card { border: 1px solid var(--tk-line); border-radius: 13px; overflow: hidden; background: var(--tk-surface); color: inherit; text-decoration: none; }
.jp-tksp .tk-prod-card:hover { border-color: var(--tk-accent); color: inherit; }
.jp-tksp .tk-prod-card .art { height: 132px; background: linear-gradient(145deg, #edf1f4, #dce3ea); display: grid; place-items: center; color: #94a3b8; font-size: 2rem; }
.jp-tksp .tk-prod-card .art img { width: 100%; height: 100%; object-fit: cover; }
.jp-tksp .tk-prod-card .info { padding: .7rem .8rem .8rem; }
.jp-tksp .tk-prod-card .info b { display: block; font-size: .82rem; }
.jp-tksp .tk-prod-card .info small { color: var(--tk-muted); font-weight: 600; }
.jp-tksp .tk-prod-card .foot { display: flex; justify-content: space-between; align-items: center; margin-top: .45rem; gap: .4rem; }

[data-theme="dark"] .jp-tksp .tk-pill.is-gray { color: #cbd5e1; }
[data-theme="dark"] .jp-tksp .tk-pill.is-blue { color: #93c5fd; }
[data-theme="dark"] .jp-tksp .tk-pill.is-green, [data-theme="dark"] .jp-tksp .tk-ok { color: #86efac; }
[data-theme="dark"] .jp-tksp .tk-pill.is-amber, [data-theme="dark"] .jp-tksp .tk-miss { color: #fcd34d; }
