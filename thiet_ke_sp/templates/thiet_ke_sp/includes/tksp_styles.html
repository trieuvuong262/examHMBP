.jp-tksp .tk-sheet { background: var(--tk-surface); border: 1px solid var(--tk-line); border-radius: var(--tk-radius); overflow: hidden; }

}

.jp-tksp .tk-hero-thumb { grid-area: thumb; position: relative; width: 160px; aspect-ratio: 3 / 4; height: auto; border-radius: 12px; overflow: hidden; display: grid; place-items: center; background: #fff; border: 1px solid rgba(15, 23, 42, .08); box-shadow: 0 1px 2px rgba(15, 23, 42, .04); color: var(--tk-muted); font-size: 1.6rem; align-self: start; }
