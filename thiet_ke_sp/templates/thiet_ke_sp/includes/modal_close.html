      </div>
      <div class="modal-footer py-2">
        <button type="button" class="btn btn-light border btn-sm" data-bs-dismiss="modal">Đóng</button>
        <button type="submit" class="btn {{ submit_class|default:'btn-hm text-white' }} btn-sm fw-bold">{{ submit_label|default:'Xác nhận' }}</button>
      </div>
    </form>
  </div>
</div>
