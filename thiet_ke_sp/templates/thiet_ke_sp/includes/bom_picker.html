<script>
(function () {
  var SEARCH_URL = '{% url "thiet_ke_sp:npl_search" %}';
  var instances = new WeakMap();

  function normalizeSearchText(value) {
    return String(value || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/đ/g, 'd');
  }

  function materialSearchScore(data, query, terms) {
    var name = normalizeSearchText(data.name || '');
    var code = normalizeSearchText(data.code || '');
    if (!terms.length) return 1;
    var nameCompact = name.replace(/\s+/g, '');
    var codeCompact = code.replace(/\s+/g, '');
    var allMatch = terms.every(function (term) {
      return name.indexOf(term) !== -1 || code.indexOf(term) !== -1
        || nameCompact.indexOf(term) !== -1 || codeCompact.indexOf(term) !== -1;
    });
    if (!allMatch) return 0;
    var q = normalizeSearchText(query).trim();
    if (name === q || code === q) return 4;
    if (name.indexOf(q) === 0 || code.indexOf(q) === 0) return 3;
    if (name.indexOf(q) !== -1 || code.indexOf(q) !== -1) return 2;
    return 1;
  }

  function stockLabel(data) {
    if (data && data.qty_label) return String(data.qty_label);
    if (!data || data.qty == null || data.qty === '') return '0';
    var qty = Number(data.qty);
    var text = Number.isFinite(qty) ? qty.toLocaleString('vi-VN', { maximumFractionDigits: 3 }) : '0';
    return data.unit ? (text + ' ' + data.unit) : text;
  }

  function unitsOf(opt) {
    if (opt && Array.isArray(opt.units) && opt.units.length) return opt.units;
    if (opt && opt.unit_id) {
      return [{ id: opt.unit_id, name: opt.unit_name || opt.unit || '', factor: '1', is_base: true }];
    }
    return [];
  }

  function fillUnits(row, units) {
    var select = row.querySelector('select.jp-npl-line-unit-select');
    if (!select || !units.length) return;
    var base = units.find(function (item) { return item.is_base; }) || units[0];
    select.innerHTML = '';
    units.forEach(function (item) {
      var option = document.createElement('option');
      option.value = String(item.id);
      option.textContent = item.name;
      option.dataset.factor = item.factor || '1';
      select.appendChild(option);
    });
    select.value = String(base.id);
  }

  function applyPrice(row) {
    var base = Number(row.dataset.basePrice);
    var input = row.querySelector('[name=line_price]');
    if (!input || !Number.isFinite(base)) return;
    var select = row.querySelector('select.jp-npl-line-unit-select');
    var factor = Number(select && select.selectedOptions[0] && select.selectedOptions[0].dataset.factor || 1);
    if (!Number.isFinite(factor) || factor <= 0) factor = 1;
    input.value = String(Math.round(base * factor));
    input.readOnly = true;
  }

  function initMaterialSelect(select) {
    if (!select || instances.has(select) || typeof TomSelect === 'undefined') return;
    var row = select.closest('tr');
    var initial = (select.value || '').trim();
    var picked = false;
    var ts = new TomSelect(select, {
      maxOptions: null,
      maxItems: 1,
      allowEmptyOption: true,
      valueField: 'id',
      labelField: 'name',
      searchField: [],
      placeholder: select.dataset.placeholder || 'Gõ tên NPL…',
      dropdownParent: 'body',
      openOnFocus: true,
      preload: 'focus',
      loadThrottle: 220,
      load: function (query, callback) {
        var url = SEARCH_URL + '?q=' + encodeURIComponent(query || '') + '&limit=1000';
        fetch(url, { headers: { Accept: 'application/json' } })
          .then(function (response) { return response.json(); })
          .then(function (data) { callback(data.results || []); })
          .catch(function () { callback(); });
      },
      score: function (query) {
        var terms = normalizeSearchText(query).split(/\s+/).filter(Boolean);
        return function (data) { return materialSearchScore(data, query, terms); };
      },
      sortField: [{ field: '$score', direction: 'desc' }],
      render: {
        option: function (data, escape) {
          var name = escape(data.name || data.text || '');
          var stock = escape(stockLabel(data) || '0');
          return '<div class="jp-npl-material-option is-name-stock" title="' + name + ' — ' + stock + '">'
            + '<span class="jp-npl-material-option-name">' + name + '</span>'
            + '<span class="jp-npl-material-option-meta text-muted small">' + stock + '</span></div>';
        },
        item: function (data, escape) {
          return '<div class="jp-npl-material-item"><span class="jp-npl-material-item-name">'
            + escape(data.name || data.text || '') + '</span></div>';
        },
        no_results: function () {
          return '<div class="px-2 py-2 text-muted small">Không tìm thấy NPL — thử tên khác</div>';
        },
        loading: function () {
          return '<div class="px-2 py-2 text-muted small">Đang tải...</div>';
        },
      },
      onChange: function (value) {
        var hidden = row && row.querySelector('input[name=line_material]');
        if (hidden) hidden.value = value || '';
        if (!picked && String(value || '') === initial) return;
        picked = true;
        var opt = value ? this.options[value] : null;
        if (!opt || !row) return;
        row.dataset.basePrice = String(opt.base_price || 0);
        fillUnits(row, unitsOf(opt));
        applyPrice(row);
      },
      onDropdownOpen: function () {
        this.load((this.control_input.value || '').trim());
      },
      onInitialize: function () {
        if (this.wrapper) this.wrapper.classList.add('jp-npl-material-ts');
      },
    });
    instances.set(select, ts);
  }

  function destroyMaterialSelect(row) {
    var select = row && row.querySelector('select.jp-npl-material-select');
    var ts = select ? instances.get(select) : null;
    if (ts) {
      ts.destroy();
      instances.delete(select);
    }
  }

  document.addEventListener('DOMContentLoaded', function () {
    var body = document.getElementById('tkBomBody');
    if (!body) return;
    body.querySelectorAll('select.jp-npl-material-select').forEach(initMaterialSelect);
    body.addEventListener('change', function (event) {
      if (event.target.matches('select.jp-npl-line-unit-select')) applyPrice(event.target.closest('tr'));
    });
    body.addEventListener('click', function (event) {
      var button = event.target.closest('.tk-bom-del');
      if (!button) return;
      var row = button.closest('tr');
      destroyMaterialSelect(row);
      if (row) row.remove();
    });
    var add = document.getElementById('tkBomAdd');
    var tpl = document.getElementById('tkBomTpl');
    if (!add || !tpl) return;
    add.addEventListener('click', function () {
      body.insertAdjacentHTML('beforeend', tpl.innerHTML);
      var rows = body.querySelectorAll('tr');
      var last = rows[rows.length - 1];
      if (last) initMaterialSelect(last.querySelector('select.jp-npl-material-select'));
    });
  });
})();
</script>
