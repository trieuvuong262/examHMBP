<div class="{{ col|default:'col-md-6' }}">
  <label class="form-label small mb-1{% if label_quiet %} text-muted{% else %} fw-bold{% endif %}" for="{{ field.id_for_label }}">{{ field.label }}{% if req %} <span class="text-danger">*</span>{% endif %}</label>
  {{ field }}
  {% if field.help_text and not label_quiet %}<div class="form-text small">{{ field.help_text }}</div>{% endif %}
  {% if field.errors %}<div class="invalid-feedback d-block">{{ field.errors|join:' ' }}</div>{% endif %}
</div>
