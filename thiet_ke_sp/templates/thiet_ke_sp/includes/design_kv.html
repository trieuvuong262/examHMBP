<div class="tk-brief is-read">
  <div class="tk-brief-row"><span>Kiểu dáng</span><span class="v">{{ dv.style_description|default:'—' }}</span></div>
  <div class="tk-brief-row"><span>Họa tiết</span><span class="v">{{ dv.pattern_description|default:'—' }}</span></div>
  <div class="tk-brief-row"><span>Logo</span><span class="v">{{ dv.logo_placement|default:'—' }}</span></div>
  <div class="tk-brief-row"><span>Chất liệu</span><span class="v">{{ dv.materials|default:'—' }}</span></div>
  <div class="tk-brief-row"><span>Nổi bật</span><span class="v">{{ dv.highlights|default:'—' }}</span></div>
  {% if dv.version_no > 1 %}<div class="tk-brief-row"><span>Thay đổi</span><span class="v">{{ dv.change_note|default:'—' }}</span></div>{% endif %}
</div>
