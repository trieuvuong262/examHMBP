<div class="tk-role-field{% if wide %} is-wide{% endif %}">
  <label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} <em>*</em>{% endif %}</label>
  {{ field }}
  {% if field.help_text %}<p>{{ field.help_text }}</p>{% endif %}
  {% if field.errors %}<div class="invalid-feedback d-block">{{ field.errors|join:' ' }}</div>{% endif %}
</div>
