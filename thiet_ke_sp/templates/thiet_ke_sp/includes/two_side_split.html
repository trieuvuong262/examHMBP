<div class="img tk-two-side-split">
  <span{% if not front.is_image %} class="is-empty"{% endif %}>
    {% if front.is_image %}<img src="{{ front.get_absolute_url }}" alt="Mặt trước" loading="lazy">{% else %}<i class="bi bi-image"></i>{% endif %}
    <small>Trước</small>
  </span>
  <span{% if not back.is_image %} class="is-empty"{% endif %}>
    {% if back.is_image %}<img src="{{ back.get_absolute_url }}" alt="Mặt sau" loading="lazy">{% else %}<i class="bi bi-image"></i>{% endif %}
    <small>Sau</small>
  </span>
</div>
