{% load tksp_tags %}
<div class="tk-grid3">
  <div class="tk-field"><label>Người làm mẫu</label><strong>{{ sv.maker|uname }}</strong></div>
  <div class="tk-field"><label>Ngày giao</label><strong>{{ sv.assigned_date|date:'d/m/Y'|default:'—' }}</strong></div>
  <div class="tk-field"><label>Ngày hoàn thành</label><strong>{{ sv.completed_date|date:'d/m/Y'|default:'—' }}</strong></div>
</div>
<div class="tk-field"><label>Tiến độ / ghi chú</label><span class="v">{{ sv.progress_note|default:'—' }}</span></div>
{% if sv.version_no > 1 %}<div class="tk-field"><label>Sửa so với lần trước</label><span class="v">{{ sv.change_note|default:'—' }}</span></div>{% endif %}
