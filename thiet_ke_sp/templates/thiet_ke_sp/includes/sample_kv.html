{% load tksp_tags %}
<div class="tk-brief is-read is-wide">
  <div class="tk-brief-row"><span>Người làm</span><span class="v">{{ sv.maker|uname }}</span></div>
  <div class="tk-brief-row"><span>Ngày giao</span><span class="v">{{ sv.assigned_date|date:'d/m/Y'|default:'—' }}</span></div>
  <div class="tk-brief-row"><span>Hoàn thành</span><span class="v">{{ sv.completed_date|date:'d/m/Y'|default:'—' }}</span></div>
  <div class="tk-brief-row"><span>Tiến độ</span><span class="v">{{ sv.progress_note|default:'—' }}</span></div>
  {% if sv.version_no > 1 %}<div class="tk-brief-row"><span>Thay đổi</span><span class="v">{{ sv.change_note|default:'—' }}</span></div>{% endif %}
</div>
