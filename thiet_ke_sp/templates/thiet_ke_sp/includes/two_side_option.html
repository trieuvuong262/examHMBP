{% load tksp_tags %}
{% with front=dv.current_atts|get_item:'front' back=dv.current_atts|get_item:'back' %}
{% if front.is_image or back.is_image %}
<span class="tk-option-thumb{% if front.is_image and back.is_image %} is-pair{% endif %}">
  {% if front.is_image %}<img src="{{ front.get_absolute_url }}" alt="Mặt trước" loading="lazy">{% endif %}
  {% if back.is_image %}<img src="{{ back.get_absolute_url }}" alt="Mặt sau" loading="lazy">{% endif %}
</span>
{% else %}
<span class="tk-option-thumb"><i class="bi bi-palette"></i></span>
{% endif %}
{% endwith %}
