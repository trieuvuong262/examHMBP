{# Một ô form. Tham số: field, col #}
<div class="{{ col|default:'col-12' }} jp-rc-field{% if field.errors %} has-error{% endif %}">
  <label class="form-label fw-semibold" for="{{ field.id_for_label }}">
    {{ field.label }}{% if field.field.required %} <span class="text-danger" aria-hidden="true">*</span><span class="visually-hidden">(bắt buộc)</span>{% endif %}
  </label>
  {{ field }}
  {% if field.help_text %}<div class="form-text">{{ field.help_text }}</div>{% endif %}
  {% for err in field.errors %}<div class="invalid-feedback d-block">{{ err }}</div>{% endfor %}
</div>
