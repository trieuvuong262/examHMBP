{% extends 'base.html' %}

{% block content %}
<div class="container-fluid px-4 py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold text-hm mb-0">Hệ Thống Báo Cáo Thông Minh (BI)</h2>
        {% if is_admin %}
            <span class="badge bg-success p-2"><i class="bi bi-shield-check me-1"></i> Quyền Admin: Thiết kế báo cáo</span>
        {% endif %}
    </div>

    <div class="row g-3 mb-4">
        <div class="col-md-3">
            <div class="card border-0 shadow-sm p-3 border-start border-primary border-4">
                <small class="text-muted fw-bold">TỔNG KPI</small>
                <h3 class="fw-bold mb-0">{{ total_kpis }}</h3>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card border-0 shadow-sm p-3 border-start border-success border-4">
                <small class="text-muted fw-bold">ĐIỂM TB HỆ THỐNG</small>
                <h3 class="fw-bold mb-0 text-success">{{ avg_score }}</h3>
            </div>
        </div>
        </div>

    <div class="card shadow-sm border-0 rounded-3">
        <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
            <h5 class="mb-0 fw-bold text-hm">
                <i class="bi bi-cpu-fill me-2"></i>
                {% if is_admin %}Xưởng Vẽ Báo Cáo Tự Động{% else %}Bảng Thống Kê KPI{% endif %}
            </h5>
            <div class="btn-group">
                <button onclick="document.getElementById('mb-iframe').src += ''" class="btn btn-sm btn-outline-secondary">
                    <i class="bi bi-arrow-clockwise"></i> Làm mới
                </button>
            </div>
        </div>
        <div class="card-body p-0">
            <iframe
                id="mb-iframe"
                src="{{ metabase_url }}"
                frameborder="0"
                width="100%"
                height="800"
                allowtransparency
                style="min-height: 800px;"
            ></iframe>
        </div>
    </div>
</div>
{% endblock %}
