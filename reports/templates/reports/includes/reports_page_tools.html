<div class="d-flex gap-2 flex-wrap w-100 w-md-auto">
    {% if copy_url %}
    <a href="{{ copy_url }}" class="btn btn-outline-hm btn-sm fw-bold flex-fill flex-md-grow-0"
       onclick="return confirm('{{ copy_confirm }}');">
        <i class="bi bi-copy me-1"></i>{{ copy_label }}
    </a>
    {% endif %}
    <a href="{% url 'reports:my' %}" class="btn btn-outline-dark btn-sm flex-fill flex-md-grow-0">Lịch sử</a>
    {% if can_view_team %}
    <a href="{% url 'reports:team' %}" class="btn btn-outline-hm btn-sm flex-fill flex-md-grow-0">Báo cáo cấp dưới</a>
    {% endif %}
</div>
