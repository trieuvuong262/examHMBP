<div class="modal fade" id="jpProdNormModal" tabindex="-1" aria-labelledby="jpProdNormModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="jpProdNormModalLabel">
                    <i class="bi bi-sliders me-1"></i>Quản lý định mức
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Đóng"></button>
            </div>
            <div class="modal-body p-0">
                <p class="text-muted small px-3 pt-3 mb-2">
                    Chỉnh định mức theo mã hàng — áp dụng cho toàn báo cáo này.
                </p>
                <div class="table-responsive">
                    <table class="table table-sm jp-prod-norm-modal-table mb-0">
                        <thead>
                            <tr>
                                <th>Mã hàng</th>
                                <th>Công đoạn</th>
                                <th class="text-end" style="width:7rem">Định mức/H</th>
                            </tr>
                        </thead>
                        <tbody>
                            {% for row in productivity.product_summaries %}
                            <tr class="jp-prod-norm-modal-row" data-product-id="{{ row.product_id }}">
                                <td><span class="jp-prod-code-pill">{{ row.product_code }}</span></td>
                                <td>{{ row.process_name }}</td>
                                <td class="text-end">
                                    <input type="number"
                                        name="norm_{{ row.product_id }}"
                                        value="{{ row.norm_per_hour|floatformat:0 }}"
                                        class="form-control form-control-sm jp-prod-norm-input text-end ms-auto"
                                        min="1" step="1"
                                        data-product-id="{{ row.product_id }}"
                                        aria-label="Định mức {{ row.product_code }}">
                                </td>
                            </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline-secondary btn-sm" data-bs-dismiss="modal">Đóng</button>
                <button type="submit" class="btn btn-hm btn-sm px-4">
                    <i class="bi bi-check2-circle me-1"></i>Lưu định mức
                </button>
            </div>
        </div>
    </div>
</div>
