<div class="modal fade jp-prod-modal" id="jpProdNormModal" tabindex="-1" aria-labelledby="jpProdNormModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable jp-prod-modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="jpProdNormModalLabel">
                    <i class="bi bi-pencil-square me-1"></i>Sửa mã hàng / công đoạn / định mức
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Đóng"></button>
            </div>
            <div class="modal-body p-0">
                <p class="text-muted small px-3 pt-3 mb-2">
                    Chỉnh thông tin theo dòng công đoạn. Bấm <strong>Xóa</strong> để gỡ công đoạn khỏi báo cáo, rồi <strong>Lưu thay đổi</strong>.
                </p>
                <div class="table-responsive">
                    <table class="table table-sm jp-prod-norm-modal-table mb-0">
                        <thead>
                            <tr>
                                <th>Mã hàng</th>
                                <th>Công đoạn</th>
                                <th class="text-end" style="width:7rem">Định mức</th>
                                <th class="text-center" style="width:4.5rem">Xóa</th>
                            </tr>
                        </thead>
                        <tbody>
                            {% for row in productivity.product_summaries %}
                            <tr class="jp-prod-norm-modal-row" data-product-id="{{ row.product_id }}">
                                <td>
                                    <input type="text"
                                        form="jp-prod-norm-form"
                                        name="code_{{ row.product_id }}"
                                        value="{{ row.product_code }}"
                                        class="form-control form-control-sm jp-prod-code-input"
                                        maxlength="80"
                                        data-product-id="{{ row.product_id }}"
                                        aria-label="Mã hàng {{ row.product_id }}">
                                </td>
                                <td>
                                    <input type="text"
                                        form="jp-prod-norm-form"
                                        name="process_{{ row.product_id }}"
                                        value="{{ row.process_name }}"
                                        class="form-control form-control-sm jp-prod-process-input"
                                        maxlength="120"
                                        data-product-id="{{ row.product_id }}"
                                        aria-label="Công đoạn {{ row.product_id }}">
                                </td>
                                <td class="text-end">
                                    <input type="number"
                                        form="jp-prod-norm-form"
                                        name="norm_{{ row.product_id }}"
                                        value="{{ row.norm_per_hour|floatformat:0 }}"
                                        class="form-control form-control-sm jp-prod-norm-input text-end ms-auto"
                                        min="1" step="1"
                                        data-product-id="{{ row.product_id }}"
                                        aria-label="Định mức {{ row.product_code }}">
                                </td>
                                <td class="text-center">
                                    <button type="button"
                                        class="btn btn-outline-danger btn-sm jp-prod-norm-delete-btn px-2"
                                        data-product-id="{{ row.product_id }}"
                                        title="Xóa công đoạn {{ row.process_name }}"
                                        aria-label="Xóa công đoạn {{ row.process_name }}">
                                        <i class="bi bi-trash" aria-hidden="true"></i>
                                    </button>
                                </td>
                            </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline-secondary btn-sm" data-bs-dismiss="modal">Đóng</button>
                <button type="submit" form="jp-prod-norm-form" class="btn btn-hm btn-sm px-4">
                    <i class="bi bi-check2-circle me-1"></i>Lưu thay đổi
                </button>
            </div>
        </div>
    </div>
</div>
