<div class="jp-office-workspace card border-0 shadow-sm mb-3">
    <div class="tab-content jp-office-panel">
        <div class="tab-pane fade show active" id="bang-pane" role="tabpanel">
            <div class="jp-sheet-tools">
                <span class="jp-sheet-tools-label">Bảng</span>
                <button type="button" class="jp-sheet-tool-btn is-primary" id="jpSheetAddRow"> Dòng</button>
                <button type="button" class="jp-sheet-tool-btn is-primary" id="jpSheetAddCol"> Cột</button>
                <button type="button" class="jp-sheet-tool-btn is-muted" id="jpSheetRemoveRow"> Dòng</button>
                <button type="button" class="jp-sheet-tool-btn is-muted" id="jpSheetRemoveCol"> Cột</button>
            </div>
            <div class="jp-sheet-viewport">
                <table class="jp-office-sheet mb-0" id="jpOfficeSheet" aria-label="Bảng báo cáo"></table>
            </div>
            {{ form.spreadsheet_data }}
        </div>
        <div class="tab-pane fade" id="vanban-pane" role="tabpanel">
            <div class="jp-vanban-panel">
                {{ form.document_html }}
            </div>
        </div>
    </div>
</div>
