<div class="jp-office-unified-attachments">
    <div class="row g-3">
        <div class="col-12 col-md-6">
            <div class="jp-office-attach-block">
                <label class="jp-office-attach-label"><i class="bi bi-file-earmark-arrow-up"></i> Thêm file</label>
                {% if files %}
                <div class="jp-weekly-existing mb-2">
                    <div class="small fw-bold text-muted mb-1">File đã tải</div>
                    {% for att in files %}
                    <div class="jp-weekly-existing-item">
                        <a href="{{ att.file_url }}" target="_blank" rel="noopener"
                           class="text-decoration-none flex-grow-1 text-break">{{ att.display_name }}</a>
                        {% if can_edit %}
                        <button type="submit"
                                form="office-attachment-delete-form"
                                formaction="{% url 'reports:daily_attachment_delete' att.pk %}"
                                class="btn btn-sm btn-outline-danger flex-shrink-0"
                                onclick="return confirm('Xóa file “{{ att.display_name|escapejs }}”?');">
                            <i class="bi bi-trash me-1"></i>Xóa
                        </button>
                        {% endif %}
                    </div>
                    {% endfor %}
                </div>
                {% endif %}
                <input type="file" name="link_files" class="form-control form-control-sm" multiple>
            </div>
        </div>
        <div class="col-12 col-md-6">
            <div class="jp-office-attach-block">
                <label class="jp-office-attach-label"><i class="bi bi-image"></i> Thêm ảnh</label>
                {% if images %}
                <div class="jp-weekly-existing mb-2">
                    <div class="small fw-bold text-muted mb-1">Ảnh đã tải</div>
                    <div class="row g-2">
                        {% for att in images %}
                        <div class="col-6 col-md-4">
                            <div class="jp-weekly-thumb">
                                <a href="{{ att.file_url }}" target="_blank" rel="noopener">
                                    <img src="{{ att.file_url }}" alt="{{ att.display_name }}" loading="lazy">
                                </a>
                                {% if can_edit %}
                                <button type="submit"
                                        form="office-attachment-delete-form"
                                        formaction="{% url 'reports:daily_attachment_delete' att.pk %}"
                                        class="jp-weekly-thumb-delete jp-office-attachment-delete"
                                        onclick="return confirm('Xóa ảnh “{{ att.display_name|escapejs }}”?');">
                                    <i class="bi bi-trash"></i><span>Xóa</span>
                                </button>
                                {% endif %}
                            </div>
                        </div>
                        {% endfor %}
                    </div>
                </div>
                {% endif %}
                <input type="file" name="link_images" class="form-control form-control-sm" multiple accept="image/*">
            </div>
        </div>
    </div>
</div>
