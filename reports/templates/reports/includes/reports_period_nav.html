<nav class="jp-reports-period-nav" aria-label="Loại báo cáo">
    <a href="{% url 'reports:today' %}{% if report_date %}?date={{ report_date|date:'Y-m-d' }}{% endif %}"
       class="jp-reports-period-card {% if report_period == 'daily' %}is-active{% endif %}">
        <span class="jp-reports-period-icon"><i class="bi bi-calendar-day"></i></span>
        <span class="jp-reports-period-text">
            <strong>Báo cáo ngày</strong>
            <small>Nhập công việc từng ngày</small>
        </span>
    </a>
    <a href="{% url 'reports:weekly' %}{% if week_start %}?week={{ week_start|date:'Y-m-d' }}{% endif %}"
       class="jp-reports-period-card {% if report_period == 'weekly' %}is-active{% endif %}">
        <span class="jp-reports-period-icon"><i class="bi bi-calendar-week"></i></span>
        <span class="jp-reports-period-text">
            <strong>Báo cáo tuần</strong>
            <small>Tổng hợp theo tuần (T2–CN)</small>
        </span>
    </a>
</nav>
