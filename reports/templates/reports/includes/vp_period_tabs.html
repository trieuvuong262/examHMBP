<ul class="nav nav-pills jp-reports-period-tabs flex-nowrap gap-1 mb-0" role="tablist">
    {% with nav_date=period_nav_date|default:report_date %}
    {% if period_tabs_use_range %}
    <li class="nav-item" role="presentation">
        <a class="nav-link rounded-pill fw-semibold {% if office_period == 'day' %}active{% endif %}"
           href="{% url base_url_name %}?period=day&from={{ range_from|date:'Y-m-d' }}&to={{ range_to|date:'Y-m-d' }}{% if extra_query %}&{{ extra_query }}{% endif %}">
            Ngày
        </a>
    </li>
    <li class="nav-item" role="presentation">
        <a class="nav-link rounded-pill fw-semibold {% if office_period == 'week' %}active{% endif %}"
           href="{% url base_url_name %}?period=week&from={{ range_from|date:'Y-m-d' }}&to={{ range_to|date:'Y-m-d' }}{% if extra_query %}&{{ extra_query }}{% endif %}">
            Tuần
        </a>
    </li>
    <li class="nav-item" role="presentation">
        <a class="nav-link rounded-pill fw-semibold {% if office_period == 'month' %}active{% endif %}"
           href="{% url base_url_name %}?period=month&from={{ range_from|date:'Y-m-d' }}&to={{ range_to|date:'Y-m-d' }}{% if extra_query %}&{{ extra_query }}{% endif %}">
            Tháng
        </a>
    </li>
    {% else %}
    <li class="nav-item" role="presentation">
        <a class="nav-link rounded-pill fw-semibold {% if office_period == 'day' %}active{% endif %}"
           href="{% url base_url_name %}?period=day&date={{ nav_date|date:'Y-m-d' }}{% if extra_query %}&{{ extra_query }}{% endif %}">
            Ngày
        </a>
    </li>
    <li class="nav-item" role="presentation">
        <a class="nav-link rounded-pill fw-semibold {% if office_period == 'week' %}active{% endif %}"
           href="{% url base_url_name %}?period=week{% if office_period == 'week' %}&date={{ nav_date|date:'Y-m-d' }}{% endif %}{% if extra_query %}&{{ extra_query }}{% endif %}">
            Tuần
        </a>
    </li>
    <li class="nav-item" role="presentation">
        <a class="nav-link rounded-pill fw-semibold {% if office_period == 'month' %}active{% endif %}"
           href="{% url base_url_name %}?period=month&month={{ nav_date|date:'Y-m' }}{% if extra_query %}&{{ extra_query }}{% endif %}">
            Tháng
        </a>
    </li>
    {% endif %}
    {% endwith %}
</ul>
