{% if dept_choices|length > 1 %}
<div class="jp-team-filter-org">
    <label class="form-label fw-bold small mb-1">Phòng ban</label>
    <select name="dept" class="form-select">
        <option value="">Tất cả phòng ban</option>
        {% for item in dept_choices %}
        <option value="{{ item.key }}" {% if selected_dept == item.key %}selected{% endif %}>{{ item.label }}</option>
        {% endfor %}
    </select>
</div>
{% endif %}
{% if division_choices|length > 1 %}
<div class="jp-team-filter-org">
    <label class="form-label fw-bold small mb-1">Bộ phận</label>
    <select name="division" class="form-select">
        <option value="">Tất cả bộ phận</option>
        {% for item in division_choices %}
        <option value="{{ item.key }}" {% if selected_division == item.key %}selected{% endif %}>{{ item.label }}</option>
        {% endfor %}
    </select>
</div>
{% endif %}
