<div class="jp-stat-grid mb-4 jp-team-stat-grid jp-team-stat-grid--6">
    <a href="{{ stat_urls.all }}" class="jp-team-stat-card card border-0 shadow-sm text-center p-3 text-decoration-none{% if not status_filter %} is-active{% endif %}">
        <div class="fs-4 fw-bold text-hm">{{ team_count }}</div>
        <small class="text-muted">Nhân viên</small>
    </a>
    <a href="{{ stat_urls.submitted }}" class="jp-team-stat-card card border-0 shadow-sm text-center p-3 text-decoration-none{% if status_filter == 'submitted' %} is-active{% endif %}">
        <div class="fs-4 fw-bold text-success">{{ submitted_count }}</div>
        <small class="text-muted">Đã nộp</small>
    </a>
    <a href="{{ stat_urls.missing }}" class="jp-team-stat-card card border-0 shadow-sm text-center p-3 text-decoration-none{% if status_filter == 'missing' %} is-active{% endif %}">
        <div class="fs-4 fw-bold text-danger">{{ missing_count }}</div>
        <small class="text-muted">Chưa nộp</small>
    </a>
    <a href="{{ stat_urls.no_report }}" class="jp-team-stat-card card border-0 shadow-sm text-center p-3 text-decoration-none{% if status_filter == 'no_report' %} is-active{% endif %}">
        <div class="fs-4 fw-bold text-secondary">{{ no_report_count }}</div>
        <small class="text-muted">Chưa báo cáo</small>
    </a>
    <a href="{{ stat_urls.not_reviewed }}" class="jp-team-stat-card card border-0 shadow-sm text-center p-3 text-decoration-none{% if status_filter == 'not_reviewed' %} is-active{% endif %}">
        <div class="fs-4 fw-bold text-warning">{{ not_reviewed_count }}</div>
        <small class="text-muted">Chưa duyệt</small>
    </a>
    <a href="{{ stat_urls.reviewed }}" class="jp-team-stat-card card border-0 shadow-sm text-center p-3 text-decoration-none{% if status_filter == 'reviewed' %} is-active{% endif %}">
        <div class="fs-4 fw-bold text-primary">{{ reviewed_count }}</div>
        <small class="text-muted">Đã duyệt</small>
    </a>
</div>
