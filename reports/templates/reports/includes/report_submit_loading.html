{% load static %}
<link rel="stylesheet" href="{% static 'css/reports-submit-loading.css' %}?v=20260708b">
<div id="jp-report-submit-loading" class="jp-report-submit-loading" hidden aria-live="polite" aria-busy="false">
    <div class="jp-report-submit-loading-box" role="status">
        <div class="spinner-border text-hm mb-3" style="width: 3rem; height: 3rem; border-width: 0.2em;" aria-hidden="true"></div>
        <h5 class="fw-bold text-dark mb-1" data-loading-message>Đang gửi báo cáo...</h5>
        <p class="text-muted small mb-0">Vui lòng đợi, không đóng hoặc tải lại trang.</p>
    </div>
</div>

<div id="jp-report-submit-error" class="jp-report-submit-error" hidden role="alertdialog" aria-modal="true" aria-labelledby="jpReportSubmitErrorTitle">
    <div class="jp-report-submit-error-box">
        <div class="jp-report-submit-error-icon" aria-hidden="true">
            <i class="bi bi-wifi-off"></i>
        </div>
        <h5 class="fw-bold text-danger mb-2" id="jpReportSubmitErrorTitle">Gửi báo cáo thất bại</h5>
        <p class="mb-2">Không gửi được báo cáo. Vui lòng:</p>
        <ol class="small text-muted mb-3 text-start ps-3">
            <li class="mb-1">Kiểm tra kết nối mạng (Wi‑Fi / dữ liệu di động)</li>
            <li class="mb-1">Đợi mạng ổn định rồi thử lại</li>
            <li>Bấm <strong>Gửi báo cáo</strong> lần nữa</li>
        </ol>
        <button type="button" class="btn btn-hm fw-bold w-100" id="jpReportSubmitErrorCloseBtn">Đã hiểu</button>
    </div>
</div>
<script src="{% static 'js/reports-submit-loading.js' %}?v=20260708b"></script>
