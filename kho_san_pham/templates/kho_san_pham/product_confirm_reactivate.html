{% extends 'base.html' %}

{% block content %}
<div class="container jp-page py-4 mb-5" style="max-width:560px">
    <h2 class="h4 fw-bold text-hm mb-3">Dùng lại {{ product.code }}?</h2>
    <p class="text-muted">{{ product.name }}</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-hm btn-sm fw-bold">Dùng lại</button>
        <a href="{% url 'kho_san_pham:product_detail' product.pk %}" class="btn btn-outline-secondary btn-sm">Hủy</a>
    </form>
</div>
{% endblock %}
