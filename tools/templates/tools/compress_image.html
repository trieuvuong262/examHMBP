{% extends "tools/tool_base.html" %}

{% block tool_content %}
<div class="row justify-content-center">
    <div class="col-12 col-lg-8 col-xl-7">
        <div class="jp-tool-card card border-0 shadow-sm">
            <div class="card-body p-3 p-md-4">
                {% if error %}
                <div class="alert alert-danger py-2">{{ error }}</div>
                {% endif %}

                <form method="post" enctype="multipart/form-data" class="jp-tool-form-loading"
                      data-loading-message="Đang nén ảnh…">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Chọn ảnh</label>
                        <input type="file" name="image_file" class="form-control" accept="image/jpeg,image/png,image/webp,image/gif" required>
                    </div>
                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Chất lượng (JPG)</label>
                            <input type="range" class="form-range" name="quality" min="30" max="95" value="80"
                                   oninput="this.nextElementSibling.textContent = this.value + '%'">
                            <div class="form-text">80%</div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Chiều rộng tối đa (px)</label>
                            <input type="number" name="max_width" class="form-control" min="320" max="4096" placeholder="Giữ nguyên nếu để trống">
                        </div>
                    </div>
                    <button type="submit" class="btn btn-hm">
                        <i class="bi bi-file-earmark-zip me-1"></i>Nén và tải xuống
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
