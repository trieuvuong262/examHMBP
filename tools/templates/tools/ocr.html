{% extends "tools/tool_base.html" %}
{% load static %}

{% block tool_content %}
<div class="row justify-content-center">
    <div class="col-12 col-lg-8 col-xl-7">
        <div class="jp-tool-card card border-0 shadow-sm">
            <div class="card-body p-3 p-md-4">
                <div class="mb-3">
                    <label class="form-label fw-semibold">Chọn ảnh</label>
                    <input type="file" id="ocr-file" class="form-control" accept="image/*">
                    <div class="form-text">JPG, PNG, WebP — xử lý ngay trên trình duyệt, không tải lên máy chủ.</div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Ngôn ngữ</label>
                    <select id="ocr-lang" class="form-select">
                        <option value="vie+eng" selected>Tiếng Việt + English</option>
                        <option value="vie">Tiếng Việt</option>
                        <option value="eng">English</option>
                    </select>
                </div>

                <button type="button" id="ocr-run" class="btn btn-hm" disabled>
                    <i class="bi bi-type me-1"></i>Nhận dạng chữ
                </button>
                <span id="ocr-status" class="text-muted small ms-2"></span>

                <div id="ocr-preview-wrap" class="mt-3 d-none">
                    <img id="ocr-preview" alt="Xem trước" class="jp-tool-preview-img">
                </div>

                <div class="mt-3">
                    <label class="form-label fw-semibold">Kết quả</label>
                    <textarea id="ocr-result" class="form-control" rows="10" placeholder="Văn bản nhận dạng sẽ hiện ở đây…" readonly></textarea>
                </div>

                <div class="d-flex flex-wrap gap-2 mt-3">
                    <button type="button" id="ocr-copy" class="btn btn-outline-secondary btn-sm" disabled>
                        <i class="bi bi-clipboard me-1"></i>Sao chép
                    </button>
                    <button type="button" id="ocr-download" class="btn btn-outline-secondary btn-sm" disabled>
                        <i class="bi bi-download me-1"></i>Tải .txt
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block tool_js %}
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="{% static 'js/tools/ocr.js' %}"></script>
{% endblock %}
