{% extends "tools/tool_base.html" %}
{% load static %}

{% block tool_content %}
<div class="row justify-content-center">
    <div class="col-12 col-lg-8 col-xl-7">
        <div class="jp-tool-card card border-0 shadow-sm">
            <div class="card-body p-3 p-md-4">
                <div class="mb-3">
                    <label class="form-label fw-semibold">Chọn ảnh</label>
                    <input type="file" id="rmbg-file" class="form-control" accept="image/*">
                    <div class="form-text">Xử lý trên server. Sau cập nhật hệ thống, lần đầu có thể chờ 1–2 phút (tải mô hình AI) — hệ thống sẽ tự thử lại.</div>
                </div>

                <button type="button" id="rmbg-run" class="btn btn-hm" disabled>
                    Xóa nền
                </button>
                <span id="rmbg-status" class="text-muted small ms-2"></span>

                <div class="row g-3 mt-3">
                    <div class="col-md-6">
                        <div class="jp-tool-preview-box">
                            <div class="jp-tool-preview-label">Ảnh gốc</div>
                            <img id="rmbg-before" alt="Trước" class="jp-tool-preview-img d-none">
                            <div id="rmbg-before-empty" class="jp-tool-preview-empty">Chưa chọn ảnh</div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="jp-tool-preview-box jp-tool-preview-box--checker">
                            <div class="jp-tool-preview-label">Sau khi xóa nền</div>
                            <img id="rmbg-after" alt="Sau" class="jp-tool-preview-img d-none">
                            <div id="rmbg-after-empty" class="jp-tool-preview-empty">Kết quả hiện ở đây</div>
                        </div>
                    </div>
                </div>

                <button type="button" id="rmbg-download" class="btn btn-outline-hm btn-sm mt-3" disabled>
                    Tải PNG
                </button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block tool_js %}
<script>document.body.dataset.rmbgApi = "{% url 'tools:remove_background_api' %}";</script>
<script src="{% static 'js/tools/remove_bg.js' %}?v=20260612b"></script>
{% endblock %}
