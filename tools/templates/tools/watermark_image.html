{% extends "tools/tool_base.html" %}

{% block tool_content %}
<div class="row justify-content-center">
    <div class="col-12 col-lg-8 col-xl-7">
        <div class="jp-tool-card card border-0 shadow-sm">
            <div class="card-body p-3 p-md-4">
                {% if error %}
                <div class="alert alert-danger py-2">{{ error }}</div>
                {% endif %}

                <form method="post" enctype="multipart/form-data" class="jp-tool-form-loading"
                      data-loading-message="Đang đóng watermark…">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Ảnh gốc</label>
                        <input type="file" name="image_file" class="form-control"
                               accept="image/jpeg,image/png,image/webp,image/gif" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Nội dung watermark (chữ)</label>
                        <input type="text" name="watermark_text" class="form-control" maxlength="80"
                               value="JustPlay" placeholder="Ví dụ: JustPlay — Nội bộ">
                        <div class="form-text">Bỏ trống nếu chỉ dùng logo bên dưới.</div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Logo watermark (tuỳ chọn)</label>
                        <input type="file" name="watermark_file" class="form-control" accept="image/png,image/jpeg,image/webp">
                    </div>
                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Vị trí</label>
                            <select name="position" class="form-select">
                                <option value="bottom-right">Góc dưới phải</option>
                                <option value="bottom-left">Góc dưới trái</option>
                                <option value="top-right">Góc trên phải</option>
                                <option value="top-left">Góc trên trái</option>
                                <option value="center">Giữa ảnh</option>
                                <option value="tile">Lặp khắp ảnh</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Độ mờ</label>
                            <input type="range" class="form-range" name="opacity" min="10" max="80" value="35"
                                   oninput="this.nextElementSibling.textContent = this.value + '%'">
                            <div class="form-text">35%</div>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-hm">
                        <i class="bi bi-droplet-half me-1"></i>Đóng watermark và tải PNG
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
