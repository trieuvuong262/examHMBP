{% extends "tools/tool_base.html" %}

{% block tool_content %}
<div class="row justify-content-center">
    <div class="col-12 col-lg-8 col-xl-7">
        <div class="jp-tool-card card border-0 shadow-sm">
            <div class="card-body p-3 p-md-4">
                {% if error %}
                <div class="alert alert-danger py-2">{{ error }}</div>
                {% endif %}

                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Nội dung mã QR</label>
                        <textarea name="qr_data" class="form-control" rows="3" placeholder="Link, văn bản, số điện thoại…">{{ qr_data }}</textarea>
                    </div>
                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Kích thước ô</label>
                            <input type="number" name="box_size" class="form-control" min="4" max="20" value="10">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Viền trắng</label>
                            <input type="number" name="border" class="form-control" min="1" max="8" value="2">
                        </div>
                    </div>
                    <div class="d-flex flex-wrap gap-2">
                        <button type="submit" name="action" value="preview" class="btn btn-outline-hm">
                            <i class="bi bi-eye me-1"></i>Xem trước
                        </button>
                        <button type="submit" name="action" value="download" class="btn btn-hm">
                            <i class="bi bi-download me-1"></i>Tải PNG
                        </button>
                    </div>
                </form>

                {% if preview_png %}
                <div class="text-center mt-4 p-3 bg-light rounded jp-qr-preview">
                    <img src="data:image/png;base64,{{ preview_png }}" alt="Mã QR" class="img-fluid" style="max-width: 280px;">
                </div>
                {% endif %}
            </div>
        </div>
    </div>
</div>
{% endblock %}
