{% extends "base.html" %}

{% block content %}
<div class="container-fluid jp-page jp-tools-page px-2 px-md-4 py-3 py-md-4 mb-4">
    <div class="jp-tools-top mb-3 mb-md-4">
        <a href="{% url 'home_portal' %}" class="jp-tools-back">
            <i class="bi bi-arrow-left me-1"></i>Trang chủ
        </a>
        {% if current_tool %}
        <div class="jp-tools-heading">
            <span class="jp-tools-heading-icon jp-tools-accent--{{ current_tool.accent }}">
                <i class="bi {{ current_tool.icon }}"></i>
            </span>
            <div>
                <h1 class="jp-tools-title mb-0">{{ current_tool.name }}</h1>
                <p class="jp-tools-desc mb-0">{{ current_tool.description }}</p>
            </div>
        </div>
        {% endif %}
    </div>

    {% block tool_content %}{% endblock %}
</div>
{% endblock %}

{% block scripts %}
{% block tool_js %}{% endblock %}
{% endblock %}
