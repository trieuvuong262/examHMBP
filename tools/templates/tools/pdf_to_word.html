{% extends "tools/tool_base.html" %}

{% block tool_content %}
<div class="row justify-content-center">
    <div class="col-12 col-lg-8 col-xl-7">
        <div class="jp-tool-card card border-0 shadow-sm">
            <div class="card-body p-3 p-md-4">
                {% if error %}
                <div class="alert alert-danger py-2">{{ error }}</div>
                {% endif %}

                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Chọn file PDF</label>
                        <input type="file" name="pdf_file" class="form-control" accept=".pdf,application/pdf" required>
                        <div class="form-text">Tối đa 10 MB. PDF dạng văn bản cho kết quả tốt nhất.</div>
                    </div>
                    <button type="submit" class="btn btn-hm">
                        <i class="bi bi-arrow-left-right me-1"></i>Chuyển sang Word
                    </button>
                </form>
            </div>
        </div>

        <div class="jp-tool-tip mt-3">
            <i class="bi bi-lightbulb me-1"></i>
            PDF scan ảnh nên dùng <a href="{% url 'tools:ocr' %}">OCR ảnh</a> trước, rồi dán vào Word.
        </div>
    </div>
</div>
{% endblock %}
