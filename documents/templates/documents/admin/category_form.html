{% extends 'base.html' %}

{% block content %}
<div class="container jp-page py-3 py-md-4 mb-5">
    <div class="mb-4">
        <a href="{% url 'documents:admin_categories' %}" class="text-muted text-decoration-none small">
            <i class="bi bi-arrow-left me-1"></i> Nhóm tài liệu
        </a>
        <h2 class="fw-bold text-hm mt-2 jp-page-title">{{ title }}</h2>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-body p-3 p-md-4">
            <form method="post" novalidate>
                {% csrf_token %}
                {% for field in form %}
                <div class="mb-3">
                    <label class="form-label fw-semibold" for="{{ field.id_for_label }}">{{ field.label }}</label>
                    {{ field }}
                    {% if field.help_text %}<div class="form-text">{{ field.help_text }}</div>{% endif %}
                    {% for error in field.errors %}<div class="text-danger small">{{ error }}</div>{% endfor %}
                </div>
                {% endfor %}
                <div class="d-flex flex-wrap gap-2 mt-4">
                    <button type="submit" class="btn btn-hm fw-bold">Lưu</button>
                    <a href="{% url 'documents:admin_categories' %}" class="btn btn-outline-secondary fw-bold">Huỷ</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
