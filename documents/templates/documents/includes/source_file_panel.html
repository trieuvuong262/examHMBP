{% if document.has_source_file %}
<div class="jp-doc-source-toolbar mb-3 d-flex flex-wrap align-items-center gap-2">
    <span class="text-muted small me-1">
        Tài liệu gốc:
        <strong>{{ document.source_display_name }}</strong>
    </span>
    {% if document.source_is_pdf %}
    <a href="{% url 'documents:file_view' document.pk %}" target="_blank" rel="noopener"
       class="btn btn-sm btn-outline-hm fw-bold">
        Xem file gốc
    </a>
    {% else %}
    <a href="{% url 'documents:file_view' document.pk %}" target="_blank" rel="noopener"
       class="btn btn-sm btn-outline-hm fw-bold">
        Mở file
    </a>
    {% endif %}
    <a href="{% url 'documents:file_download' document.pk %}"
       class="btn btn-sm btn-outline-secondary fw-bold">
        Tải về
    </a>
</div>
{% if document.content_type == 'TEXT' and document.source_is_pdf %}
<div class="jp-doc-pdf-frame ratio ratio-4x3 mb-3">
    <iframe src="{% url 'documents:file_view' document.pk %}#toolbar=1" title="{{ document.title }}"></iframe>
</div>
{% endif %}
{% endif %}
