<div class="row g-3">
    <div class="col-md-6">
        <label class="form-label fw-bold">Hình ảnh</label>
        <input type="file" name="images" class="form-control" multiple accept="image/*">
        <div class="form-text">JPG, PNG, GIF, WebP — tối đa 10 MB/ảnh.</div>
    </div>
    <div class="col-md-6">
        <label class="form-label fw-bold">File</label>
        <input type="file" name="files" class="form-control" multiple
               accept=".pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.zip,.rar,.txt,.csv">
        <div class="form-text">PDF, Word, Excel, PowerPoint, ZIP, TXT — tối đa 10 MB/file.</div>
    </div>
</div>
