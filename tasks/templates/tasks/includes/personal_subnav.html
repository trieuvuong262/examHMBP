<nav class="jp-tasks-subnav mb-3 mb-md-4" aria-label="Giao việc cá nhân">
    <div class="jp-tab-pills d-flex flex-wrap gap-2">
        {% if can_receive|default:jp_can_receive_tasks %}
        <a href="{% url 'tasks:my' %}"
           class="btn btn-sm {% if request.resolver_match.url_name == 'my' %}btn-hm{% else %}btn-outline-secondary{% endif %}">
            Việc của tôi
        </a>
        {% endif %}
        {% if can_assign|default:jp_can_assign_tasks %}
        <a href="{% url 'tasks:assigned' %}"
           class="btn btn-sm {% if request.resolver_match.url_name == 'assigned' %}btn-hm{% else %}btn-outline-secondary{% endif %}">
            Việc đã giao
        </a>
        <a href="{% url 'tasks:assign' %}"
           class="btn btn-sm {% if request.resolver_match.url_name == 'assign' %}btn-hm{% else %}btn-outline-secondary{% endif %}">
            Giao việc
        </a>
        <a href="{% url 'tasks:recurring' %}"
           class="btn btn-sm {% if request.resolver_match.url_name == 'recurring' %}btn-hm{% else %}btn-outline-secondary{% endif %}">
            Việc lặp
        </a>
        {% endif %}
    </div>
</nav>
