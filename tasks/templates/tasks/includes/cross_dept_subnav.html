<nav class="jp-tasks-subnav mb-3 mb-md-4" aria-label="Dự án liên phòng ban">
    <div class="jp-tab-pills d-flex flex-wrap gap-2">
        <a href="{% url 'tasks:cross_dept_list' %}"
           class="btn btn-sm {% if request.resolver_match.url_name == 'cross_dept_list' or request.resolver_match.url_name == 'cross_dept_detail' %}btn-hm{% else %}btn-outline-secondary{% endif %}">
            Danh sách dự án
        </a>
        <a href="{% url 'tasks:cross_dept_pending' %}"
           class="btn btn-sm {% if request.resolver_match.url_name == 'cross_dept_pending' %}btn-hm{% else %}btn-outline-secondary{% endif %}">
            Chờ tiếp nhận
            {% if pending_claim_count|default:0 %}<span class="badge bg-danger ms-1">{{ pending_claim_count }}</span>{% endif %}
        </a>
        {% if can_create|default:jp_can_create_cross_dept %}
        <a href="{% url 'tasks:cross_dept_create' %}"
           class="btn btn-sm {% if request.resolver_match.url_name == 'cross_dept_create' %}btn-hm{% else %}btn-outline-secondary{% endif %}">
            Tạo dự án
        </a>
        {% endif %}
    </div>
</nav>
