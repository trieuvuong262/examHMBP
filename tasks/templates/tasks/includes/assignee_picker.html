{# Dropdown chọn nhiều nhân viên — tìm kiếm + checkbox #}
<div class="jp-assignee-picker" data-field-name="{{ field.html_name }}">
    <button type="button"
            class="jp-assignee-picker-toggle form-control text-start d-flex align-items-center justify-content-between"
            aria-haspopup="listbox"
            aria-expanded="false">
        <span class="jp-assignee-picker-label text-muted">Chọn nhân viên...</span>
        <i class="bi bi-chevron-down ms-2 flex-shrink-0"></i>
    </button>

    <div class="jp-assignee-picker-menu shadow-sm border rounded-3" hidden>
        <div class="p-2 border-bottom">
            <input type="search"
                   class="form-control form-control-sm jp-assignee-picker-search"
                   placeholder="Tìm theo tên, mã NS, account..."
                   autocomplete="off">
        </div>
        <div class="jp-assignee-picker-actions px-2 py-1 border-bottom d-flex gap-2">
            <button type="button" class="btn btn-link btn-sm p-0 jp-assignee-picker-all">Chọn tất cả</button>
            <button type="button" class="btn btn-link btn-sm p-0 text-secondary jp-assignee-picker-none">Bỏ chọn</button>
        </div>
        <div class="jp-assignee-picker-list" role="listbox">
            {% for user in users %}
            <label class="jp-assignee-picker-option d-flex align-items-start gap-2"
                   data-search="{{ user.profile.full_name|default:user.username|lower }} {{ user.profile.employee_code|default:''|lower }} {{ user.username|lower }}">
                <input type="checkbox"
                       class="form-check-input mt-1 flex-shrink-0"
                       name="{{ field.html_name }}"
                       value="{{ user.pk }}"
                       {% if user.pk|stringformat:"s" in selected_ids %}checked{% endif %}>
                <span>
                    <strong>{{ user.profile.full_name|default:user.username }}</strong>
                    <span class="d-block small text-muted">{{ user.profile.employee_code|default:"—" }} · {{ user.username }}</span>
                </span>
            </label>
            {% empty %}
            <p class="text-muted small mb-0 p-3">Không có nhân viên nào để chọn.</p>
            {% endfor %}
        </div>
    </div>

    <div class="jp-assignee-picker-chips d-flex flex-wrap gap-1 mt-2"></div>
</div>
