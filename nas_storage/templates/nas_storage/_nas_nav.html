{% if nas_nav_items %}
<nav class="nav nav-pills flex-wrap gap-2 mb-3">
    {% for item in nas_nav_items %}
    <a href="{{ item.url }}"
       class="nav-link {% if nas_nav_active == item.key %}active{% else %}text-dark{% endif %}">
        {{ item.label }}
    </a>
    {% endfor %}
</nav>
{% endif %}
