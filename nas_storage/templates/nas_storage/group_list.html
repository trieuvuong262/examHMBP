{% extends "base.html" %}

{% block content %}
<div class="container-fluid jp-page jp-hrm-page py-3 py-md-4 px-2 px-md-4 mb-5">
    <div class="jp-page-header mb-3 d-flex justify-content-between align-items-center flex-wrap gap-2">
        <h2 class="jp-page-title fw-bold text-dark mb-0">Nhóm quyền NAS</h2>
        <a href="{% url 'nas_storage:group_create' %}" class="btn btn-hm btn-sm">Thêm nhóm</a>
    </div>
    {% include "nas_storage/_nas_nav.html" %}
    <div class="card border-0 shadow-sm">
        <div class="table-responsive">
            <table class="table mb-0">
                <thead class="table-light"><tr><th>Tên</th><th>Principal NAS</th><th>Mô tả</th><th></th></tr></thead>
                <tbody>
                {% for g in groups %}
                <tr>
                    <td>{{ g.name }}</td>
                    <td><code>{{ g.resolved_nas_principal }}</code></td>
                    <td class="text-muted small">{{ g.description }}</td>
                    <td class="text-end"><a href="{% url 'nas_storage:group_edit' g.pk %}" class="btn btn-sm btn-outline-secondary">Sửa</a></td>
                </tr>
                {% empty %}
                <tr><td colspan="4" class="text-muted p-4">Chưa có nhóm.</td></tr>
                {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
