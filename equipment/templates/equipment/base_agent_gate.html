{% load static %}
{% static 'images/logo/logo.png' as site_logo %}
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cài JustPlay Agent — JustPlay Portal</title>
    <link rel="icon" type="image/png" href="{{ site_logo }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/justplay-theme.css' %}">
</head>
<body class="jp-guest">
<nav class="navbar bg-hm">
    <div class="container-fluid px-3 px-lg-4">
        <span class="navbar-brand text-white d-flex align-items-center m-0">
            <img src="{{ site_logo }}" alt="JustPlay" class="me-2">
        </span>
        <a href="{% url 'logout' %}" class="btn btn-sm btn-outline-light">Đăng xuất</a>
    </div>
</nav>

<main class="container py-4 py-md-5 mb-5">
    {% block content %}{% endblock %}
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
