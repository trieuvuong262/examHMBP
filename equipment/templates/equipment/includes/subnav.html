<nav class="jp-tasks-subnav mb-3 mb-md-4" aria-label="{{ equipment_scope_label|default:'Quản lý thiết bị' }}">
    <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-2">
        <span class="badge jp-eq-scope-badge {% if is_it_scope %}jp-eq-scope-it{% else %}jp-eq-scope-prod{% endif %}">
            {{ equipment_scope_short }}
        </span>
    </div>
    <div class="jp-eq-subnav-row d-flex flex-wrap align-items-center justify-content-between gap-2">
        <div class="jp-tab-pills d-flex flex-wrap gap-2">
        <a href="{{ equipment_urls.dashboard }}"
           class="btn btn-sm {% if request.resolver_match.url_name == 'dashboard_it' or request.resolver_match.url_name == 'dashboard_production' %}btn-hm{% else %}btn-outline-secondary{% endif %}">
            Tổng quan
        </a>
        <a href="{{ equipment_urls.device_list }}"
           class="btn btn-sm {% if request.resolver_match.url_name == 'device_list_it' or request.resolver_match.url_name == 'device_list_production' or request.resolver_match.url_name == 'device_add_it' or request.resolver_match.url_name == 'device_add_production' or request.resolver_match.url_name == 'device_edit' or request.resolver_match.url_name == 'device_detail_manage' or request.resolver_match.url_name == 'import_export_hub_it' or request.resolver_match.url_name == 'import_export_hub_production' or request.resolver_match.url_name == 'import_devices_it' or request.resolver_match.url_name == 'import_devices_production' %}btn-hm{% else %}btn-outline-secondary{% endif %}">
            Danh sách thiết bị
        </a>
        <a href="{{ equipment_urls.it_repair_list }}"
           class="btn btn-sm {% if 'it_repair' in request.resolver_match.url_name %}btn-hm{% else %}btn-outline-secondary{% endif %}">
            Hỗ trợ kỹ thuật
            {% if it_repair_pending_count %}<span class="badge bg-danger ms-1">{{ it_repair_pending_count }}</span>{% endif %}
        </a>
        <a href="{{ equipment_urls.category_list }}"
           class="btn btn-sm {% if 'category_' in request.resolver_match.url_name %}btn-hm{% else %}btn-outline-secondary{% endif %}">
            Loại thiết bị
        </a>
        <a href="{{ equipment_urls.status_list }}"
           class="btn btn-sm {% if 'status_' in request.resolver_match.url_name %}btn-hm{% else %}btn-outline-secondary{% endif %}">
            Trạng thái
        </a>
        </div>
        {% if show_device_list_toolbar %}
        <div class="jp-eq-list-toolbar d-flex flex-wrap align-items-center gap-2">
            {% include 'equipment/includes/list_toolbar.html' %}
        </div>
        {% endif %}
    </div>
</nav>
