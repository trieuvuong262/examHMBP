{% load humanize %}
<div class="jp-eq-list-toolbar d-flex flex-wrap align-items-center gap-2">
    <a href="{% url 'equipment:device_add' %}" class="btn btn-hm">
        <i class="bi bi-plus-lg me-1"></i>Thêm thiết bị
    </a>
    <a href="{% url 'equipment:import_export_hub' %}" class="btn btn-dark">
        <i class="bi bi-upload me-1"></i>Nhập Excel
    </a>
    <a href="{% url 'equipment:category_add' %}" class="btn btn-outline-dark">
        <i class="bi bi-tag-fill me-1"></i>Thêm loại
    </a>
    <a href="{% url 'equipment:export_devices' %}?{{ request.GET.urlencode }}"
       class="btn btn-outline-hm ms-md-auto"
       title="Xuất theo bộ lọc hiện tại">
        <i class="bi bi-download me-1"></i>Xuất Excel{% if filtered_count %} ({{ filtered_count|intcomma }}){% endif %}

</div>
