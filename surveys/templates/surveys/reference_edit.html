{% extends 'base.html' %}

{% block content %}
<div class="container jp-page py-3 py-md-4 mb-5">
    <div class="jp-page-header mb-3 mb-md-4">
        <h2 class="fw-bold text-hm mb-1 jp-page-title">Chèn link tham khảo</h2>
        <p class="text-muted mb-0">{{ survey.title }}</p>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-body p-3 p-md-4">
            <form method="post" novalidate>
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label fw-semibold" for="{{ form.reference_url.id_for_label }}">{{ form.reference_url.label }}</label>
                    {{ form.reference_url }}
                    <div class="form-text">Link hiển thị cho nhân viên trước khi trả lời (tuỳ chọn).</div>
                    {% if form.reference_url.errors %}<div class="text-danger small mt-1">{{ form.reference_url.errors }}</div>{% endif %}
                </div>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-hm">Lưu link</button>
                    <a href="{% url 'surveys:manage_list' %}" class="btn btn-outline-secondary">Quay lại</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
