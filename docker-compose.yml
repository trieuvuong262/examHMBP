services:
  db:
    image: postgres:15-alpine
    # Chỉ bind localhost VPS — pgAdmin local kết nối qua SSH tunnel
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file: .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  web:
    build:
      context: .
      args:
        PYTHON_BASE_IMAGE: ${DOCKER_PYTHON_IMAGE:-python:3.13-slim}
    command: gunicorn PortalJustPlay.wsgi:application --bind 0.0.0.0:8000 --workers 10 --timeout 300 --limit-request-line 16384 --limit-request-field_size 16384
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - ./static/equipment:/app/static/equipment:ro
      - /proc:/host/proc:ro
      - /:/host/root:ro
      - /var/run/docker.sock:/var/run/docker.sock
      # Mã nguồn trên VPS (git pull) — đặt HOST_PROJECT_DIR=/opt/portaljustplay trong .env
      - ${HOST_PROJECT_DIR:-.}:/backup-source:ro
      - /mnt/nas-portal:/mnt/nas-portal
      - /root/.config/rclone:/root/.config/rclone:ro
      - /root/.nas-cred:/root/.nas-cred:ro
    environment:
      NAS_RCLONE_CONFIG: /root/.config/rclone/rclone.conf
      NAS_RCLONE_REMOTE: ${NAS_RCLONE_REMOTE:-synology:}
    expose:
      - "8000"
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import http.client; c=http.client.HTTPConnection('127.0.0.1',8000,timeout=5); c.request('GET','/accounts/login/'); r=c.getresponse(); exit(0 if r.status in (200,301,302) else 1)\"",
        ]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always

  migrate:
    build:
      context: .
      args:
        PYTHON_BASE_IMAGE: ${DOCKER_PYTHON_IMAGE:-python:3.13-slim}
    command: python manage.py migrate --noinput
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./PortalJustPlay/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./PortalJustPlay/nginx/security-headers.conf:/etc/nginx/conf.d/security-headers.conf:ro
      - ./PortalJustPlay/nginx/erp.conf:/etc/nginx/conf.d/erp.conf:ro
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - certbot_webroot:/var/www/certbot
    depends_on:
      - web
    networks:
      - default
      - justplay_edge
    restart: always

networks:
  justplay_edge:
    external: true

volumes:
  postgres_data:
  static_volume:
  media_volume:
  certbot_webroot: