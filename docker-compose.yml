services:
  db:
    image: postgres:15-alpine
    # Tinh chỉnh cho VPS 6 core / 8 GB, DB ~650 MB (mặc định của image quá dè dặt:
    # shared_buffers 128MB, work_mem 4MB, random_page_cost 4 kiểu ổ cứng quay).
    #   shared_buffers 2GB           — 25% RAM, cả DB nằm trong bộ đệm
    #   effective_cache_size 5GB     — báo cho planner biết OS còn ~5GB page cache
    #   work_mem 16MB                — sort/hash của báo cáo không phải ghi ra đĩa
    #   random_page_cost 1.1         — SSD, đọc ngẫu nhiên gần bằng đọc tuần tự
    #   effective_io_concurrency 200 — SSD đọc song song được
    #   jit off                      — workload nhiều truy vấn nhỏ, biên dịch JIT lỗ hơn lãi
    #   pg_stat_statements           — thống kê theo từng câu truy vấn để tối ưu tiếp
    command: >
      postgres
      -c shared_buffers=2GB
      -c effective_cache_size=5GB
      -c work_mem=16MB
      -c maintenance_work_mem=512MB
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c wal_buffers=16MB
      -c max_wal_size=2GB
      -c min_wal_size=256MB
      -c checkpoint_completion_target=0.9
      -c default_statistics_target=200
      -c jit=off
      -c shared_preload_libraries=pg_stat_statements
      -c pg_stat_statements.max=5000
      -c pg_stat_statements.track=top
    # Chỉ bind localhost VPS — pgAdmin local kết nối qua SSH tunnel
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file: .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  redis:
    image: redis:7-alpine
    # noeviction: hàng đợi job không được phép bị xoá khi đầy bộ nhớ.
    # Dữ liệu cache đều có TTL ngắn nên không lo phình.
    command: >
      redis-server
      --appendonly yes
      --maxmemory 384mb
      --maxmemory-policy noeviction
      --save 300 10
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  web:
    # web / worker / migrate dùng CHUNG một image: deploy.sh chỉ `compose build web`
    # là cả ba service có code mới. Trước đây mỗi service một image riêng
    # (portaljustplay-web/-worker/-migrate) nên worker và migrate chạy code cũ.
    image: portaljustplay-app:latest
    build:
      context: .
      args:
        PYTHON_BASE_IMAGE: ${DOCKER_PYTHON_IMAGE:-python:3.13-slim}
    command: gunicorn PortalJustPlay.wsgi:application --bind 0.0.0.0:8000 --workers 10 --timeout 300 --limit-request-line 16384 --limit-request-field_size 16384
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - ./static/equipment:/app/static/equipment:ro
      - /proc:/host/proc:ro
      - /:/host/root:ro
      - /var/run/docker.sock:/var/run/docker.sock
      # Mã nguồn trên VPS (git pull) — đặt HOST_PROJECT_DIR=/opt/portaljustplay trong .env
      - ${HOST_PROJECT_DIR:-.}:/backup-source:ro
      - /mnt/nas-portal:/mnt/nas-portal
      - /root/.config/rclone:/root/.config/rclone:ro
      - /root/.nas-cred:/root/.nas-cred:ro
    environment:
      NAS_RCLONE_CONFIG: /root/.config/rclone/rclone.conf
      NAS_RCLONE_REMOTE: ${NAS_RCLONE_REMOTE:-synology:}
    expose:
      - "8000"
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import http.client; c=http.client.HTTPConnection('127.0.0.1',8000,timeout=5); c.request('GET','/accounts/login/'); r=c.getresponse(); exit(0 if r.status in (200,301,302) else 1)\"",
        ]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always

  # Worker chạy job nền (RQ). Cùng image, cùng mount NAS như web vì job phải
  # đọc/ghi được file đính kèm trên NAS. Không mở port, không nhận HTTP.
  worker:
    image: portaljustplay-app:latest
    build:
      context: .
      args:
        PYTHON_BASE_IMAGE: ${DOCKER_PYTHON_IMAGE:-python:3.13-slim}
    command: python manage.py rqworker default nas --with-scheduler
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - ./static/equipment:/app/static/equipment:ro
      - ${HOST_PROJECT_DIR:-.}:/backup-source:ro
      - /mnt/nas-portal:/mnt/nas-portal
      - /root/.config/rclone:/root/.config/rclone:ro
      - /root/.nas-cred:/root/.nas-cred:ro
    environment:
      NAS_RCLONE_CONFIG: /root/.config/rclone/rclone.conf
      NAS_RCLONE_REMOTE: ${NAS_RCLONE_REMOTE:-synology:}
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always

  migrate:
    image: portaljustplay-app:latest
    build:
      context: .
      args:
        PYTHON_BASE_IMAGE: ${DOCKER_PYTHON_IMAGE:-python:3.13-slim}
    command: python manage.py migrate --noinput
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./PortalJustPlay/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./PortalJustPlay/nginx/security-headers.conf:/etc/nginx/conf.d/security-headers.conf:ro
      - ./PortalJustPlay/nginx/performance.conf:/etc/nginx/conf.d/performance.conf:ro
      - ./PortalJustPlay/nginx/erp.conf:/etc/nginx/conf.d/erp.conf:ro
      - ./PortalJustPlay/nginx/error-pages.conf:/etc/nginx/error-pages.conf:ro
      - ./PortalJustPlay/nginx/html:/etc/nginx/jp-errors:ro
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - certbot_webroot:/var/www/certbot
    depends_on:
      - web
    networks:
      - default
      - justplay_edge
    restart: always

networks:
  justplay_edge:
    external: true

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:
  certbot_webroot: