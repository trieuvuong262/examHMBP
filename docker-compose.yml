version: '3.8'

services:
  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    restart: always

  web:
    build: .
    # Đã thêm --timeout 300 ở cuối dòng command này nha ní
    command: bash -c "python manage.py collectstatic --noinput && python manage.py migrate && gunicorn PortalJustPlay.wsgi:application --bind 0.0.0.0:8000 --timeout 300"
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    expose:
      - "8000"
    env_file: .env
    depends_on:
      - db
    restart: always

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      # Mở thêm 443 khi bạn cài SSL (HTTPS)
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      - web
    restart: always

  # =========================================================
  # BỔ SUNG METABASE CHẠY NGẦM BẤT TỬ
  # =========================================================
  metabase:
    image: metabase/metabase:latest
    ports:
      - "3000:3000"
    volumes:
      - metabase_data:/metabase-data
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
      MAX_SESSION_AGE: 52560000  # Đăng nhập 1 lần xài 100 năm
    restart: always

volumes:
  postgres_data:
  static_volume:
  media_volume:
  metabase_data: # Khai báo thêm ổ đĩa cho Metabase