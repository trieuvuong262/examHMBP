{% load static %}
<audio id="jp-trip-bgm" src="{% static 'company_trip/audio/video-project-3.mp3' %}" loop preload="auto"></audio>
<button type="button" class="jp-trip-bgm-btn" id="jp-trip-bgm-btn" aria-pressed="false" aria-label="Bật nhạc nền">
    <i class="bi bi-volume-mute-fill" aria-hidden="true"></i>
</button>
<style>
.jp-trip-bgm-btn {
  position: fixed;
  z-index: 40;
  left: 0.75rem;
  bottom: calc(var(--jp-bottom-nav-h, 4.25rem) + var(--jp-safe-bottom, 0px) + 4.75rem);
  width: 2.5rem;
  height: 2.5rem;
  border: 0;
  border-radius: 0.35rem;
  background: rgba(15, 23, 42, 0.72);
  color: #fff;
  display: grid;
  place-items: center;
  box-shadow: 0 6px 16px rgba(15, 23, 42, 0.2);
}
body.jp-has-sidebar .jp-trip-bgm-btn { bottom: 1rem; }
@media (min-width: 992px) {
  .jp-trip-bgm-btn { bottom: 1rem; }
}
</style>
<script>
(function () {
  var audio = document.getElementById('jp-trip-bgm');
  var btn = document.getElementById('jp-trip-bgm-btn');
  if (!audio || !btn) return;
  var icon = btn.querySelector('i');
  audio.volume = 1;
  function paint(on) {
    btn.setAttribute('aria-pressed', on ? 'true' : 'false');
    btn.setAttribute('aria-label', on ? 'Tắt nhạc nền' : 'Bật nhạc nền');
    if (icon) icon.className = on ? 'bi bi-volume-up-fill' : 'bi bi-volume-mute-fill';
  }
  function start() {
    var play = audio.play();
    if (play && play.then) {
      play.then(function () { paint(true); }).catch(function () { paint(false); });
    }
  }
  btn.addEventListener('click', function () {
    if (audio.paused) start();
    else { audio.pause(); paint(false); }
  });
  start();
  document.addEventListener('pointerdown', function (event) {
    if (btn.contains(event.target)) return;
    if (audio.paused) start();
  }, { once: true });
})();
</script>
