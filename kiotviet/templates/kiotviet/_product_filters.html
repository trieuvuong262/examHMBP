<hr class="my-3 text-muted">
<div class="row g-3 align-items-end">
    <div class="col-12 col-lg-4">
        <label class="form-label fw-bold small mb-1" for="kv-filter-category">Nhóm hàng</label>
        <select name="category" id="kv-filter-category" class="form-select">
            {% for option in category_options %}
            <option value="{{ option.id }}" {% if product_filters.category_id|stringformat:"s" == option.id %}selected{% endif %}>
                {{ option.label }}
            </option>
            {% endfor %}
        </select>
    </div>
    <div class="col-12 col-lg-4">
        <label class="form-label fw-bold small mb-1" for="kv-filter-category-q">Tên nhóm (lọc thêm)</label>
        <input type="search" class="form-control" id="kv-filter-category-q" name="category_q"
               value="{{ product_filters.category_q }}" placeholder="VD: Áo đấu, Serie A..." autocomplete="off">
    </div>
    <div class="col-6 col-md-4 col-lg-2">
        <label class="form-label fw-bold small mb-1" for="kv-filter-product-type">Loại hàng</label>
        <select name="product_type" id="kv-filter-product-type" class="form-select">
            {% for value, label in product_type_options %}
            <option value="{{ value }}" {% if product_filters.product_type == value %}selected{% endif %}>{{ label }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="col-6 col-md-4 col-lg-2">
        <label class="form-label fw-bold small mb-1" for="kv-filter-unit">ĐVT</label>
        <select name="unit" id="kv-filter-unit" class="form-select">
            {% for option in unit_options %}
            <option value="{{ option.value }}" {% if product_filters.unit == option.value %}selected{% endif %}>{{ option.label }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="col-6 col-md-4 col-lg-2">
        <label class="form-label fw-bold small mb-1" for="kv-filter-is-active">Kinh doanh</label>
        <select name="is_active" id="kv-filter-is-active" class="form-select">
            <option value="yes" {% if product_filters.is_active == 'yes' %}selected{% endif %}>Đang KD</option>
            <option value="all" {% if not product_filters.is_active %}selected{% endif %}>Tất cả</option>
            <option value="no" {% if product_filters.is_active == 'no' %}selected{% endif %}>Ngừng KD</option>
        </select>
    </div>
    <div class="col-6 col-md-4 col-lg-2">
        <label class="form-label fw-bold small mb-1" for="kv-filter-stock">Tồn kho</label>
        <select name="stock" id="kv-filter-stock" class="form-select">
            <option value="" {% if not product_filters.stock %}selected{% endif %}>Tất cả</option>
            <option value="yes" {% if product_filters.stock == 'yes' %}selected{% endif %}>Còn hàng</option>
            <option value="no" {% if product_filters.stock == 'no' %}selected{% endif %}>Hết hàng</option>
        </select>
    </div>
    <div class="col-12 col-md-8 col-lg-3">
        <label class="form-label fw-bold small mb-1" for="kv-filter-sort">Sắp xếp</label>
        <select name="sort" id="kv-filter-sort" class="form-select">
            {% for value, label in sort_options %}
            <option value="{{ value }}" {% if product_filters.sort == value %}selected{% endif %}>{{ label }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="col-12 col-md-4 col-lg-1 d-grid">
        {% if has_active_filters %}
        <a href="{% url 'kiotviet:product_lookup' %}" class="btn btn-outline-secondary btn-sm" title="Đặt lại bộ lọc">
            <i class="bi bi-x-lg"></i>
        </a>
        {% endif %}
    </div>
</div>
