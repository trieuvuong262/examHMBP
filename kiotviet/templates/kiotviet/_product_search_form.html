{# Sidebar tìm & lọc — mỗi trường một dòng ngang, gọn chiều dọc #}

<div class="kv-product-filter-compact">
    <div class="kv-filter-row">
        <label class="kv-filter-label" for="kv-search-q">Tìm kiếm</label>
        <input type="search" class="form-control form-control-sm kv-filter-control" id="kv-search-q" name="q"
               value="{{ search_query }}" placeholder="Mã hoặc tên..." autocomplete="off">
    </div>

    <div class="kv-filter-row">
        <label class="kv-filter-label" for="kv-filter-category">Nhóm hàng</label>
        <select name="category" id="kv-filter-category" class="form-select form-select-sm kv-filter-control">
            {% for option in category_options %}
            <option value="{{ option.id }}" {% if product_filters.category_id|stringformat:"s" == option.id %}selected{% endif %}>
                {{ option.label }}
            </option>
            {% endfor %}
        </select>
    </div>

    <div class="kv-filter-row">
        <label class="kv-filter-label" for="kv-filter-product-type">Loại hàng</label>
        <select name="product_type" id="kv-filter-product-type" class="form-select form-select-sm kv-filter-control">
            {% for value, label in product_type_options %}
            <option value="{{ value }}" {% if product_filters.product_type == value %}selected{% endif %}>{{ label }}</option>
            {% endfor %}
        </select>
        <label class="kv-filter-label kv-filter-label-inline" for="kv-filter-unit">ĐVT</label>
        <select name="unit" id="kv-filter-unit" class="form-select form-select-sm kv-filter-control">
            {% for option in unit_options %}
            <option value="{{ option.value }}" {% if product_filters.unit == option.value %}selected{% endif %}>{{ option.label }}</option>
            {% endfor %}
        </select>
    </div>

    <div class="kv-filter-row">
        <label class="kv-filter-label" for="kv-filter-is-active">Kinh doanh</label>
        <select name="is_active" id="kv-filter-is-active" class="form-select form-select-sm kv-filter-control">
            <option value="yes" {% if product_filters.is_active == 'yes' %}selected{% endif %}>Đang KD</option>
            <option value="all" {% if not product_filters.is_active %}selected{% endif %}>Tất cả</option>
            <option value="no" {% if product_filters.is_active == 'no' %}selected{% endif %}>Ngừng KD</option>
        </select>
        <label class="kv-filter-label kv-filter-label-inline" for="kv-filter-stock">Tồn kho</label>
        <select name="stock" id="kv-filter-stock" class="form-select form-select-sm kv-filter-control">
            <option value="" {% if not product_filters.stock %}selected{% endif %}>Tất cả</option>
            <option value="yes" {% if product_filters.stock == 'yes' %}selected{% endif %}>Còn hàng</option>
            <option value="no" {% if product_filters.stock == 'no' %}selected{% endif %}>Hết hàng</option>
        </select>
    </div>

    <div class="kv-filter-row">
        <label class="kv-filter-label" for="kv-filter-sort">Sắp xếp</label>
        <select name="sort" id="kv-filter-sort" class="form-select form-select-sm kv-filter-control">
            {% for value, label in sort_options %}
            <option value="{{ value }}" {% if product_filters.sort == value %}selected{% endif %}>{{ label }}</option>
            {% endfor %}
        </select>
    </div>

    <div class="kv-filter-actions">
        <button type="submit" class="btn btn-hm btn-sm fw-semibold flex-grow-1">
            <i class="bi bi-search me-1"></i>Áp dụng
        </button>
        {% if has_active_filters or search_query %}
        <a href="{% url 'kiotviet:product_lookup' %}" class="btn btn-outline-secondary btn-sm" title="Đặt lại">
            <i class="bi bi-arrow-counterclockwise"></i>
        </a>
        {% endif %}
    </div>
</div>
