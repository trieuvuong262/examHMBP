{# Sidebar: tìm & lọc dọc, gọn #}

<div class="mb-2">
    <label class="form-label small fw-semibold mb-1" for="kv-search-type">Tra theo</label>
    <select name="type" id="kv-search-type" class="form-select form-select-sm">
        {% for value, label in type_options %}
        <option value="{{ value }}" {% if search_type == value %}selected{% endif %}>{{ label }}</option>
        {% endfor %}
    </select>
</div>
<div class="mb-3">
    <label class="form-label small fw-semibold mb-1" for="kv-search-q">Từ khóa</label>
    <input type="search" class="form-control form-control-sm" id="kv-search-q" name="q"
           value="{{ search_query }}" placeholder="Mã, tên, mã vạch..." autocomplete="off">
</div>

<hr class="my-2 text-muted opacity-25">

<div class="mb-2">
    <label class="form-label small fw-semibold mb-1" for="kv-filter-category">Nhóm hàng</label>
    <select name="category" id="kv-filter-category" class="form-select form-select-sm">
        {% for option in category_options %}
        <option value="{{ option.id }}" {% if product_filters.category_id|stringformat:"s" == option.id %}selected{% endif %}>
            {{ option.label }}
        </option>
        {% endfor %}
    </select>
</div>
<div class="mb-3">
    <label class="form-label small fw-semibold mb-1" for="kv-filter-category-q">Tên nhóm</label>
    <input type="search" class="form-control form-control-sm" id="kv-filter-category-q" name="category_q"
           value="{{ product_filters.category_q }}" placeholder="VD: Áo đấu..." autocomplete="off">
</div>

<hr class="my-2 text-muted opacity-25">

<div class="mb-2">
    <label class="form-label small fw-semibold mb-1" for="kv-filter-product-type">Loại hàng</label>
    <select name="product_type" id="kv-filter-product-type" class="form-select form-select-sm">
        {% for value, label in product_type_options %}
        <option value="{{ value }}" {% if product_filters.product_type == value %}selected{% endif %}>{{ label }}</option>
        {% endfor %}
    </select>
</div>
<div class="mb-2">
    <label class="form-label small fw-semibold mb-1" for="kv-filter-unit">Đơn vị</label>
    <select name="unit" id="kv-filter-unit" class="form-select form-select-sm">
        {% for option in unit_options %}
        <option value="{{ option.value }}" {% if product_filters.unit == option.value %}selected{% endif %}>{{ option.label }}</option>
        {% endfor %}
    </select>
</div>
<div class="mb-2">
    <label class="form-label small fw-semibold mb-1" for="kv-filter-is-active">Kinh doanh</label>
    <select name="is_active" id="kv-filter-is-active" class="form-select form-select-sm">
        <option value="yes" {% if product_filters.is_active == 'yes' %}selected{% endif %}>Đang kinh doanh</option>
        <option value="all" {% if not product_filters.is_active %}selected{% endif %}>Tất cả</option>
        <option value="no" {% if product_filters.is_active == 'no' %}selected{% endif %}>Ngừng KD</option>
    </select>
</div>
<div class="mb-3">
    <label class="form-label small fw-semibold mb-1" for="kv-filter-stock">Tồn kho</label>
    <select name="stock" id="kv-filter-stock" class="form-select form-select-sm">
        <option value="" {% if not product_filters.stock %}selected{% endif %}>Tất cả</option>
        <option value="yes" {% if product_filters.stock == 'yes' %}selected{% endif %}>Còn hàng</option>
        <option value="no" {% if product_filters.stock == 'no' %}selected{% endif %}>Hết hàng</option>
    </select>
</div>

<hr class="my-2 text-muted opacity-25">

<div class="mb-3">
    <label class="form-label small fw-semibold mb-1" for="kv-filter-sort">Sắp xếp</label>
    <select name="sort" id="kv-filter-sort" class="form-select form-select-sm">
        {% for value, label in sort_options %}
        <option value="{{ value }}" {% if product_filters.sort == value %}selected{% endif %}>{{ label }}</option>
        {% endfor %}
    </select>
</div>

<div class="d-grid gap-2">
    <button type="submit" class="btn btn-hm btn-sm fw-bold">
        <i class="bi bi-funnel me-1"></i>Áp dụng
    </button>
    {% if has_active_filters or search_query %}
    <a href="{% url 'kiotviet:product_lookup' %}" class="btn btn-outline-secondary btn-sm">
        <i class="bi bi-arrow-counterclockwise me-1"></i>Đặt lại
    </a>
    {% endif %}
</div>
