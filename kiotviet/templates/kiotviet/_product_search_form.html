{# Sidebar tìm & lọc — gọn, phần nâng cao gập mặc định #}

<div class="kv-product-filter-compact">
    <div class="row g-2 mb-2">
        <div class="col-5">
            <label class="form-label small text-muted mb-0" for="kv-search-type">Tra theo</label>
            <select name="type" id="kv-search-type" class="form-select form-select-sm">
                {% for value, label in type_options %}
                <option value="{{ value }}" {% if search_type == value %}selected{% endif %}>{{ label }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="col-7">
            <label class="form-label small text-muted mb-0" for="kv-search-q">Từ khóa</label>
            <input type="search" class="form-control form-control-sm" id="kv-search-q" name="q"
                   value="{{ search_query }}" placeholder="Mã, tên..." autocomplete="off">
        </div>
    </div>

    <details class="kv-filter-more mb-2"{% if has_active_filters %} open{% endif %}>
        <summary class="small text-muted py-1 user-select-none">Bộ lọc thêm</summary>
        <div class="pt-2">
            <div class="mb-2">
                <label class="form-label small text-muted mb-0" for="kv-filter-category">Nhóm hàng</label>
                <select name="category" id="kv-filter-category" class="form-select form-select-sm">
                    {% for option in category_options %}
                    <option value="{{ option.id }}" {% if product_filters.category_id|stringformat:"s" == option.id %}selected{% endif %}>
                        {{ option.label }}
                    </option>
                    {% endfor %}
                </select>
            </div>
            <div class="mb-2">
                <label class="form-label small text-muted mb-0" for="kv-filter-category-q">Tên nhóm</label>
                <input type="search" class="form-control form-control-sm" id="kv-filter-category-q" name="category_q"
                       value="{{ product_filters.category_q }}" placeholder="VD: Áo đấu..." autocomplete="off">
            </div>
            <div class="row g-2 mb-2">
                <div class="col-6">
                    <label class="form-label small text-muted mb-0" for="kv-filter-product-type">Loại</label>
                    <select name="product_type" id="kv-filter-product-type" class="form-select form-select-sm">
                        {% for value, label in product_type_options %}
                        <option value="{{ value }}" {% if product_filters.product_type == value %}selected{% endif %}>{{ label }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-6">
                    <label class="form-label small text-muted mb-0" for="kv-filter-unit">ĐVT</label>
                    <select name="unit" id="kv-filter-unit" class="form-select form-select-sm">
                        {% for option in unit_options %}
                        <option value="{{ option.value }}" {% if product_filters.unit == option.value %}selected{% endif %}>{{ option.label }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
            <div class="row g-2 mb-2">
                <div class="col-6">
                    <label class="form-label small text-muted mb-0" for="kv-filter-is-active">KD</label>
                    <select name="is_active" id="kv-filter-is-active" class="form-select form-select-sm">
                        <option value="yes" {% if product_filters.is_active == 'yes' %}selected{% endif %}>Đang KD</option>
                        <option value="all" {% if not product_filters.is_active %}selected{% endif %}>Tất cả</option>
                        <option value="no" {% if product_filters.is_active == 'no' %}selected{% endif %}>Ngừng</option>
                    </select>
                </div>
                <div class="col-6">
                    <label class="form-label small text-muted mb-0" for="kv-filter-stock">Tồn</label>
                    <select name="stock" id="kv-filter-stock" class="form-select form-select-sm">
                        <option value="" {% if not product_filters.stock %}selected{% endif %}>Tất cả</option>
                        <option value="yes" {% if product_filters.stock == 'yes' %}selected{% endif %}>Còn</option>
                        <option value="no" {% if product_filters.stock == 'no' %}selected{% endif %}>Hết</option>
                    </select>
                </div>
            </div>
            <div class="mb-0">
                <label class="form-label small text-muted mb-0" for="kv-filter-sort">Sắp xếp</label>
                <select name="sort" id="kv-filter-sort" class="form-select form-select-sm">
                    {% for value, label in sort_options %}
                    <option value="{{ value }}" {% if product_filters.sort == value %}selected{% endif %}>{{ label }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>
    </details>

    <div class="d-flex gap-2">
        <button type="submit" class="btn btn-hm btn-sm fw-semibold flex-grow-1">
            <i class="bi bi-search me-1"></i>Tìm
        </button>
        {% if has_active_filters or search_query %}
        <a href="{% url 'kiotviet:product_lookup' %}" class="btn btn-outline-secondary btn-sm" title="Đặt lại">
            <i class="bi bi-arrow-counterclockwise"></i>
        </a>
        {% endif %}
    </div>
</div>
