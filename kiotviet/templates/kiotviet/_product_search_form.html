{# Tìm kiếm + lọc hàng hoá — bố cục: tìm nhanh → nhóm → điều kiện → sắp xếp #}

<div class="mb-4">
    <div class="small fw-bold text-muted text-uppercase mb-2">
        <i class="bi bi-search me-1"></i>Tìm nhanh
    </div>
    <div class="input-group">
        <select name="type" id="kv-search-type" class="form-select flex-shrink-0" style="max-width:10.5rem;">
            {% for value, label in type_options %}
            <option value="{{ value }}" {% if search_type == value %}selected{% endif %}>{{ label }}</option>
            {% endfor %}
        </select>
        <input type="search" class="form-control" id="kv-search-q" name="q"
               value="{{ search_query }}" placeholder="Nhập mã, tên hoặc mã vạch..." autocomplete="off">
    </div>
    <div class="form-text">Để trống nếu chỉ muốn lọc theo nhóm / trạng thái bên dưới.</div>
</div>

<div class="mb-4">
    <div class="small fw-bold text-muted text-uppercase mb-2">
        <i class="bi bi-diagram-3 me-1"></i>Nhóm hàng
    </div>
    <div class="row g-2">
        <div class="col-12 col-lg-7">
            <label class="form-label small mb-1" for="kv-filter-category">Chọn nhóm</label>
            <select name="category" id="kv-filter-category" class="form-select">
                {% for option in category_options %}
                <option value="{{ option.id }}" {% if product_filters.category_id|stringformat:"s" == option.id %}selected{% endif %}>
                    {{ option.label }}
                </option>
                {% endfor %}
            </select>
        </div>
        <div class="col-12 col-lg-5">
            <label class="form-label small mb-1" for="kv-filter-category-q">Hoặc gõ tên nhóm</label>
            <input type="search" class="form-control" id="kv-filter-category-q" name="category_q"
                   value="{{ product_filters.category_q }}" placeholder="VD: Áo đấu, Serie A..." autocomplete="off">
        </div>
    </div>
</div>

<div class="mb-4">
    <div class="small fw-bold text-muted text-uppercase mb-2">
        <i class="bi bi-sliders me-1"></i>Điều kiện
    </div>
    <div class="row g-2">
        <div class="col-6 col-md-3">
            <label class="form-label small mb-1" for="kv-filter-product-type">Loại hàng</label>
            <select name="product_type" id="kv-filter-product-type" class="form-select">
                {% for value, label in product_type_options %}
                <option value="{{ value }}" {% if product_filters.product_type == value %}selected{% endif %}>{{ label }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="col-6 col-md-3">
            <label class="form-label small mb-1" for="kv-filter-unit">Đơn vị</label>
            <select name="unit" id="kv-filter-unit" class="form-select">
                {% for option in unit_options %}
                <option value="{{ option.value }}" {% if product_filters.unit == option.value %}selected{% endif %}>{{ option.label }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="col-6 col-md-3">
            <label class="form-label small mb-1" for="kv-filter-is-active">Kinh doanh</label>
            <select name="is_active" id="kv-filter-is-active" class="form-select">
                <option value="yes" {% if product_filters.is_active == 'yes' %}selected{% endif %}>Đang kinh doanh</option>
                <option value="all" {% if not product_filters.is_active %}selected{% endif %}>Tất cả</option>
                <option value="no" {% if product_filters.is_active == 'no' %}selected{% endif %}>Ngừng kinh doanh</option>
            </select>
        </div>
        <div class="col-6 col-md-3">
            <label class="form-label small mb-1" for="kv-filter-stock">Tồn kho</label>
            <select name="stock" id="kv-filter-stock" class="form-select">
                <option value="" {% if not product_filters.stock %}selected{% endif %}>Tất cả</option>
                <option value="yes" {% if product_filters.stock == 'yes' %}selected{% endif %}>Còn hàng</option>
                <option value="no" {% if product_filters.stock == 'no' %}selected{% endif %}>Hết hàng</option>
            </select>
        </div>
    </div>
</div>

<div class="d-flex flex-wrap gap-2 align-items-end justify-content-between border-top pt-3">
    <div class="flex-grow-1" style="min-width:12rem; max-width:18rem;">
        <label class="form-label small fw-bold mb-1" for="kv-filter-sort">Sắp xếp kết quả</label>
        <select name="sort" id="kv-filter-sort" class="form-select">
            {% for value, label in sort_options %}
            <option value="{{ value }}" {% if product_filters.sort == value %}selected{% endif %}>{{ label }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="d-flex gap-2 ms-auto">
        {% if has_active_filters or search_query %}
        <a href="{% url 'kiotviet:product_lookup' %}" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-counterclockwise me-1"></i>Đặt lại
        </a>
        {% endif %}
        <button type="submit" class="btn btn-hm fw-bold px-4">
            <i class="bi bi-funnel me-1"></i>Áp dụng
        </button>
    </div>
</div>
