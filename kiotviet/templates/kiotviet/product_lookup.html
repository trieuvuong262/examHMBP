{% extends 'kiotviet/_catalog_lookup.html' %}

{% block extra_head %}
{% include 'kiotviet/_collapse_sidebar.html' %}
<style>
    .kv-product-filter-stack {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
    }
    .kv-filter-field .form-label {
        display: block;
        font-size: 0.8rem;
        line-height: 1.2;
        margin-bottom: 0.25rem;
        white-space: nowrap;
    }
    .kv-filter-field .form-control,
    .kv-filter-field .form-select {
        width: 100%;
    }
    .kv-filter-field .form-select {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }
    .kv-filter-actions {
        margin-top: 0.15rem;
    }
    @media (min-width: 992px) {
        .kv-filter-sidebar-card .form-control,
        .kv-filter-sidebar-card .form-select {
            font-size: 0.8125rem;
        }
    }
</style>
{% endblock %}
