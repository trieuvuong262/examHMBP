{% extends 'base.html' %}

{% block content %}
<div class="container jp-page py-3 py-md-4 mb-5" style="max-width: 480px;">
    <h2 class="fw-bold text-hm mb-3">Xóa món?</h2>
    <p>Bạn có chắc muốn xóa <strong>{{ dish.name }}</strong>?</p>
    <form method="post" class="d-flex gap-2">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Xóa</button>
        <a href="{% url 'utilities:meal_dish_list' %}" class="btn btn-light border">Huỷ</a>
    </form>
</div>
{% endblock %}
