{% extends 'base.html' %}

{% block content %}
<div class="container jp-page py-3 py-md-4 mb-5">
    <div class="jp-page-header mb-3">
        <h2 class="fw-bold text-hm jp-page-title">Menu món theo ngày</h2>
        <p class="text-muted small mb-0">Tick món cho phép nhân viên đặt (thường ~5 món).</p>
    </div>
    {% include 'utilities/includes/meal_manage_nav.html' with active='menu' %}
    <form method="get" class="card border-0 shadow-sm mb-3">
        <div class="card-body p-3 d-flex flex-wrap gap-2 align-items-end">
            <div>
                <label class="form-label fw-bold small mb-1">Ngày ăn</label>
                <input type="date" name="meal_date" value="{{ meal_date|date:'Y-m-d' }}" class="form-control">
            </div>
            <button type="submit" class="btn btn-hm">Xem</button>
        </div>
    </form>
    <form method="post" class="card border-0 shadow-sm">
        <div class="card-body p-4">
            {% csrf_token %}
            <input type="hidden" name="meal_date" value="{{ meal_date|date:'Y-m-d' }}">
            <div class="row g-2">
                {% for row in offerings %}
                <div class="col-md-6">
                    <label class="border rounded p-3 d-flex gap-2 align-items-center h-100">
                        <input type="checkbox" name="offered" value="{{ row.dish_id }}" class="form-check-input" {% if row.is_offered %}checked{% endif %}>
                        <span>{{ row.dish.name }}</span>
                    </label>
                </div>
                {% endfor %}
            </div>
            <button type="submit" class="btn btn-hm fw-bold mt-3">Lưu menu ngày {{ meal_date|date:"d/m/Y" }}</button>
        </div>
    </form>
</div>
{% endblock %}
