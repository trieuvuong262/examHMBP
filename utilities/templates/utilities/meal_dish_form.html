{% extends 'base.html' %}

{% block content %}
<div class="container jp-page py-3 py-md-4 mb-5" style="max-width: 640px;">
    <h2 class="fw-bold text-hm mb-3">{{ title }}</h2>
    <div class="card border-0 shadow-sm">
        <div class="card-body p-4">
            <form method="post">
                {% csrf_token %}
                {% for field in form %}
                <div class="mb-3">
                    <label class="form-label fw-bold small">{{ field.label }}</label>
                    {{ field }}
                    {% if field.errors %}<div class="text-danger small">{{ field.errors }}</div>{% endif %}
                </div>
                {% endfor %}
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-hm fw-bold">Lưu</button>
                    <a href="{% url 'utilities:meal_dish_list' %}" class="btn btn-light border">Huỷ</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
