<script>
(function () {
    if (typeof TomSelect === 'undefined') return;
    var el = document.getElementById('{{ form.color.id_for_label }}');
    if (!el || el.tomselect) return;

    var hexByValue = {};
    el.querySelectorAll('option').forEach(function (opt) {
        if (opt.dataset.hex) hexByValue[opt.value] = opt.dataset.hex;
    });

    function renderColor(data, escape) {
        var hex = hexByValue[data.value];
        var swatch = hex
            ? '<span class="jp-npl-color-swatch" style="background-color: ' + escape(hex) + ';" aria-hidden="true"></span>'
            : '';
        return '<div class="jp-npl-color-chip">' + swatch +
            '<span class="jp-npl-color-name">' + escape(data.text) + '</span></div>';
    }

    new TomSelect(el, {
        placeholder: el.getAttribute('data-placeholder') || 'Tìm màu...',
        allowEmptyOption: true,
        maxItems: 1,
        dropdownParent: 'body',
        render: {
            option: renderColor,
            item: renderColor,
        },
    });
})();
</script>
