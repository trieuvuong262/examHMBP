<div class="jp-npl-color-picker" data-jp-color-picker>
    <div class="jp-npl-color-picker-layout">
        <div class="jp-npl-color-wheel-stage">
            <div class="jp-npl-color-wheel-wrap" data-jp-hue-wheel-wrap>
                <canvas class="jp-npl-color-wheel" data-jp-hue-wheel width="240" height="240" aria-label="Vòng màu RGB"></canvas>
                <span class="jp-npl-color-wheel-cursor" data-jp-hue-cursor aria-hidden="true"></span>
            </div>
            <div class="jp-npl-color-sl-wrap" data-jp-sl-wrap>
                <canvas class="jp-npl-color-sl" data-jp-sl-panel width="200" height="200" aria-label="Độ bão hòa và độ sáng"></canvas>
                <span class="jp-npl-color-sl-cursor" data-jp-sl-cursor aria-hidden="true"></span>
            </div>
        </div>
        <div class="jp-npl-color-picker-side">
            <span class="jp-npl-color-picker-preview" data-jp-color-preview aria-hidden="true"
                  style="background-color: {{ field.value|default:'#3B82F6' }};"></span>
            <div class="jp-npl-color-picker-hex">
                {{ field }}
                <div class="jp-npl-color-rgb small text-muted" data-jp-rgb-label>RGB: —</div>
                <div class="form-text mb-0">Chọn trên vòng màu / ô sắc độ — hoặc nhập trực tiếp mã HEX.</div>
            </div>
        </div>
    </div>
    {% if color_palette %}
    <details class="jp-npl-color-palette-details mt-3">
        <summary class="jp-npl-color-palette-title small fw-bold text-muted">Màu gợi ý nhanh ({{ color_palette|length }})</summary>
        <div class="jp-npl-color-palette-grid mt-2" role="listbox" aria-label="Màu gợi ý nhanh">
            {% for name, hex in color_palette %}
            <button type="button" class="jp-npl-color-palette-swatch{% if field.value|upper == hex|upper %} is-selected{% endif %}"
                    data-jp-palette-hex="{{ hex }}"
                    style="background-color: {{ hex }};"
                    title="{{ name }} — {{ hex }}"
                    aria-label="{{ name }} {{ hex }}"></button>
            {% endfor %}
        </div>
    </details>
    {% endif %}
</div>
<script>
(function () {
    var root = document.currentScript && document.currentScript.previousElementSibling;
    if (!root || !root.matches('[data-jp-color-picker]')) {
        root = document.querySelector('[data-jp-color-picker]');
    }
    if (!root) return;

    var hexInput = root.querySelector('.jp-npl-hex-input');
    var preview = root.querySelector('[data-jp-color-preview]');
    var rgbLabel = root.querySelector('[data-jp-rgb-label]');
    var hueCanvas = root.querySelector('[data-jp-hue-wheel]');
    var slCanvas = root.querySelector('[data-jp-sl-panel]');
    var hueCursor = root.querySelector('[data-jp-hue-cursor]');
    var slCursor = root.querySelector('[data-jp-sl-cursor]');
    if (!hexInput || !preview || !hueCanvas || !slCanvas) return;

    var state = { h: 217, s: 91, v: 96 };
    var hueCtx = hueCanvas.getContext('2d');
    var slCtx = slCanvas.getContext('2d');
    var draggingHue = false;
    var draggingSl = false;

    var HUE_OUTER = 108;
    var HUE_INNER = 72;
    var HUE_CX = 120;
    var HUE_CY = 120;

    function normalizeHex(value) {
        var hex = (value || '').trim().toUpperCase();
        if (!hex) return '';
        if (hex.charAt(0) !== '#') hex = '#' + hex;
        if (!/^#[0-9A-F]{6}$/.test(hex)) return null;
        return hex;
    }

    function rgbToHex(r, g, b) {
        function part(v) {
            var h = Math.max(0, Math.min(255, Math.round(v))).toString(16).toUpperCase();
            return h.length === 1 ? '0' + h : h;
        }
        return '#' + part(r) + part(g) + part(b);
    }

    function hexToRgb(hex) {
        hex = normalizeHex(hex);
        if (!hex) return null;
        return {
            r: parseInt(hex.slice(1, 3), 16),
            g: parseInt(hex.slice(3, 5), 16),
            b: parseInt(hex.slice(5, 7), 16),
        };
    }

    function rgbToHsv(r, g, b) {
        r /= 255; g /= 255; b /= 255;
        var max = Math.max(r, g, b);
        var min = Math.min(r, g, b);
        var d = max - min;
        var h = 0;
        var s = max === 0 ? 0 : d / max;
        var v = max;
        if (d !== 0) {
            switch (max) {
                case r: h = (g - b) / d + (g < b ? 6 : 0); break;
                case g: h = (b - r) / d + 2; break;
                default: h = (r - g) / d + 4; break;
            }
            h /= 6;
        }
        return { h: h * 360, s: s * 100, v: v * 100 };
    }

    function hsvToRgb(h, s, v) {
        s /= 100; v /= 100;
        var c = v * s;
        var x = c * (1 - Math.abs(((h / 60) % 2) - 1));
        var m = v - c;
        var r = 0, g = 0, b = 0;
        if (h < 60) { r = c; g = x; }
        else if (h < 120) { r = x; g = c; }
        else if (h < 180) { g = c; b = x; }
        else if (h < 240) { g = x; b = c; }
        else if (h < 300) { r = x; b = c; }
        else { r = c; b = x; }
        return {
            r: (r + m) * 255,
            g: (g + m) * 255,
            b: (b + m) * 255,
        };
    }

    function currentHex() {
        var rgb = hsvToRgb(state.h, state.s, state.v);
        return rgbToHex(rgb.r, rgb.g, rgb.b);
    }

    function drawHueWheel() {
        hueCtx.clearRect(0, 0, hueCanvas.width, hueCanvas.height);
        for (var angle = 0; angle < 360; angle += 1) {
            hueCtx.beginPath();
            hueCtx.arc(HUE_CX, HUE_CY, HUE_OUTER, (angle - 1) * Math.PI / 180, (angle + 1) * Math.PI / 180);
            hueCtx.arc(HUE_CX, HUE_CY, HUE_INNER, (angle + 1) * Math.PI / 180, (angle - 1) * Math.PI / 180, true);
            hueCtx.closePath();
            hueCtx.fillStyle = 'hsl(' + angle + ', 100%, 50%)';
            hueCtx.fill();
        }
        hueCtx.beginPath();
        hueCtx.arc(HUE_CX, HUE_CY, HUE_INNER - 1, 0, Math.PI * 2);
        hueCtx.fillStyle = '#fff';
        hueCtx.fill();
        hueCtx.strokeStyle = 'rgba(0,0,0,0.08)';
        hueCtx.lineWidth = 1;
        hueCtx.stroke();
    }

    function drawSlPanel() {
        var w = slCanvas.width;
        var h = slCanvas.height;
        slCtx.clearRect(0, 0, w, h);
        slCtx.fillStyle = 'hsl(' + state.h + ', 100%, 50%)';
        slCtx.fillRect(0, 0, w, h);
        var whiteGrad = slCtx.createLinearGradient(0, 0, w, 0);
        whiteGrad.addColorStop(0, '#fff');
        whiteGrad.addColorStop(1, 'rgba(255,255,255,0)');
        slCtx.fillStyle = whiteGrad;
        slCtx.fillRect(0, 0, w, h);
        var blackGrad = slCtx.createLinearGradient(0, 0, 0, h);
        blackGrad.addColorStop(0, 'rgba(0,0,0,0)');
        blackGrad.addColorStop(1, '#000');
        slCtx.fillStyle = blackGrad;
        slCtx.fillRect(0, 0, w, h);
    }

    function placeHueCursor() {
        var mid = (HUE_OUTER + HUE_INNER) / 2;
        var rad = state.h * Math.PI / 180;
        var x = HUE_CX + Math.cos(rad) * mid;
        var y = HUE_CY + Math.sin(rad) * mid;
        hueCursor.style.left = x + 'px';
        hueCursor.style.top = y + 'px';
        hueCursor.style.backgroundColor = 'hsl(' + state.h + ', 100%, 50%)';
    }

    function placeSlCursor() {
        var w = slCanvas.width;
        var h = slCanvas.height;
        var x = (state.s / 100) * w;
        var y = (1 - state.v / 100) * h;
        slCursor.style.left = x + 'px';
        slCursor.style.top = y + 'px';
        slCursor.style.backgroundColor = currentHex();
    }

    function setSelectedSwatch(hex) {
        root.querySelectorAll('[data-jp-palette-hex]').forEach(function (btn) {
            btn.classList.toggle('is-selected', btn.getAttribute('data-jp-palette-hex').toUpperCase() === hex);
        });
    }

    function applyState(skipHexInput) {
        var hex = currentHex();
        if (!skipHexInput) hexInput.value = hex;
        preview.style.backgroundColor = hex;
        var rgb = hsvToRgb(state.h, state.s, state.v);
        if (rgbLabel) {
            rgbLabel.textContent = 'RGB: ' + Math.round(rgb.r) + '-' + Math.round(rgb.g) + '-' + Math.round(rgb.b);
        }
        drawSlPanel();
        placeHueCursor();
        placeSlCursor();
        setSelectedSwatch(hex);
    }

    function applyHex(hex, silent) {
        hex = normalizeHex(hex);
        if (!hex) return;
        var rgb = hexToRgb(hex);
        if (!rgb) return;
        state = rgbToHsv(rgb.r, rgb.g, rgb.b);
        applyState(silent);
        if (!silent) hexInput.value = hex;
    }

    function pickHueFromEvent(ev) {
        var rect = hueCanvas.getBoundingClientRect();
        var scaleX = hueCanvas.width / rect.width;
        var scaleY = hueCanvas.height / rect.height;
        var x = (ev.clientX - rect.left) * scaleX;
        var y = (ev.clientY - rect.top) * scaleY;
        var dx = x - HUE_CX;
        var dy = y - HUE_CY;
        var dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < HUE_INNER || dist > HUE_OUTER) return false;
        var angle = Math.atan2(dy, dx) * 180 / Math.PI;
        if (angle < 0) angle += 360;
        state.h = angle;
        applyState();
        return true;
    }

    function pickSlFromEvent(ev) {
        var rect = slCanvas.getBoundingClientRect();
        var w = slCanvas.width;
        var h = slCanvas.height;
        var x = Math.max(0, Math.min(w, (ev.clientX - rect.left) * (w / rect.width)));
        var y = Math.max(0, Math.min(h, (ev.clientY - rect.top) * (h / rect.height)));
        state.s = (x / w) * 100;
        state.v = (1 - y / h) * 100;
        applyState();
        return true;
    }

    function bindDrag(canvas, onPick, flag) {
        canvas.addEventListener('pointerdown', function (ev) {
            if (!onPick(ev)) return;
            flag.value = true;
            canvas.setPointerCapture(ev.pointerId);
        });
        canvas.addEventListener('pointermove', function (ev) {
            if (!flag.value) return;
            onPick(ev);
        });
        canvas.addEventListener('pointerup', function (ev) {
            flag.value = false;
            try { canvas.releasePointerCapture(ev.pointerId); } catch (e) {}
        });
        canvas.addEventListener('pointercancel', function () { flag.value = false; });
    }

    bindDrag(hueCanvas, pickHueFromEvent, { value: false });
    bindDrag(slCanvas, pickSlFromEvent, { value: false });

    hexInput.addEventListener('input', function () {
        var hex = normalizeHex(hexInput.value);
        if (!hex) return;
        applyHex(hex, true);
    });

    hexInput.addEventListener('blur', function () {
        var hex = normalizeHex(hexInput.value);
        if (hex) applyHex(hex);
    });

    root.querySelectorAll('[data-jp-palette-hex]').forEach(function (btn) {
        btn.addEventListener('click', function () {
            applyHex(btn.getAttribute('data-jp-palette-hex').toUpperCase());
        });
    });

    drawHueWheel();
    var initial = normalizeHex(hexInput.value);
    if (initial) applyHex(initial);
    else applyState();
})();
</script>
