<div class="jp-npl-list-topbar mb-3">
    <h2 class="jp-npl-list-topbar-title">
        {% if page_icon %}<i class="bi {{ page_icon }} me-2"></i>{% endif %}{{ page_title }}
    </h2>
    {% if topbar_actions %}
    <div class="jp-npl-list-topbar-actions">{{ topbar_actions }}</div>
    {% endif %}
    {% if show_search != False %}
    <form method="get" class="jp-npl-list-topbar-search"{% if search_form_id %} id="{{ search_form_id }}"{% endif %}>
        {% if search_hidden_tab %}<input type="hidden" name="tab" value="{{ search_hidden_tab }}">{% endif %}
        {% if search_hidden_status %}<input type="hidden" name="status" value="{{ search_hidden_status }}">{% endif %}
        {% for hname, hvalue in search_hidden_extra %}
        <input type="hidden" name="{{ hname }}" value="{{ hvalue }}">
        {% endfor %}
        <div class="input-group input-group-sm">
            <span class="input-group-text"><i class="bi bi-search"></i></span>
            <input type="search" class="form-control" {% if search_input_id %}id="{{ search_input_id }}"{% endif %}
                   name="q" value="{{ search_query|default:'' }}"
                   placeholder="{{ search_placeholder|default:'Tìm...' }}" autocomplete="off" aria-label="Tìm">
            <button type="submit" class="btn btn-hm fw-bold">Tìm</button>
        </div>
    </form>
    {% endif %}
</div>
