<div class="jp-npl-mat-filter-field">
    <select name="category" id="{{ child_select_id }}"
            class="form-select form-select-sm jp-npl-filter-ctl"
            aria-label="Nhóm">
        <option value="">Tất cả nhóm</option>
        {% for category in category_roots %}
        <option value="{{ category.id }}" {% if category.id in selected_categories %}selected{% endif %}>{{ category.name }}</option>
        {% endfor %}
    </select>
</div>
