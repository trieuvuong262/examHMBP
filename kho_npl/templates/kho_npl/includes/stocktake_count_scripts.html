<script>
(function () {
    const tbody = document.querySelector('#stk-count-body');
    const searchInput = document.getElementById('stk-count-search');
    const clearBtn = document.getElementById('stk-count-clear');
    const metaEl = document.getElementById('stk-count-meta');
    const emptyRow = document.getElementById('stk-count-empty');
    const filterBtns = document.querySelectorAll('.jp-npl-stk-count-filter-btn');
    if (!tbody || !searchInput) return;

    let activeFilter = 'all';
    const rows = Array.from(tbody.querySelectorAll('.jp-npl-stk-count-row'));

    function rowActualInput(row) {
        return row.querySelector('input[name$="-actual_qty"]');
    }

    function rowSystemQty(row) {
        const raw = row.getAttribute('data-system-qty');
        if (raw === '' || raw == null) return null;
        const n = parseFloat(raw);
        return Number.isFinite(n) ? n : null;
    }

    function rowActualQty(row) {
        const input = rowActualInput(row);
        if (!input || input.value === '') return null;
        const n = parseFloat(input.value);
        return Number.isFinite(n) ? n : null;
    }

    function passesFilter(row) {
        if (activeFilter === 'empty') {
            return rowActualQty(row) === null;
        }
        if (activeFilter === 'filled') {
            return rowActualQty(row) !== null;
        }
        if (activeFilter === 'variance') {
            const actual = rowActualQty(row);
            const system = rowSystemQty(row);
            if (actual === null || system === null) return false;
            return actual !== system;
        }
        return true;
    }

    function passesSearch(row, term) {
        if (!term) return true;
        const name = row.getAttribute('data-mat-search') || '';
        return window.JpNplMaterialNameSearch
            ? window.JpNplMaterialNameSearch.matches(name, term)
            : name.toLowerCase().indexOf(term.toLowerCase()) !== -1;
    }

    function applyFilter() {
        const term = (searchInput.value || '').trim();
        let visible = 0;
        rows.forEach(function (row) {
            const show = passesSearch(row, term) && passesFilter(row);
            row.classList.toggle('is-hidden', !show);
            row.classList.toggle('is-match', !!term && show);
            if (show) visible += 1;
        });
        if (metaEl) {
            metaEl.textContent = visible + ' / ' + rows.length + ' dòng';
        }
        if (emptyRow) {
            emptyRow.classList.toggle('is-visible', visible === 0 && rows.length > 0);
        }
    }

    searchInput.addEventListener('input', applyFilter);
    clearBtn?.addEventListener('click', function () {
        searchInput.value = '';
        searchInput.focus();
        applyFilter();
    });

    filterBtns.forEach(function (btn) {
        btn.addEventListener('click', function () {
            activeFilter = btn.getAttribute('data-filter') || 'all';
            filterBtns.forEach(function (b) {
                const on = b === btn;
                b.classList.toggle('btn-hm', on);
                b.classList.toggle('btn-outline-secondary', !on);
            });
            applyFilter();
        });
    });

    function isCompleteQtyValue(raw) {
        return /^\d+([.,]\d+)?$/.test(String(raw || '').trim());
    }

    function stocktakeQtyError(input) {
        const row = input?.closest('.jp-npl-stk-count-row');
        if (!row || !input) return null;
        const raw = String(input.value || '').trim().replace(',', '.');
        if (!raw || !isCompleteQtyValue(input.value)) return null;
        const qty = parseFloat(raw);
        if (!Number.isFinite(qty) || qty >= 0) return null;
        const code = row.getAttribute('data-mat-code') || 'NPL';
        return code + ': Tồn thực tế không được âm';
    }

    function validateStocktakeQty(input, showPopup) {
        const api = window.jpNplValidationPopup;
        if (!input) return null;
        const message = stocktakeQtyError(input);
        if (!message) {
            if (api) api.clearQtyInvalid(input);
            else {
                input.classList.remove('is-invalid', 'jp-npl-qty-invalid');
                input.removeAttribute('aria-invalid');
            }
            delete input.dataset.jpNplQtyPopupKey;
            return null;
        }
        if (api) api.markQtyInvalid(input);
        else {
            input.classList.add('is-invalid', 'jp-npl-qty-invalid');
            input.setAttribute('aria-invalid', 'true');
        }
        if (showPopup && input.dataset.jpNplQtyPopupKey !== message) {
            input.dataset.jpNplQtyPopupKey = message;
            api?.show({
                items: [message],
                title: 'Số lượng không hợp lệ',
                hint: 'Vui lòng kiểm tra lại số lượng nhập trước khi lưu.',
            });
        }
        return message;
    }

    function refreshStocktakeQtyInvalidStates() {
        rows.forEach(function (row) {
            const input = rowActualInput(row);
            validateStocktakeQty(input, false);
        });
    }

    document.addEventListener('jp-npl-validation-modal-hidden', refreshStocktakeQtyInvalidStates);

    tbody.addEventListener('input', function (e) {
        if (e.target.matches('input[name$="-actual_qty"]')) {
            validateStocktakeQty(e.target, isCompleteQtyValue(e.target.value));
            if (activeFilter !== 'all') applyFilter();
        }
    });

    tbody.addEventListener('change', function (e) {
        if (e.target.matches('input[name$="-actual_qty"]')) {
            validateStocktakeQty(e.target, true);
        }
    });

    const countForm = document.getElementById('count-form');
    countForm?.addEventListener('submit', function (e) {
        const messages = [];
        const seen = new Set();
        rows.forEach(function (row) {
            const input = rowActualInput(row);
            const message = validateStocktakeQty(input, false);
            if (message && !seen.has(message)) {
                seen.add(message);
                messages.push(message);
            }
        });
        if (!messages.length) return;
        e.preventDefault();
        const api = window.jpNplValidationPopup;
        if (api) {
            api.show({
                items: messages,
                title: 'Số lượng không hợp lệ',
                hint: 'Vui lòng kiểm tra lại số lượng nhập trước khi lưu.',
            });
        }
        const firstInvalid = tbody.querySelector('input[name$="-actual_qty"].is-invalid');
        firstInvalid?.focus();
    });

    applyFilter();
})();
</script>
