{% with palette_colors=form.color.field.queryset %}
{% if palette_colors %}
<div class="jp-npl-form-color-palette-wrap" data-jp-form-color-palette>
    <button type="button" class="btn btn-outline-secondary btn-sm mt-2" data-jp-palette-toggle
            aria-expanded="false" aria-controls="jp-npl-form-color-palette">
        <i class="bi bi-palette me-1"></i>Chọn từ bảng màu
    </button>
    <div class="jp-npl-form-color-palette d-none mt-2" id="jp-npl-form-color-palette">
        <button type="button" class="jp-npl-form-color-option" data-jp-color-id="" title="Không chọn màu">
            <span class="jp-npl-color-swatch jp-npl-form-color-swatch-none" aria-hidden="true"></span>
            <span class="jp-npl-color-name">— Không màu</span>
        </button>
        {% for c in palette_colors %}
        <button type="button" class="jp-npl-form-color-option" data-jp-color-id="{{ c.pk }}"
                title="{{ c.name }} — {{ c.hex_code }}">
            <span class="jp-npl-color-swatch" style="background-color: {{ c.hex_code }};" aria-hidden="true"></span>
            <span class="jp-npl-color-name">{{ c.name }}</span>
        </button>
        {% endfor %}
    </div>
</div>
<style>
.jp-npl-form-color-palette {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(8.5rem, 1fr));
    gap: 0.25rem;
    max-height: 16rem;
    overflow-y: auto;
    padding: 0.5rem;
    border: 1px solid rgba(0, 0, 0, 0.12);
    border-radius: 0.5rem;
    background: #fff;
}
.jp-npl-form-color-option {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    padding: 0.25rem 0.4rem;
    font-size: 0.82rem;
    text-align: left;
    background: transparent;
    border: 1px solid transparent;
    border-radius: 0.35rem;
    cursor: pointer;
    min-width: 0;
}
.jp-npl-form-color-option:hover {
    background: rgba(0, 0, 0, 0.05);
}
.jp-npl-form-color-option.is-selected {
    border-color: var(--hm-red, #dc2626);
    background: rgba(220, 38, 38, 0.06);
}
.jp-npl-form-color-swatch-none {
    background:
        linear-gradient(to top left,
            transparent 46%, rgba(220, 38, 38, 0.85) 47%,
            rgba(220, 38, 38, 0.85) 53%, transparent 54%),
        #fff;
}
</style>
<script>
(function () {
    var wrap = document.querySelector('[data-jp-form-color-palette]');
    var select = document.getElementById('{{ form.color.id_for_label }}');
    if (!wrap || !select) return;

    var toggle = wrap.querySelector('[data-jp-palette-toggle]');
    var panel = wrap.querySelector('.jp-npl-form-color-palette');
    var options = wrap.querySelectorAll('[data-jp-color-id]');

    toggle.addEventListener('click', function () {
        var hidden = panel.classList.toggle('d-none');
        toggle.setAttribute('aria-expanded', hidden ? 'false' : 'true');
    });

    function markSelected() {
        var value = select.value || '';
        options.forEach(function (btn) {
            btn.classList.toggle('is-selected', btn.getAttribute('data-jp-color-id') === value);
        });
    }

    options.forEach(function (btn) {
        btn.addEventListener('click', function () {
            var value = btn.getAttribute('data-jp-color-id');
            if (select.tomselect) {
                select.tomselect.setValue(value);
            } else {
                select.value = value;
                select.dispatchEvent(new Event('change', { bubbles: true }));
            }
            markSelected();
        });
    });

    select.addEventListener('change', markSelected);
    markSelected();
})();
</script>
{% endif %}
{% endwith %}
