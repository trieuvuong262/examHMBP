{% if list_columns and table_id %}
<div class="dropdown jp-npl-col-picker">
    <button type="button" class="btn btn-outline-secondary btn-sm fw-bold"
            data-bs-toggle="dropdown" data-bs-auto-close="outside" aria-expanded="false"
            title="Chọn cột">
        <i class="bi bi-layout-three-columns me-1"></i>Cột
    </button>
    <div class="dropdown-menu dropdown-menu-end shadow-sm jp-npl-col-picker-menu p-2">
        {% for col in list_columns %}
        <div class="form-check px-2 py-1">
            <input class="form-check-input npl-col-toggle" type="checkbox"
                   id="npl-col-{{ table_id }}-{{ col.key }}"
                   data-table="{{ table_id }}" data-col="{{ col.key }}"
                   {% if col.default %}checked{% endif %}
                   {% if col.required %}disabled checked{% endif %}>
            <label class="form-check-label small" for="npl-col-{{ table_id }}-{{ col.key }}">{{ col.label }}</label>
        </div>
        {% endfor %}
    </div>
</div>
{% endif %}
