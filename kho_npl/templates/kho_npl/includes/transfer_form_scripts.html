<script>
(function () {
    const body = document.getElementById('lines-body');
    const tmpl = document.getElementById('empty-row-template');
    const totalForms = document.getElementById('id_lines-TOTAL_FORMS');
    const form = document.getElementById('transfer-form');
    const searchUrl = form?.dataset.materialSearchUrl || '';
    const materialInstances = new WeakMap();

    function renderMaterialOption(data, escape) {
        const code = escape(data.code || (data.text || '').split(' — ')[0] || '');
        const name = escape(data.name || '');
        const unit = escape(data.unit || '');
        const title = escape(data.text || '');
        if (name) {
            return '<div class="jp-npl-material-option" title="' + title + '">'
                + '<span class="jp-npl-material-option-code">' + code + '</span>'
                + '<span class="jp-npl-material-option-name">' + name + '</span>'
                + (unit ? '<span class="jp-npl-material-option-unit">' + unit + '</span>' : '')
                + '</div>';
        }
        return '<div class="jp-npl-material-option"><span class="jp-npl-material-option-code">' + escape(data.text || '') + '</span></div>';
    }

    function initMaterialSelect(select) {
        if (!select || materialInstances.has(select) || typeof TomSelect === 'undefined') return;
        const ts = new TomSelect(select, {
            maxOptions: 40,
            maxItems: 1,
            valueField: 'id',
            labelField: 'text',
            searchField: ['text', 'code', 'name'],
            placeholder: select.dataset.placeholder || 'Gõ mã hoặc tên NPL...',
            dropdownParent: 'body',
            openOnFocus: true,
            loadThrottle: 220,
            shouldLoad: function () {
                return true;
            },
            load: function (query, callback) {
                if (!searchUrl) {
                    callback();
                    return;
                }
                fetch(searchUrl + '?q=' + encodeURIComponent(query || ''), {
                    headers: { 'Accept': 'application/json' },
                })
                    .then(function (r) { return r.json(); })
                    .then(function (data) { callback(data.results || []); })
                    .catch(function () { callback(); });
            },
            render: {
                option: renderMaterialOption,
                item: function (data, escape) {
                    const code = escape(data.code || (data.text || '').split(' — ')[0] || data.text || '');
                    const unit = data.unit ? ' <span class="jp-npl-material-item-unit">(' + escape(data.unit) + ')</span>' : '';
                    return '<div class="jp-npl-material-item"><span class="jp-npl-material-item-code">' + code + '</span>' + unit + '</div>';
                },
                no_results: function () {
                    return '<div class="px-2 py-2 text-muted small">Không tìm thấy NPL — thử mã hoặc tên khác</div>';
                },
                loading: function () {
                    return '<div class="px-2 py-2 text-muted small">Đang tìm...</div>';
                },
            },
            onInitialize: function () {
                const wrapper = this.wrapper;
                if (wrapper) {
                    wrapper.classList.add('jp-npl-material-ts');
                }
            },
        });
        materialInstances.set(select, ts);
    }

    function initAllMaterialSelects(root) {
        (root || document).querySelectorAll('select.jp-npl-material-select').forEach(initMaterialSelect);
    }

    if (!body || !tmpl || !totalForms) return;

    initAllMaterialSelects(body);

    document.getElementById('add-row')?.addEventListener('click', function () {
        const idx = parseInt(totalForms.value, 10);
        const html = tmpl.innerHTML.replace(/__prefix__/g, idx);
        body.insertAdjacentHTML('beforeend', html);
        totalForms.value = idx + 1;
        const rows = body.querySelectorAll('.line-row');
        const lastRow = rows[rows.length - 1];
        if (lastRow) {
            initMaterialSelect(lastRow.querySelector('select.jp-npl-material-select'));
        }
    });

    body.addEventListener('click', function (e) {
        const btn = e.target.closest('.remove-row');
        if (!btn) return;
        const row = btn.closest('.line-row');
        const select = row?.querySelector('select.jp-npl-material-select');
        const ts = select ? materialInstances.get(select) : null;
        if (ts) {
            ts.destroy();
            materialInstances.delete(select);
        }
        const del = row.querySelector('input[type=checkbox][name$="-DELETE"]');
        if (del) { del.checked = true; row.classList.add('d-none'); }
        else { row.remove(); }
    });
})();
</script>
