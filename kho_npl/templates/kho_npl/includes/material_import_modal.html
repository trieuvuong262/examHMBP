<style>
.jp-npl-import-steps { display: flex; gap: 0.35rem; flex-wrap: wrap; margin-bottom: 1rem; }
.jp-npl-import-step {
    flex: 1 1 auto; font-size: 0.75rem; color: var(--bs-secondary-color);
    padding: 0.35rem 0.5rem; border: 1px dashed var(--bs-border-color);
    border-radius: 0.35rem; text-align: center; white-space: nowrap;
}
.jp-npl-import-step.is-active {
    color: var(--hm-red, #dc2626); border-color: rgba(220, 38, 38, 0.45);
    background: rgba(220, 38, 38, 0.05); font-weight: 600;
}
.jp-npl-import-drop {
    border: 2px dashed var(--bs-border-color); border-radius: 0.5rem;
    padding: 1.25rem 1rem; text-align: center; cursor: pointer;
    transition: border-color .15s ease, background .15s ease;
}
.jp-npl-import-drop.is-dragover, .jp-npl-import-drop:hover {
    border-color: rgba(220, 38, 38, 0.5); background: rgba(220, 38, 38, 0.04);
}
.jp-npl-import-drop.has-file {
    border-style: solid; border-color: rgba(25, 135, 84, 0.45);
    background: rgba(25, 135, 84, 0.05);
}
.jp-npl-import-file-meta { font-size: 0.8125rem; word-break: break-all; }
.jp-npl-import-cols { display: flex; flex-wrap: wrap; gap: 0.35rem; }
.jp-npl-import-col-badge {
    font-size: 0.7rem; padding: 0.2rem 0.45rem; border-radius: 0.25rem;
    background: var(--bs-light); border: 1px solid var(--bs-border-color);
}
.jp-npl-import-col-badge.is-required {
    border-color: rgba(220, 38, 38, 0.35); color: var(--hm-red, #dc2626);
}
</style>
<div class="modal fade" id="nplImportModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <form action="{% url 'kho_npl:material_import' %}" method="post" enctype="multipart/form-data"
              class="modal-content border-0 shadow" id="npl-import-form">
            {% csrf_token %}
            <div class="modal-header border-0 pb-0">
                <h5 class="modal-title fw-bold">Nhập từ Excel</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Đóng"></button>
            </div>
            <div class="modal-body">
                <div class="jp-npl-import-steps">
                    <span class="jp-npl-import-step">1. Tải mẫu</span>
                    <span class="jp-npl-import-step">2. Điền dữ liệu</span>
                    <span class="jp-npl-import-step is-active">3. Chọn file</span>
                </div>
                <div class="d-flex flex-wrap gap-2 mb-3">
                    <a href="{% url 'kho_npl:material_import_template' %}" class="btn btn-outline-hm btn-sm fw-bold">
                        <i class="bi bi-download me-1"></i>Tải file mẫu
                    </a>
                    <a href="{% url 'kho_npl:material_export' %}" class="btn btn-outline-secondary btn-sm fw-bold">
                        <i class="bi bi-box-arrow-up-right me-1"></i>Xuất danh mục hiện tại
                    </a>
                </div>
                <div class="mb-2">
                    <div class="small fw-semibold text-muted mb-1">Cột bắt buộc</div>
                    <div class="jp-npl-import-cols">
                        <span class="jp-npl-import-col-badge is-required">Mã NPL</span>
                        <span class="jp-npl-import-col-badge is-required">Tên NPL</span>
                        <span class="jp-npl-import-col-badge is-required">Mã nhóm</span>
                        <span class="jp-npl-import-col-badge is-required">Mã ĐVT</span>
                        <span class="jp-npl-import-col-badge">Màu</span>
                        <span class="jp-npl-import-col-badge">Quy cách</span>
                        <span class="jp-npl-import-col-badge">Mã NCC</span>
                        <span class="jp-npl-import-col-badge">Tồn tối thiểu</span>
                    </div>
                </div>
                <label class="jp-npl-import-drop d-block mb-0" id="npl-import-drop" for="npl-excel-file">
                    <input type="file" class="d-none" id="npl-excel-file" name="excel_file" accept=".xlsx,.xls" required>
                    
                    <div class="fw-semibold" id="npl-import-drop-title">Kéo thả file hoặc bấm để chọn</div>
                    <div class="small text-muted" id="npl-import-drop-hint">.xlsx, .xls — trùng mã sẽ cập nhật</div>
                    <div class="jp-npl-import-file-meta fw-semibold text-success mt-2 d-none" id="npl-import-file-meta"></div>
                </label>
            </div>
            <div class="modal-footer border-0 pt-0">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Huỷ</button>
                <button type="submit" class="btn btn-hm fw-bold" id="npl-import-submit" disabled>
                    <span class="jp-npl-import-submit-label"><i class="bi bi-upload me-1"></i>Nhập dữ liệu</span>
                    <span class="jp-npl-import-submit-loading d-none">
                        <span class="spinner-border spinner-border-sm me-1" role="status" aria-hidden="true"></span>Đang xử lý...
                    </span>
                </button>
            </div>
        </form>
    </div>
</div>
