<script>
(function () {
    try {
        if (sessionStorage.getItem('jp_npl_catalog_loading')) {
            document.documentElement.classList.add('jp-npl-catalog-pending-load');
        }
    } catch (e) {}
})();
</script>
<style>
body.jp-npl-catalog-loading-active,
html.jp-npl-catalog-pending-load body {
    overflow: hidden;
}
html.jp-npl-catalog-pending-load .jp-npl-material-catalog-page,
html.jp-npl-catalog-pending-load .jp-npl-stocktake-page {
    visibility: hidden;
}
#jpNplCatalogLoading.jp-tool-loading {
    z-index: 2000;
}
</style>
<div id="jpNplCatalogLoading" class="jp-tool-loading d-none"
     aria-hidden="true"
     role="alertdialog" aria-labelledby="jpNplCatalogLoadingMsg" aria-modal="true"
     data-default-message="Đang tải dữ liệu…">
    <div class="jp-tool-loading-panel">
        <div class="jp-tool-loading-spinner" aria-hidden="true"></div>
        <p id="jpNplCatalogLoadingMsg" class="jp-tool-loading-msg mb-0">Đang tải dữ liệu…</p>
    </div>
</div>
