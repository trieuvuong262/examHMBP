<style>
.jp-npl-mat-lightbox-img {
    max-height: min(80vh, 42rem);
    width: auto;
    margin: 0 auto;
}
.jp-npl-mat-preview-img {
    max-width: 100%;
    max-height: 14rem;
    object-fit: contain;
    border-radius: 0.5rem;
    border: 1px solid var(--bs-border-color);
    background: var(--bs-light);
}
.jp-npl-mat-preview-btn:hover .jp-npl-mat-preview-img {
    border-color: rgba(220, 38, 38, 0.45);
}
.jp-npl-mat-preview-empty {
    padding: 2rem 1rem;
    text-align: center;
    border: 1px dashed var(--bs-border-color);
    border-radius: 0.5rem;
    background: var(--bs-light);
}
</style>
<div class="modal fade" id="nplMaterialImageModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg modal-dialog-scrollable">
        <div class="modal-content border-0 shadow-lg">
            <div class="modal-header border-0 pb-0">
                <h6 class="modal-title fw-bold text-truncate pe-3" id="nplMaterialImageModalTitle"></h6>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Đóng"></button>
            </div>
            <div class="modal-body pt-2 pb-4 text-center">
                <img src="" alt="" id="nplMaterialImageModalImg" class="img-fluid rounded jp-npl-mat-lightbox-img">
            </div>
        </div>
    </div>
</div>
<script>
(function () {
    var modalEl = document.getElementById('nplMaterialImageModal');
    if (!modalEl || modalEl.dataset.nplBound) return;
    modalEl.dataset.nplBound = '1';
    var imgEl = document.getElementById('nplMaterialImageModalImg');
    var titleEl = document.getElementById('nplMaterialImageModalTitle');
    document.addEventListener('click', function (e) {
        var btn = e.target.closest('[data-npl-material-image]');
        if (!btn) return;
        e.preventDefault();
        var url = btn.getAttribute('data-npl-material-image');
        if (!url || !imgEl) return;
        imgEl.src = url;
        imgEl.alt = btn.getAttribute('data-npl-material-image-title') || '';
        if (titleEl) {
            titleEl.textContent = btn.getAttribute('data-npl-material-image-title') || '';
        }
        bootstrap.Modal.getOrCreateInstance(modalEl).show();
    });
    modalEl.addEventListener('hidden.bs.modal', function () {
        if (imgEl) imgEl.src = '';
    });
})();
</script>
