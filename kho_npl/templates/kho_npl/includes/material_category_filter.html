<select name="category" id="{{ select_id }}" class="form-select form-select-sm jp-npl-multi-select" multiple
        data-placeholder="Nhóm" aria-label="Nhóm">
    {% for category in category_roots %}
    <option value="{{ category.id }}" {% if category.id in selected_categories %}selected{% endif %}>
        {{ category.name }}
    </option>
    {% endfor %}
</select>
