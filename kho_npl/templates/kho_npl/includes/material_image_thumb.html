{% if material.image %}
<button type="button" class="jp-npl-mat-avatar-btn"
        data-npl-material-image="{{ material.image.url }}"
        data-npl-material-image-title="{{ material.code }} — {{ material.name }}"
        title="Xem ảnh {{ material.code }}">
    <img src="{{ material.image.url }}" alt="" class="jp-npl-mat-avatar" loading="lazy">
</button>
{% else %}
<span class="jp-npl-mat-avatar jp-npl-mat-avatar--empty" title="Chưa có ảnh — {{ material.code }}">
    <i class="bi bi-image" aria-hidden="true"></i>
</span>
{% endif %}
