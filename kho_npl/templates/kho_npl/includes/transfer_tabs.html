<nav class="jp-npl-transfer-tabs mb-3 mb-md-4" aria-label="Chuyển kho">
    <ul class="nav nav-pills flex-wrap gap-2">
        {% for key, label in tab_choices %}
        <li class="nav-item">
            <a href="{% url 'kho_npl:transfer_hub' %}?tab={{ key }}"
               class="nav-link d-inline-flex align-items-center gap-2 {% if tab == key %}active{% endif %}">
                {% if key == 'nhap' %}
                <i class="bi bi-plus-circle" aria-hidden="true"></i>
                {% elif key == 'chuyen' %}
                <i class="bi bi-arrow-left-right" aria-hidden="true"></i>
                {% else %}
                <i class="bi bi-inbox" aria-hidden="true"></i>
                {% endif %}
                <span>{{ label }}</span>
                {% if tab_counts and key != 'nhap' %}
                <span class="jp-npl-transfer-tab-count">
                    {% if key == 'chuyen' %}{{ tab_counts.chuyen }}{% else %}{{ tab_counts.nhan }}{% endif %}
                </span>
                {% endif %}
            </a>
        </li>
        {% endfor %}
    </ul>
</nav>
