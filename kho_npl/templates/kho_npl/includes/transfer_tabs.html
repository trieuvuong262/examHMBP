<div class="jp-npl-transfer-tabs-wrap">
    <nav class="jp-npl-transfer-tabs" aria-label="Phiếu chuyển">
        <ul class="nav nav-pills flex-wrap gap-2 mb-0">
            {% for key, label in tab_choices %}
            <li class="nav-item">
                <a href="{% url 'kho_npl:transfer_hub' %}?tab={{ key }}"
                   class="nav-link d-inline-flex align-items-center gap-2 {% if tab == key %}active{% endif %}">
                    {% if key == 'nhap' %}
                    <i class="bi bi-plus-circle" aria-hidden="true"></i>
                    {% elif key == 'chuyen' %}
                    <i class="bi bi-arrow-left-right" aria-hidden="true"></i>
                    {% elif key == 'nhan' %}
                    <i class="bi bi-inbox" aria-hidden="true"></i>
                    {% else %}
                    <i class="bi bi-list-ul" aria-hidden="true"></i>
                    {% endif %}
                    <span>{{ label }}</span>
                </a>
            </li>
            {% endfor %}
        </ul>
    </nav>
</div>
