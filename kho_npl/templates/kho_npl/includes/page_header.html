<div class="jp-page-header mb-3 mb-md-4">
    <div>
        <h2 class="fw-bold text-hm mb-1 jp-page-title">
            <i class="bi bi-boxes me-2"></i>{{ page_title }}
        </h2>
        {% if page_subtitle %}
        <p class="text-muted mb-0">{{ page_subtitle }}</p>
        {% endif %}
    </div>
    {% if header_actions %}
    <div class="jp-page-header-actions">
        {{ header_actions }}
    </div>
    {% endif %}
</div>
