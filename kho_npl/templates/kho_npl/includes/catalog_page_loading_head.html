<script>
(function () {
    try {
        var msg = sessionStorage.getItem('jp_npl_catalog_loading');
        if (!msg) return;
        document.documentElement.classList.add('jp-npl-catalog-pending-load');
        document.addEventListener('DOMContentLoaded', function () {
            if (document.getElementById('jpNplCatalogLoading')) return;
            var el = document.createElement('div');
            el.id = 'jpNplCatalogLoadingEarly';
            el.className = 'jp-tool-loading';
            el.setAttribute('aria-hidden', 'false');
            el.innerHTML =
                '<div class="jp-tool-loading-panel">' +
                '<div class="jp-tool-loading-spinner" aria-hidden="true"></div>' +
                '<p class="jp-tool-loading-msg mb-0"></p></div>';
            el.querySelector('.jp-tool-loading-msg').textContent = msg;
            document.body.appendChild(el);
        });
    } catch (e) {}
})();
</script>
<style>
body.jp-npl-catalog-loading-active,
html.jp-npl-catalog-pending-load body {
    overflow: hidden;
}
html.jp-npl-catalog-pending-load .jp-npl-material-catalog-page {
    visibility: hidden;
}
</style>
