{% extends 'base.html' %}

{% block content %}
<div class="container jp-page py-3 py-md-4 mb-5">
    {% include 'kho_npl/includes/subnav.html' %}
    <div class="card border-0 shadow-sm">
        <div class="card-body p-4">
            <h2 class="fw-bold text-hm h5 mb-3">Hủy phiếu xuất?</h2>
            <p class="mb-4">Phiếu <strong>{{ issue.number }}</strong> đang ở trạng thái nháp. Hủy sẽ không ảnh hưởng tồn kho.</p>
            <form method="post" class="d-flex gap-2">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger fw-bold">Xác nhận hủy</button>
                <a href="{% url 'kho_npl:issue_detail' issue.pk %}" class="btn btn-outline-secondary">Quay lại</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
