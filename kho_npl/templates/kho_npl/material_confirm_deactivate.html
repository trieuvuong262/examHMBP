{% extends 'base.html' %}

{% block content %}
<div class="container jp-page py-3 py-md-4 mb-5">
    {% include 'kho_npl/includes/subnav.html' %}
    <div class="card border-0 shadow-sm">
        <div class="card-body p-4">
            <h2 class="fw-bold text-hm h5 mb-3">Ngừng sử dụng NPL?</h2>
            <p class="mb-4">Bạn sắp ngừng dùng <strong>{{ material.code }} — {{ material.name }}</strong>. Mã vẫn giữ trong lịch sử phiếu nhập/xuất.</p>
            <form method="post" class="d-flex gap-2">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger fw-bold">Xác nhận ngừng dùng</button>
                <a href="{% url 'kho_npl:material_detail' material.pk %}" class="btn btn-outline-secondary">Huỷ</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
