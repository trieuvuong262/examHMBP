{% extends 'base.html' %}

{% block content %}
<div class="container jp-page py-3 py-md-4 mb-5">
    <div class="jp-page-header mb-3 mb-md-4">
        <h2 class="fw-bold text-hm mb-1 jp-page-title">
            Xóa phiếu chuyển
        </h2>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-body p-4">
            <p class="mb-4">Phiếu <strong>{{ transfer.number }}</strong> chưa chuyển đi — xóa sẽ không ảnh hưởng tồn kho.</p>
            <form method="post" class="d-flex flex-wrap gap-2">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger fw-bold">Xác nhận xóa</button>
                <a href="{{ list_url }}" class="btn btn-outline-secondary">Quay lại danh sách</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
