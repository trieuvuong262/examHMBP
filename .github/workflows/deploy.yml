# Tự deploy lên VPS khi push lên branch main.
#
# Cấu hình GitHub Secrets (Settings → Secrets and variables → Actions):
#   VPS_HOST      — IP hoặc domain VPS (vd: 103.90.224.203)
#   VPS_USER      — user SSH (vd: root)
#   VPS_SSH_KEY   — private key SSH (PEM), public key đã add vào ~/.ssh/authorized_keys trên VPS
#   VPS_PORT      — (tuỳ chọn) cổng SSH, mặc định 22
#
# Trên VPS cần:
#   - Clone repo tại /opt/portaljustplay
#   - chmod +x deploy.sh
#   - Git pull được (SSH deploy key VPS → GitHub, hoặc repo public)

name: Deploy PortalJustPlay

# CHỈ chạy khi bấm tay (Actions → Deploy PortalJustPlay → Run workflow).
#
# Đường deploy chính là `update.cmd` / `publish.ps1` từ máy dev: push xong SSH
# thẳng vào VPS chạy ./deploy.sh (deploy.local.env có DEPLOY_AFTER_PUSH=1).
# Nếu bật lại `on: push`, mỗi lần publish sẽ có HAI tiến trình deploy.sh chạy
# song song trên cùng /opt/portaljustplay — tranh lock docker, build 2 lượt và
# có thể `git reset --hard` giữa lúc lượt kia đang build. `concurrency` bên dưới
# chỉ chặn được các run của Actions, không chặn được lượt SSH từ máy dev.
#
# Muốn dùng Actions làm đường chính: bỏ comment `push` ở đây VÀ đặt
# DEPLOY_AFTER_PUSH=0 trong deploy.local.env.
on:
  # push:
  #   branches:
  #     - main
  workflow_dispatch:

concurrency:
  group: deploy-portaljustplay
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 25m
          script: |
            set -Eeuo pipefail
            cd /opt/portaljustplay
            git remote -v
            ./deploy.sh

      - name: Summary
        if: success()
        run: echo "Deploy finished on ${{ secrets.VPS_HOST }}"
