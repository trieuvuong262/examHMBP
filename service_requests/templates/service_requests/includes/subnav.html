<nav class="jp-tasks-subnav mb-2" aria-label="Loại yêu cầu">
    <div class="jp-tab-pills d-flex flex-wrap gap-2">
        <a href="{% url 'service_requests:my' %}?loai=procurement"
           class="btn btn-sm {% if flow_tab == 'procurement' %}btn-hm{% else %}btn-outline-secondary{% endif %}">
            <i class="bi bi-cart-check me-1"></i>Mua hàng
        </a>
        <a href="{% url 'service_requests:my' %}?loai=it_repair"
           class="btn btn-sm {% if flow_tab == 'it_repair' %}btn-hm{% else %}btn-outline-secondary{% endif %}">
            <i class="bi bi-pc-display me-1"></i>Sửa chữa IT
        </a>
    </div>
</nav>
<nav class="jp-tasks-subnav mb-3 mb-md-4" aria-label="Yêu cầu nội bộ">
    <div class="jp-tab-pills d-flex flex-wrap gap-2">
        <a href="{% url 'service_requests:my' %}?loai={{ flow_tab|default:'procurement' }}"
           class="btn btn-sm {% if request.resolver_match.url_name == 'my' %}btn-hm{% else %}btn-outline-secondary{% endif %}">
            Yêu cầu của tôi
        </a>
        <a href="{% url 'service_requests:pending' %}?loai={{ flow_tab|default:'procurement' }}"
           class="btn btn-sm {% if request.resolver_match.url_name == 'pending' %}btn-hm{% else %}btn-outline-secondary{% endif %}">
            Chờ tôi xử lý
            {% if pending_count %}<span class="badge bg-danger ms-1">{{ pending_count }}</span>{% endif %}
        </a>
        {% if flow_tab == 'it_repair' %}
        <a href="{% url 'service_requests:create_it_repair' %}"
           class="btn btn-sm {% if request.resolver_match.url_name == 'create_it_repair' %}btn-hm{% else %}btn-outline-secondary{% endif %}">
            <i class="bi bi-plus-lg me-1"></i>Báo hỏng IT
        </a>
        {% else %}
        <a href="{% url 'service_requests:create' %}"
           class="btn btn-sm {% if request.resolver_match.url_name == 'create' %}btn-hm{% else %}btn-outline-secondary{% endif %}">
            <i class="bi bi-plus-lg me-1"></i>Gửi yêu cầu mua
        </a>
        {% if can_manage_catalog %}
        <a href="{% url 'service_requests:catalog_list' %}"
           class="btn btn-sm {% if 'catalog' in request.resolver_match.url_name %}btn-hm{% else %}btn-outline-secondary{% endif %}">
            Danh mục định kỳ
        </a>
        {% endif %}
        {% endif %}
    </div>
</nav>
